<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P&amp;L Ejecutivo</title>
<style>
  :root{--bg:#f5f7fa;--bg2:#ffffff;--bg3:#eef2f7;--border:#d8dee8;--text:#0f172a;--text2:#334155;--blue:#0a6ed1;--green:#117a3d;--red:#b3261e;--amber:#b06d00;--danger-soft:rgba(179,38,30,.08);--on-primary:#fff}
  :root[data-theme="dark"]{--bg:#0f1822;--bg2:#182331;--bg3:#1f2c3d;--border:rgba(226,232,240,.14);--text:#e6edf6;--text2:#c5cfdc;--blue:#4ea3e0;--green:#4cb27b;--red:#e0716b;--amber:#d4a042;--danger-soft:rgba(224,113,107,.14);--on-primary:#0f172a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:24px}
  h1{font-size:18px;letter-spacing:1px;color:var(--blue);margin-bottom:2px}
  .sub{font-size:11px;color:var(--text2);margin-bottom:18px}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:16px}
  .panel h2{font-size:11px;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;margin-bottom:12px;font-weight:600}
  .controls{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px;min-width:140px}
  .field label{font-size:10px;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
  .field select,.field input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;font-size:12px;border-radius:4px;font-family:inherit}
  .btn{background:var(--blue);color:var(--on-primary);border:none;padding:7px 18px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .kpi-label{font-size:9px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
  .kpi-val{font-size:18px;font-weight:600}
  .kpi-val.pos{color:var(--green)} .kpi-val.neg{color:var(--red)} .kpi-val.neu{color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{text-align:right;padding:7px 9px;color:var(--text2);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
  th.left{text-align:left}
  td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--border)}
  td.left{text-align:left;color:var(--text2)}
  tr:hover td{background:var(--bg3)}
  .placeholder{text-align:center;padding:48px 20px;color:var(--text2);font-size:12px;line-height:1.7}
  .err{color:var(--red);font-size:11px;padding:8px 12px;background:var(--danger-soft);border-radius:4px;border:1px solid var(--red);margin-top:8px}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  .chart-frame{min-height:280px}
  canvas{display:block;width:100%;height:260px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <h1>P&amp;L EJECUTIVO</h1>
  <div class="sub">Vista consolidada de P&amp;L mensual · dataset <code>pnl_mensual</code></div>

  <div class="panel">
    <h2>Filtros</h2>
    <div class="controls">
      <div class="field">
        <label for="f-rm">Revenue Manager</label>
        <select id="f-rm"><option value="">— Todos —</option></select>
      </div>
      <div class="field">
        <label for="f-fy">Año Fiscal</label>
        <select id="f-fy"><option value="">— Todos —</option></select>
      </div>
      <div class="field">
        <label for="f-cl">Cliente</label>
        <select id="f-cl"><option value="">— Todos —</option></select>
      </div>
      <button class="btn" id="btn-run" type="button">Ver resultados</button>
    </div>
    <div id="err" class="err" hidden></div>
  </div>

  <div id="placeholder" class="placeholder">
    Selecciona los filtros y presiona <strong>Ver resultados</strong> para consultar el P&amp;L mensual.
  </div>

  <div id="results" hidden>
    <div class="panel">
      <h2>KPIs del periodo seleccionado</h2>
      <div id="kpis" class="kpis"></div>
    </div>
    <div class="panel chart-frame">
      <h2>Evolución mensual de revenue y margen</h2>
      <canvas id="chart" width="960" height="260"></canvas>
    </div>
    <div class="panel">
      <h2>Detalle por mes</h2>
      <div id="tbl-wrap"></div>
    </div>
  </div>

  <script src="/static/js/apps/pnl_ejecutivo.js" defer></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
