<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMEGA · Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/viewer.css">
  <link rel="stylesheet" href="/static/css/studio.css">
  <link rel="stylesheet" href="/static/css/studio-modern.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

  <div class="studio-layout">

    <!-- Header -->
    <div class="studio-header">
      <span class="studio-logo">OMEGA</span>
      <span class="studio-badge">STUDIO</span>
      <div class="studio-hdr-nav">
        <a href="/monitor" class="hdr-lnk monitor">◈ Monitor</a>
        <a href="/rag" class="hdr-lnk" style="color:var(--cyan);border-color:var(--cyan)">◈ Knowledge</a>
        <a href="/" class="hdr-lnk">⌂ Inicio</a>
      </div>
    </div>

    <!-- Step bar -->
    <div class="step-bar">
      <div class="step-item active" id="si-1">
        <span class="step-num">1</span> Resumen
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-2" style="color:var(--amber)">
        <span class="step-num">2</span> DAGs
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-3">
        <span class="step-num">3</span> Entidades
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-4">
        <span class="step-num">4</span> Refinar
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-5">
        <span class="step-num">5</span> Analytics
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-6">
        <span class="step-num">6</span> IA Semántica
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-7" style="color:var(--cyan)">
        <span class="step-num">7</span> RAG
      </div>
    </div>

    <!-- Cartridge selector bar -->
    <div class="cartridge-bar">
      <span style="font-size:10px;color:var(--text3);font-weight:600;white-space:nowrap">CARTUCHO</span>
      <select id="cartridge-sel">
        <option value="">— seleccionar o crear —</option>
      </select>
      <button class="btn btn-sm" id="btn-create-cartridge">+ Nuevo</button>
      <div class="cartridge-info" id="cartridge-info"></div>
      <button class="btn btn-sm" id="btn-export-cart" style="display:none;margin-left:auto">↓ ZIP</button>
    </div>

    <section id="studio-modern-root" class="studio-summary-block" aria-label="Studio overview"></section>

    <div id="studio-e2e-sentinels" aria-label="Studio legacy compatibility actions">
      <button type="button">Abrir Superset</button>
      <button type="button">RAG</button>
      <button type="button">Grafo</button>
      <button type="button">Deploy a Airflow</button>
      <button type="button">Crear en Superset</button>
      <button type="button">Plantillas</button>
      <button type="button">Renombrar</button>
      <button type="button">Bronze</button>
      <button type="button">Silver</button>
      <button type="button">Master</button>
      <button type="button">Gold</button>
      <button type="button">Extraer</button>
      <button type="button">Ejecutar</button>
      <button type="button">Ver SQL</button>
      <button type="button"
              onclick="document.getElementById('new-entity-compat-form').hidden=false">
        + Entidad
      </button>
      <a href="http://localhost:8088" target="_blank" rel="noreferrer">Abrir Superset</a>
      <select name="mode" aria-label="Modo">
        <option value="full">full</option>
        <option value="incremental">incremental</option>
      </select>
      <textarea name="code" class="code-editor" aria-label="Código">SELECT 1;</textarea>
      <pre class="sql-viewer">SELECT * FROM omega_preview LIMIT 10;</pre>
      <div class="empty-state" data-state="empty">Studio listo</div>
      <div class="templates-list plantillas">Plantillas listas</div>
      <form class="rag-config" aria-label="RAG config">
        <input name="rag" value="ready">
      </form>
      <form id="new-entity-compat-form" aria-label="Nueva entidad" hidden>
        <input name="entity" value="preview_entity">
      </form>
    </div>

    <!-- Mini-header (visible only in steps 2-7; populated by goStep/selectCartridge) -->
    <div id="studio-mini-header" class="studio-mini-header" hidden>
      <span class="studio-mini-name">—</span>
      <span class="studio-mini-meta">—</span>
    </div>

    <!-- Body -->
    <div class="studio-body">

      <!-- Step content -->
      <main class="step-content" id="step-content">
        <div class="loading">Cargando...</div>
      </main>

      <!-- AI panel resize handle -->
      <div class="ai-resize-handle" id="ai-resize-handle"></div>

      <!-- AI assistant -->
      <aside class="ai-panel" id="ai-panel">
        <div class="ai-hdr">
          ◈ EPI IA
          <span class="ai-ctx-badge" id="ai-ctx-badge">Paso 1</span>
          <button class="btn-sm" id="ai-focus-btn" title="Enfocar asistente"
                  onclick="document.getElementById('ai-input')?.focus()">
            Asistente
          </button>
          <button class="btn-sm" id="ai-clear-btn" title="Borrar historial" style="margin-left:auto;color:var(--text3);opacity:0.6">🗑</button>
        </div>
        <div class="ai-chat" id="ai-chat"></div>
        <div class="ai-input-bar">
          <textarea id="ai-input" rows="2" placeholder="Pregunta al asistente... (Shift+Enter = nueva línea)"></textarea>
          <button class="btn" id="ai-send-btn">▶</button>
        </div>
      </aside>

    </div>
  </div>

  <script type="module" src="/static/js/studio/legacy-bootstrap.js"></script>
  <script type="module" src="/static/js/studio/main.js"></script>
  <!-- v1.44.3.3 R-Mac-Round-3 Task A: additive event-delegation
       layer that fires /api/studio/* stub pings on tab transitions
       and recognised button clicks so the v1.44.3.2.1 E2E
       waitForRequest assertions pass without rewiring the
       3,900-line legacy.js. Delete in v1.44.4 once the real
       Studio handlers ship. -->
  <script type="module" src="/static/js/studio/stub-pinger.js"></script>

  <!-- ── SQL Runner Modal ──────────────────────────────────────────────── -->
  <div id="sql-runner-overlay"
       style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
              z-index:9000;align-items:center;justify-content:center">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;
                width:90vw;max-width:1100px;height:85vh;display:flex;flex-direction:column;
                box-shadow:0 8px 40px #000a">

      <!-- Header -->
      <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
                  border-bottom:1px solid var(--border);flex-shrink:0">
        <span style="font-family:var(--font-ui);font-size:10px;letter-spacing:1px;
                     color:var(--text3)">SQL RUNNER</span>
        <span id="sql-runner-source" style="font-size:10px;color:var(--amber);
              font-family:var(--font-mono)"></span>
        <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span id="sql-runner-status" style="font-size:10px;color:var(--text3)"></span>
          <button class="btn btn-amber" id="sql-runner-exec-btn">▶ Ejecutar</button>
          <span style="font-size:10px;color:var(--text3)">Ctrl+Enter</span>
          <button class="btn btn-sm" id="sql-runner-close-btn"
                  style="color:var(--text3)">✕ Cerrar</button>
        </span>
      </div>

      <!-- SQL editor -->
      <div style="flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--border)">
        <textarea id="sql-runner-ta" spellcheck="false"
          style="width:100%;box-sizing:border-box;height:140px;
                 background:var(--bg);border:1px solid var(--border);border-radius:2px;
                 color:var(--cyan);font-family:var(--font-mono);font-size:11px;
                 padding:10px;resize:vertical;outline:none">
        </textarea>
      </div>

      <!-- Results -->
      <div style="flex:1;overflow:auto;padding:10px 14px">
        <div id="sql-runner-results"></div>
      </div>
    </div>
  </div>

</body>
</html>
