<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ΩMEGA · Studio</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/viewer.css">
  <link rel="stylesheet" href="/static/css/studio.css">
  <link rel="stylesheet" href="/static/css/studio-modern.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

  <div class="studio-layout">

    <div class="studio-header">
      <span class="studio-logo">ΩMEGA</span>
      <span class="studio-badge">STUDIO</span>
      <div class="studio-hdr-nav">
        <a href="/monitor" class="hdr-lnk monitor">◈ Monitor</a>
        <a href="/agents" class="hdr-lnk agents">◈ Agentes</a>
        <a href="/explorer" class="hdr-lnk explorer">◈ Explorer</a>
        <a href="/viewer/lineage" class="hdr-lnk lineage">◈ Lineage</a>
        <a href="/" class="hdr-lnk">⌂ Inicio</a>
      </div>
    </div>

    <div class="step-bar">
      <div class="step-item active" id="si-1">
        <span class="step-num">1</span> Resumen
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item step-warning" id="si-2">
        <span class="step-num">2</span> DAGs
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-3">
        <span class="step-num">3</span> Entidades
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-4">
        <span class="step-num">4</span> Refinar
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-5">
        <span class="step-num">5</span> Analytics
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item" id="si-6">
        <span class="step-num">6</span> IA Semántica
      </div>
      <div class="step-arrow">›</div>
      <div class="step-item step-info" id="si-7">
        <span class="step-num">7</span> RAG
      </div>
    </div>

    <div class="cartridge-bar">
      <span style="font-size:10px;color:var(--text3);font-weight:600;white-space:nowrap">CARTUCHO</span>
      <select id="cartridge-sel" name="cartridge" data-testid="cartridge-picker" aria-label="Cartucho">
        <option value="">— seleccionar o crear —</option>
      </select>
      <button class="btn btn-sm" id="btn-create-cartridge">+ Nuevo</button>
      <div class="cartridge-info" id="cartridge-info"></div>
      <button class="btn btn-sm" id="btn-export-cart" style="display:none;margin-left:auto">↓ ZIP</button>
    </div>

    <section id="studio-modern-root" class="studio-summary-block" aria-label="Studio overview"></section>

    <div id="studio-mini-header" class="studio-mini-header" hidden>
      <span class="studio-mini-name">—</span>
      <span class="studio-mini-meta">—</span>
    </div>

    <div class="studio-body">

      <main class="step-content" id="step-content">
        <div class="loading">Cargando...</div>
      </main>

      <div class="ai-resize-handle" id="ai-resize-handle"></div>

      <aside class="ai-panel" id="ai-panel">
        <div class="ai-hdr">
          ◈ EPI IA
          <span class="ai-ctx-badge" id="ai-ctx-badge">Paso 1</span>
          <button class="btn-sm" id="ai-focus-btn" title="Enfocar asistente">
            Asistente
          </button>
          <button class="btn-sm" id="ai-clear-btn" title="Limpiar historial" aria-label="Limpiar historial del asistente" style="margin-left:auto;color:var(--text3);opacity:0.6">🗑</button>
        </div>
        <div class="ai-capabilities" id="ai-capabilities" aria-label="Acciones rápidas del asistente">
          <div class="ai-cap-title">
            <span id="ai-cap-title-text">Autopilot Studio</span>
            <small id="ai-cap-subtitle">dry-run primero</small>
          </div>
          <div class="ai-quick-actions" id="ai-quick-actions">
            <button type="button" data-ai-prompt="autopilot_sample">Crear desde sample</button>
            <button type="button" data-ai-prompt="self_check">Self-check</button>
            <button type="button" data-ai-prompt="introspect">Introspectar</button>
          </div>
        </div>
        <div class="ai-chat" id="ai-chat"></div>
        <div class="ai-input-bar">
          <textarea id="ai-input" rows="2" placeholder="Pregunta al asistente... (Shift+Enter = nueva línea)"></textarea>
          <button class="btn" id="ai-send-btn">▶</button>
        </div>
      </aside>

    </div>
  </div>

  <script type="module" src="/static/js/studio/legacy-bootstrap.js?v=studio-autopilot-ui5"></script>
  <script type="module" src="/static/js/studio/main.js"></script>
  <script type="module" src="/static/js/studio/action-bridge.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>

  <div id="sql-runner-overlay"
       style="display:none;position:fixed;inset:0;background:var(--backdrop);
              z-index:9000;align-items:center;justify-content:center">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;
                width:90vw;max-width:1100px;height:85vh;display:flex;flex-direction:column;
                box-shadow:var(--shadow-lg)">

      <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
                  border-bottom:1px solid var(--border);flex-shrink:0">
        <span style="font-family:var(--font-ui);font-size:10px;letter-spacing:1px;
                     color:var(--text3)">SQL RUNNER</span>
        <span id="sql-runner-source" style="font-size:10px;color:var(--amber);
              font-family:var(--font-mono)"></span>
        <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span id="sql-runner-status" style="font-size:10px;color:var(--text3)"></span>
          <button class="btn btn-amber" id="sql-runner-exec-btn">▶ Ejecutar</button>
          <span style="font-size:10px;color:var(--text3)">Ctrl+Enter</span>
          <button class="btn btn-sm" id="sql-runner-close-btn"
                  style="color:var(--text3)">✕ Cerrar</button>
        </span>
      </div>

      <div style="flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--border)">
        <textarea id="sql-runner-ta" spellcheck="false"
          style="width:100%;box-sizing:border-box;height:140px;
                 background:var(--bg);border:1px solid var(--border);border-radius:2px;
                 color:var(--cyan);font-family:var(--font-mono);font-size:11px;
                 padding:10px;resize:vertical;outline:none">
        </textarea>
      </div>

      <div style="flex:1;overflow:auto;padding:10px 14px">
        <div id="sql-runner-results"></div>
      </div>
    </div>
  </div>

</body>
</html>
