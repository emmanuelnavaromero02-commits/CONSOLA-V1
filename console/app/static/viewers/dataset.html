<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OMEGA · Dataset Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<style>
/* ── Dataset detail — estilos únicos ── */
.mapping-row  { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); }
.field-source { font-family:var(--font-mono); font-size:11px; color:var(--amber); min-width:200px; }
.field-arrow  { color:var(--text3); }
.field-biz    { font-size:11px; color:var(--text); }
.lineage-row  { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid var(--border); font-size:11px; }
.lin-date  { color:var(--text3); white-space:nowrap; width:100px; flex-shrink:0; font-family:var(--font-mono); }
.lin-batch { color:var(--amber); width:160px; flex-shrink:0; font-family:var(--font-mono); font-size:10px; overflow:hidden; text-overflow:ellipsis; }
.lin-rows  { color:var(--cyan); width:80px; flex-shrink:0; font-family:var(--font-mono); text-align:right; }
.lin-uri   { color:var(--text2); flex:1; font-size:10px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="scanlines"></div>
<div class="viewer-wrap">
  <div class="vheader">
    <h1 id="page-title">DATASET</h1>
    <a href="/viewer/datasets">← Todos los datasets</a>
    <a href="/">← Inicio</a>
  </div>

  <div class="card" id="meta-card">
    <div class="card-title">INFORMACION DEL DATASET</div>
    <div class="meta-grid" id="meta"></div>
  </div>

  <div class="card">
    <div class="tab-bar">
      <div class="tab active" data-tab="sql">SQL DEFINITION</div>
      <div class="tab" data-tab="mapping">COLUMN MAPPING</div>
      <div class="tab" data-tab="lineage">LINEAGE</div>
      <div class="tab" data-tab="preview">PREVIEW</div>
    </div>
    <div style="border:1px solid var(--border); border-top:none; padding:16px;">

      <div class="tab-content active" id="tab-sql">
        <div class="card-title">DEFINICION SQL</div>
        <div class="sql-box" id="sql-def">Cargando...</div>
      </div>

      <div class="tab-content" id="tab-mapping">
        <div class="card-title">MAPEO DE COLUMNAS <span style="font-size:9px;color:var(--text3)">(fuente → término de negocio)</span></div>
        <div id="mapping-list"></div>
      </div>

      <div class="tab-content" id="tab-lineage">
        <div class="card-title">HISTORIAL DE MATERIALIZACION</div>
        <div id="lineage-list"></div>
      </div>

      <div class="tab-content" id="tab-preview">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
          <div class="card-title" style="margin:0">DATOS ACTUALES</div>
          <button class="btn" id="btn-load-preview">↺ Cargar preview</button>
        </div>
        <div class="preview-wrap" id="preview-wrap">
          <div class="empty-state">Haz clic en "Cargar preview" para ver datos</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/viewers/dataset.js"></script>
</body>
</html>
