<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OMEGA · Job Detail</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<style>
/* ── Job-specific styles ── */
.log-entry  { display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--border); font-size:11px; }
.log-ts     { color:var(--text3); white-space:nowrap; width:90px; flex-shrink:0; }
.log-entity { color:var(--amber); width:140px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; }
.log-level  { width:50px; flex-shrink:0; }
.log-level-INFO  { color:var(--cyan); }
.log-level-ERROR { color:var(--red); }
.log-level-WARN  { color:var(--amber); }
.log-msg    { color:var(--text); flex:1; }
.log-detail { font-size:10px; color:var(--text2); margin-top:2px; }
.progress-bar  { background:var(--bg); border:1px solid var(--border); border-radius:3px; height:8px; margin:8px 0; overflow:hidden; }
.progress-fill { height:100%; background:var(--green); box-shadow:0 0 8px var(--green); transition:width .5s; }
.entity-grid   { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
.entity-card   { background:var(--bg); border:1px solid var(--border); padding:8px 12px; border-radius:3px; }
.entity-count  { font-size:14px; font-family:var(--font-mono); }
.entity-ok  { color:var(--cyan); }
.entity-err { color:var(--red); }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="scanlines"></div>
<div class="viewer-wrap">
  <div class="vheader">
    <h1 id="page-title">JOB DETAIL</h1>
    <a href="/viewer/jobs">← Todos los jobs</a>
    <a href="/">← Inicio</a>
  </div>

  <div class="card" id="job-card">
    <div class="card-title">ESTADO DEL JOB</div>
    <div class="meta-grid" id="meta"></div>
    <div class="progress-bar" id="prog-wrap" style="display:none">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="card" id="entities-card" style="display:none">
    <div class="card-title">RESULTADO POR ENTIDAD</div>
    <div class="entity-grid" id="entity-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">LOGS DE EJECUCION</div>
    <div class="refresh-bar">
      <span id="log-count">0 entradas</span>
      <button class="btn" id="btn-refresh">↺ Actualizar</button>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="auto-refresh" checked> Auto-refresh 3s
      </label>
    </div>
    <div id="log-container"></div>
  </div>
</div>

<script src="/static/js/viewers/job.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
