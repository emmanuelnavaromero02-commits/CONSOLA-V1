<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OMEGA · Datasets</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<link rel="stylesheet" href="/static/css/viewer-modern.css">
</head>
<body>
<div class="viewer-wrap">
  <div class="vheader">
    <h1>DATASETS</h1>
    <a href="/">← Inicio</a>
  </div>

  <div class="stat-row" id="stats"></div>

  <div class="filter-row">
    <span id="last-update">Cargando...</span>
    <button class="btn" id="btn-refresh">↺ Actualizar</button>
    <select id="filter-layer">
      <option value="">Todas las capas</option>
      <option value="silver">Silver</option>
      <option value="master">Master</option>
      <option value="gold">Gold</option>
    </select>
    <select id="filter-cartridge">
      <option value="">Todos los cartuchos</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>NOMBRE</th><th>CAPA</th><th>CARTUCHO</th><th>ENTIDAD FUENTE</th>
          <th>COLUMNAS</th><th>ULTIMA ACTUALIZACION</th><th>DETALLE</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="/static/js/viewers/datasets.js"></script>
</body>
</html>
