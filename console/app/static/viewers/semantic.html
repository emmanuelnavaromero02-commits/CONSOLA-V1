<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OMEGA · Semantic Model</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<style>
/* ── Semantic model — estilos únicos ── */
.server-info { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:12px; }
.health-ok  { color:var(--green); }
.health-err { color:var(--red); }
.entity-grid  { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
.entity-card  { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:14px; }
.entity-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.entity-modes { display:flex; gap:4px; flex-wrap:wrap; }
.mode-tag   { padding:1px 6px; border-radius:2px; font-size:9px; font-family:var(--font-mono); }
.mode-full  { background:#1a2a1a; color:#00ff41; border:1px solid #00ff41; }
.mode-delta { background:#1a1a0a; color:#ffb000; border:1px solid #ffb000; }
.mode-patch { background:#0a1a2a; color:#00e5ff; border:1px solid #00e5ff; }
.field-list { max-height:200px; overflow-y:auto; }
.field-row  { display:flex; gap:6px; padding:3px 0; border-bottom:1px solid var(--border); font-size:10px; }
.field-name { color:var(--text); min-width:140px; font-family:var(--font-mono); }
.field-type { color:var(--cyan); min-width:80px; }
.field-key  { color:var(--amber); min-width:60px; }
.watermark-row { display:flex; gap:8px; align-items:center; padding:4px 0; font-size:10px; border-bottom:1px solid var(--border); }
.wm-entity { color:var(--amber); min-width:140px; font-family:var(--font-mono); }
.wm-field  { color:var(--text2); min-width:120px; }
.wm-value  { color:var(--green); font-family:var(--font-mono); flex:1; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="scanlines"></div>
<div class="viewer-wrap">
  <div class="vheader">
    <h1>SEMANTIC MODEL</h1>
    <a href="/">← Inicio</a>
  </div>

  <div class="card" id="server-card">
    <div class="card-title">CARTUCHO</div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <select id="cartridge-sel">
        <option value="replicon">replicon</option>
      </select>
      <button class="btn" id="btn-reload">↺ Recargar</button>
    </div>
    <div class="server-info" id="server-info"></div>
  </div>

  <div id="main-area">
    <div class="empty-state">Selecciona un cartucho para ver su modelo semántico</div>
  </div>
</div>

<script src="/static/js/viewers/semantic.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
