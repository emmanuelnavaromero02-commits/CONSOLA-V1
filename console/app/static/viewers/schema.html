<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OMEGA · Schema Browser</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
<style>
/* ── Schema browser — estilos únicos ── */
.source-select { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.source-select label { font-size:11px; color:var(--text2); }
.source-select select { min-width:280px; }
.partition-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.partition-tag { padding:2px 8px; background:var(--bg); border:1px solid var(--border); border-radius:2px; font-size:10px; color:var(--amber); font-family:var(--font-mono); }
.partition-tag.latest { border-color:var(--green); color:var(--green); }
.type-tag { font-size:10px; color:var(--cyan); font-family:var(--font-mono); }
td { vertical-align:top; }
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="scanlines"></div>
<div class="viewer-wrap">
  <div class="vheader">
    <h1>SCHEMA BROWSER</h1>
    <a href="/">← Inicio</a>
  </div>

  <div class="card">
    <div class="card-title">SELECCIONAR FUENTE</div>
    <div class="source-select">
      <label>Fuente Bronze:</label>
      <select id="source-sel"><option value="">— Cargando fuentes —</option></select>
      <button class="btn" id="btn-load-schema">Ver Schema →</button>
    </div>
  </div>

  <div id="schema-area" style="display:none">
    <div class="card">
      <div class="card-title">INFORMACION DE PARTICIONES</div>
      <div id="partition-info"></div>
      <div style="margin-top:12px">
        <div class="card-title" style="font-size:9px;margin-bottom:6px">SQL PARA ULTIMA PARTICION</div>
        <div class="sql-box" id="sql-latest"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">COLUMNAS</div>
      <div id="cols-wrap"></div>
    </div>

    <div class="card">
      <div class="card-title">PREVIEW DE DATOS <span style="font-size:9px;color:var(--text3)">(5 filas)</span></div>
      <div class="preview-wrap" id="preview-wrap">
        <div class="empty-state">Selecciona una fuente para ver datos</div>
      </div>
    </div>
  </div>
  <div id="loading" class="empty-state" style="display:none">Cargando schema...</div>
</div>

<script src="/static/js/viewers/schema.js"></script>
</body>
</html>
