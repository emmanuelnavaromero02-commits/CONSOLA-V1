<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMEGA · Jobs</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/viewer.css">
</head>
<body>
<div class="crt-overlay"></div>
<div class="scanlines"></div>
<div class="viewer-wrap">
  <div class="vheader">
    <h1>JOBS MONITOR</h1>
    <a href="/">← Inicio</a>
  </div>

  <div class="stat-row" id="stats"></div>

  <div class="refresh-bar">
    <span id="last-update">Cargando...</span>
    <button class="btn" id="btn-refresh">↺ Actualizar</button>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
      <input type="checkbox" id="auto-refresh" checked> Auto-refresh 5s
    </label>
    <select id="filter-status" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:3px 8px;">
      <option value="">Todos</option>
      <option value="running">Running</option>
      <option value="done">Done</option>
      <option value="failed">Failed</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>JOB ID</th><th>TOOL</th><th>ENTIDAD</th><th>MODO</th>
        <th>STATUS</th><th>REGISTROS</th><th>INICIO</th><th>DURACION</th><th>DETALLE</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script src="/static/js/viewers/jobs.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
