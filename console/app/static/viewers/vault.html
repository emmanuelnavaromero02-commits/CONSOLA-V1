<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODecissions · Vault</title>
<link rel="stylesheet" href="/static/css/tokens.css?v=3">
<link rel="stylesheet" href="/static/css/main.css?v=3">
<link rel="stylesheet" href="/static/css/viewer.css?v=3">
<style>
.viewer-wrap { max-width: 1100px; }

/* ── Header ── */
.header-actions { margin-left:auto; display:flex; gap:10px; align-items:center; }

/* ── Tabs ── */
.vtab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:18px; }
.vtab {
  padding:7px 20px; font-size:11px; font-weight:600; font-family:var(--font-ui);
  letter-spacing:.05em; cursor:pointer; border:1px solid transparent;
  border-bottom:none; border-radius:3px 3px 0 0;
  color:var(--text3); background:transparent; transition:color .15s, background .15s;
}
.vtab:hover  { color:var(--text2); background:var(--bg3); }
.vtab.active { border-color:var(--border); border-bottom-color:var(--surface);
               color:var(--primary); background:var(--surface); margin-bottom:-1px; }

/* ── Section header ── */
.section-hdr {
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
  padding-bottom:10px; border-bottom:1px solid var(--border);
}
.section-title { font-family:var(--font-ui); font-size:11px; font-weight:600;
                 color:var(--text2); letter-spacing:.06em; text-transform:uppercase; flex:1; }

/* ── Buttons ── */
.btn-primary {
  border-color: var(--primary); color: #fff; background: var(--primary);
}
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-danger-text { color: var(--danger); border-color: var(--danger); }
.btn-danger-text:hover { background: var(--danger); color: #fff; }

/* ── Table overrides ── */
.vault-table { border:1px solid var(--border); border-radius:4px; overflow:hidden; background:var(--surface); }
.vault-table table { margin:0; background:var(--surface); }
.vault-table th { background:var(--bg3); color:var(--text2); }
.vault-table td { font-size:11px; color:var(--text); background:var(--surface); }
.conn-id  { font-family:var(--font-mono); color:var(--amber); }
.base-url { font-family:var(--font-mono); color:var(--primary); font-size:10px;
            max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            display:inline-block; vertical-align:middle; }
.token-cell { font-family:var(--font-mono); font-size:10px; color:var(--text3); }
.token-revealed { color:var(--success); word-break:break-all; }
.method-badge {
  display:inline-block; padding:1px 7px; border-radius:3px; font-size:9px;
  font-family:var(--font-mono); background:var(--primary-soft);
  color:var(--primary); border:1px solid var(--primary);
}
.actions-cell { white-space:nowrap; }
.actions-cell button { margin-right:4px; }

/* ── Modal ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:var(--backdrop);
  z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--modal-bg); border:1px solid var(--border-strong); border-radius:var(--radius);
  width:min(540px,95vw); display:flex; flex-direction:column;
  box-shadow: var(--shadow-lg);
  color:var(--text);
}
.modal-hdr {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.modal-title { font-family:var(--font-ui); color:var(--text); font-size:14px; font-weight:600; flex:1; }
.modal-body  { padding:18px 16px; display:flex; flex-direction:column; gap:14px; }
.modal-footer {
  display:flex; gap:8px; padding:12px 16px;
  border-top:1px solid var(--border); justify-content:flex-end;
}

/* ── Form ── */
.field-label { font-size:10px; color:var(--text2); letter-spacing:.04em;
               text-transform:uppercase; margin-bottom:4px; font-family:var(--font-ui); font-weight:600; }
.field-input {
  width:100%; box-sizing:border-box; background:var(--input-bg);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  color:var(--text); font-family:var(--font-mono); font-size:12px;
  padding:8px 10px; line-height:1.4;
}
.field-input:focus { outline:none; border-color:var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field-input:read-only { background: var(--bg3); color: var(--text2); }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ── Delete confirm ── */
.modal-box.danger { border-color:var(--danger); }
.modal-box.danger .modal-title { color:var(--danger); }

/* ── Empty / loading / status ── */
.empty-row td { text-align:center; padding:32px; color:var(--text3); font-style:italic; }
.status-bar { font-size:11px; color:var(--text3); margin-bottom:14px;
              display:flex; align-items:center; gap:10px; min-height:18px; }
.status-ok  { color:var(--success); }
.status-err { color:var(--danger); }

/* ── Inline error banner inside modal ── */
.modal-err { color:var(--danger); font-size:12px; display:none; padding:8px 10px;
             background: rgba(179,38,30,.08); border:1px solid var(--danger); border-radius:var(--radius-sm); }
:root[data-theme="dark"] .modal-err { background: rgba(224,113,107,.10); }
</style>
</head>
<body>
<div class="viewer-wrap">

  <div class="vheader">
    <h1>VAULT</h1>
    <a href="/">← Consola</a>
    <div class="header-actions">
      <span style="font-size:10px;color:var(--text3);font-family:var(--font-ui);font-weight:600">CARTUCHO</span>
      <select id="cart-sel" style="height:28px;padding:0 8px;font-size:11px;min-width:160px" aria-label="Cartucho"></select>
      <button type="button" class="btn" id="btn-refresh">↺ Refresh</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="vtab-bar" role="tablist">
    <button type="button" class="vtab active" id="tab-conn"    role="tab" aria-selected="true"  aria-controls="pane-conn">CONEXIONES</button>
    <button type="button" class="vtab"        id="tab-secrets" role="tab" aria-selected="false" aria-controls="pane-secrets">SECRETS</button>
  </div>

  <!-- ── CONEXIONES tab ─────────────────────────────────── -->
  <div id="pane-conn" role="tabpanel" aria-labelledby="tab-conn">
    <div class="section-hdr">
      <span class="section-title">Conexiones del cartucho</span>
      <button type="button" class="btn btn-primary" id="btn-add-conn">+ Agregar</button>
    </div>
    <div id="conn-status" class="status-bar"></div>
    <div class="vault-table">
      <table>
        <thead>
          <tr>
            <th>CONN ID</th>
            <th>BASE URL</th>
            <th>MÉTODO</th>
            <th>TOKEN</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="conn-tbody">
          <tr class="empty-row"><td colspan="5"><span class="loading">Cargando…</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── SECRETS tab ────────────────────────────────────── -->
  <div id="pane-secrets" role="tabpanel" aria-labelledby="tab-secrets" style="display:none">
    <div class="section-hdr">
      <span class="section-title" id="secrets-title">Secrets</span>
      <input id="scope-input" type="text" placeholder="scope" value="platform"
             style="height:28px;padding:0 8px;font-size:11px;width:140px" aria-label="Scope">
      <button type="button" class="btn" id="btn-load-secrets">Cargar</button>
      <button type="button" class="btn btn-primary" id="btn-add-secret">+ Agregar</button>
    </div>
    <div id="secrets-status" class="status-bar"></div>
    <div class="vault-table">
      <table>
        <thead>
          <tr><th>KEY</th><th>VALOR</th><th>ACCIONES</th></tr>
        </thead>
        <tbody id="secrets-tbody">
          <tr class="empty-row"><td colspan="3">Selecciona un scope y presiona Cargar</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- viewer-wrap -->

<!-- ── Add/Edit Connection Modal ── -->
<div class="modal-overlay" id="conn-modal" role="dialog" aria-modal="true" aria-labelledby="conn-modal-title">
  <div class="modal-box">
    <div class="modal-hdr">
      <span class="modal-title" id="conn-modal-title">Nueva conexión</span>
      <button type="button" class="btn-sm" id="btn-close-conn" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div>
          <div class="field-label"><label for="f-cartridge">Cartucho</label></div>
          <input id="f-cartridge" class="field-input" type="text" placeholder="replicon" readonly>
        </div>
        <div>
          <div class="field-label"><label for="f-conn-id">Conn ID</label></div>
          <input id="f-conn-id" class="field-input" type="text" placeholder="analytics" autocomplete="off">
        </div>
      </div>
      <div>
        <div class="field-label"><label for="f-base-url">Base URL</label></div>
        <input id="f-base-url" class="field-input" type="url"
               placeholder="https://tenant.replicon.com/analyticsapi" autocomplete="off">
      </div>
      <div class="field-row">
        <div>
          <div class="field-label"><label for="f-auth-method">Método de autenticación</label></div>
          <select id="f-auth-method" class="field-input" style="height:36px">
            <option value="bearer_token">bearer_token</option>
            <option value="basic">basic</option>
            <option value="api_key">api_key</option>
            <option value="none">none</option>
          </select>
        </div>
        <div>
          <div class="field-label"><label for="f-token">Token / Contraseña</label></div>
          <input id="f-token" class="field-input" type="password" placeholder="••••••••" autocomplete="off">
        </div>
      </div>
      <div>
        <div class="field-label"><label for="f-extra">Campos adicionales <span style="color:var(--text3);font-weight:normal">(JSON opcional)</span></label></div>
        <textarea id="f-extra" class="field-input" rows="3"
                  placeholder='{"username": "user@company.com"}'
                  style="resize:vertical;font-size:11px"></textarea>
      </div>
      <div id="conn-modal-err" class="modal-err" role="alert"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btn-cancel-conn">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btn-save-conn">Guardar</button>
    </div>
  </div>
</div>

<!-- ── Add/Edit Secret Modal ── -->
<div class="modal-overlay" id="secret-modal" role="dialog" aria-modal="true" aria-labelledby="secret-modal-title">
  <div class="modal-box">
    <div class="modal-hdr">
      <span class="modal-title" id="secret-modal-title">Nuevo secret</span>
      <button type="button" class="btn-sm" id="btn-close-secret" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div>
          <div class="field-label"><label for="fs-scope">Scope</label></div>
          <input id="fs-scope" class="field-input" type="text" placeholder="platform" readonly>
        </div>
        <div>
          <div class="field-label"><label for="fs-key">Key</label></div>
          <input id="fs-key" class="field-input" type="text" placeholder="mi_secreto" autocomplete="off">
        </div>
      </div>
      <div>
        <div class="field-label"><label for="fs-value">Valor</label></div>
        <input id="fs-value" class="field-input" type="password" placeholder="valor secreto" autocomplete="off">
      </div>
      <div id="secret-modal-err" class="modal-err" role="alert"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btn-cancel-secret">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btn-save-secret">Guardar</button>
    </div>
  </div>
</div>

<!-- ── Delete confirm modal ── -->
<div class="modal-overlay" id="del-modal" role="dialog" aria-modal="true" aria-labelledby="del-modal-title">
  <div class="modal-box danger">
    <div class="modal-hdr">
      <span class="modal-title" id="del-modal-title">Confirmar eliminación</span>
      <button type="button" class="btn-sm" id="btn-close-del" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div id="del-msg" style="color:var(--text);font-size:13px;line-height:1.6"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btn-cancel-del">Cancelar</button>
      <button type="button" class="btn btn-danger-text" id="del-confirm-btn">Eliminar</button>
    </div>
  </div>
</div>

<script type="module" src="/static/js/viewers/vault.js?v=3" defer></script>
</body>
</html>
