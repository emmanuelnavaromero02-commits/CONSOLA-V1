<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps Analíticas — OMEGA</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body { padding: 0; margin: 0; }
    .gallery-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .gallery-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }
    .gallery-header a {
      font-size: 10px;
      color: var(--text3);
      text-decoration: none;
      font-family: var(--font-mono);
      letter-spacing: 1px;
    }
    .gallery-header a:hover { color: var(--green); }
    .gallery-title {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-accent);
      letter-spacing: 3px;
    }
    .gallery-subtitle {
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .2s, transform .15s;
    }
    .app-card:hover {
      border-color: var(--color-accent);
      transform: translateY(-2px);
    }
    .app-card-icon { font-size: 20px; color: var(--color-accent); }
    .app-card-title {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      letter-spacing: 1px;
    }
    .app-card-desc {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.7;
      flex: 1;
    }
    .app-card-meta {
      font-size: 9px;
      color: var(--text3);
      font-family: var(--font-mono);
    }
    .app-card-btn {
      display: inline-block;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--color-accent);
      border-radius: 4px;
      color: var(--color-accent);
      font-size: 10px;
      font-family: var(--font-mono);
      text-decoration: none;
      text-align: center;
      transition: background .2s;
    }
    .app-card-btn:hover { background: var(--primary-soft); }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text3);
      font-size: 11px;
      line-height: 2;
    }
    .empty-icon { font-size: 36px; margin-bottom: 16px; opacity: .4; }
    .loading-line {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--font-mono);
      animation: blink 1s step-end infinite;
    }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>

  <div class="gallery-shell">
    <div class="gallery-header">
      <a href="/">← INICIO</a>
      <div>
        <div class="gallery-title">▦ APPS ANALÍTICAS</div>
        <div class="gallery-subtitle">APLICACIONES GENERADAS POR IA · DATOS EN TIEMPO REAL</div>
      </div>
    </div>

    <div id="apps-container">
      <div class="loading-line">Cargando aplicaciones...</div>
    </div>
  </div>

  <script src="/static/js/apps_gallery.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
