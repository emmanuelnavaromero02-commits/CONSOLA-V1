<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decisiones — OMEGA</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body { padding: 0; margin: 0; overflow: auto; }
    .shell { max-width: 1400px; margin: 0 auto; padding: 24px 24px 80px; }
    .topbar {
      display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .topbar a.back {
      font-size: 10px; color: var(--text3); font-family: var(--font-mono);
      letter-spacing: 1px; text-decoration: none;
    }
    .topbar a.back:hover { color: var(--green); }
    .title  { font-size: 13px; color: var(--amber); letter-spacing: 3px; font-family: var(--font-mono); }
    .subtitle { font-size: 10px; color: var(--text3); letter-spacing: 1px; margin-top: 4px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .filter-btn {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text2); font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 1px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
    }
    .filter-btn.active { border-color: var(--amber); color: var(--amber); }
    .filter-btn:hover { color: var(--text); }
    .spacer { flex: 1; }
    .btn-primary {
      background: var(--amber); border: none; color: #1a1408;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
      padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 1px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text2); }
    .btn-danger {
      background: transparent; border: 1px solid var(--red);
      color: var(--red); font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 1px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
    }
    .btn-danger:hover { background: var(--danger-soft); }

    /* List table */
    .dec-table {
      width: 100%; border-collapse: collapse; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
      margin-bottom: 24px;
    }
    .dec-table th, .dec-table td {
      text-align: left; padding: 10px 14px; font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .dec-table th {
      font-family: var(--font-mono); font-size: 9px; color: var(--text3);
      letter-spacing: 1.5px; background: var(--bg3); border-bottom: 1px solid var(--border);
    }
    .dec-table tbody tr { cursor: pointer; transition: background .12s; }
    .dec-table tbody tr:hover { background: var(--bg3); }
    .dec-table tbody tr.selected { background: var(--warning-soft); }
    .dec-table td:last-child, .dec-table th:last-child { text-align: right; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
    }
    .b-open    { background: var(--success-soft); color: var(--green); }
    .b-closed  { background: var(--surface-soft); color: var(--text2); }
    .b-overdue { background: var(--danger-soft); color: var(--red); }
    .b-ok      { background: var(--success-soft); color: var(--green); }
    .b-fail    { background: var(--danger-soft); color: var(--red); }

    /* Detail panel */
    .detail {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      padding: 0; overflow: hidden;
    }
    .detail-head {
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 16px;
    }
    .detail-head h2 {
      font-family: var(--font-mono); font-size: 14px; color: var(--text);
      letter-spacing: 1px; margin: 0; flex: 1;
    }
    .detail-meta {
      display: flex; gap: 24px; padding: 12px 22px; background: var(--bg3);
      border-bottom: 1px solid var(--border); font-size: 11px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-lbl  { font-family: var(--font-mono); font-size: 9px; color: var(--text3); letter-spacing: 1.5px; }
    .meta-val  { color: var(--text); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 10px 18px; cursor: pointer; font-family: var(--font-mono); font-size: 10px;
      color: var(--text3); letter-spacing: 1.5px; border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--text2); }
    .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
    .tab-body { padding: 22px; }

    .field-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field-row label {
      font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 1.5px;
    }
    .field-row input, .field-row textarea, .field-row select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 4px; font-family: var(--font-ui); font-size: 12px;
    }
    .field-row textarea { min-height: 80px; resize: vertical; font-family: var(--font-ui); }
    .field-row input:focus, .field-row textarea:focus, .field-row select:focus {
      outline: none; border-color: var(--amber);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* KPI editor */
    .kpi-row {
      display: grid; grid-template-columns: 1.5fr 1.5fr 0.6fr 0.8fr 1fr 1.5fr auto;
      gap: 8px; align-items: end; padding: 8px 0; border-bottom: 1px dashed var(--border);
    }
    .kpi-row > div > label {
      font-family: var(--font-mono); font-size: 9px; color: var(--text3);
      letter-spacing: 1.5px; display: block; margin-bottom: 4px;
    }
    .kpi-row select, .kpi-row input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 6px 8px; border-radius: 4px; font-size: 11px;
      font-family: var(--font-mono);
    }
    .kpi-list-empty {
      padding: 18px; text-align: center; color: var(--text3); font-size: 11px;
      font-family: var(--font-mono);
    }

    /* Bitácora */
    .actions-list { display: flex; flex-direction: column; gap: 8px; }
    .action-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 10px 14px;
    }
    .action-meta {
      display: flex; gap: 12px; font-family: var(--font-mono);
      font-size: 9px; color: var(--text3); letter-spacing: 1px; margin-bottom: 6px;
    }
    .action-actor-agent { color: var(--cyan); }
    .action-text { color: var(--text); font-size: 12px; line-height: 1.6; }
    .action-note { color: var(--text2); font-size: 11px; margin-top: 6px; line-height: 1.5; }

    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--text3);
      font-size: 11px; line-height: 1.8; font-family: var(--font-mono);
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 7vh; z-index: 100;
    }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      width: min(560px, 92vw); max-height: 86vh; overflow: auto;
    }
    .modal-head {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-head h3 {
      margin: 0; font-family: var(--font-mono); font-size: 12px;
      color: var(--amber); letter-spacing: 2px;
    }
    .modal-close { background: transparent; border: none; color: var(--text3); font-size: 18px; cursor: pointer; }
    .modal-body { padding: 20px; }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 14px 20px; border-top: 1px solid var(--border);
    }

    .user-bar {
      display: flex; align-items: center; gap: 12px; margin-left: auto;
      font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 1px;
    }
    .user-bar .me { color: var(--text2); }
    .user-bar .me strong { color: var(--text); }
    .user-bar a { color: var(--text3); text-decoration: none; }
    .user-bar a:hover { color: var(--amber); }
    .role-pill {
      padding: 1px 6px; border-radius: 3px; font-size: 8px; letter-spacing: 1.5px;
      background: var(--bg3); color: var(--text2);
    }
    .role-pill.admin { background: rgba(210,153,34,.15); color: var(--amber); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="back" href="/">← INICIO</a>
      <div>
        <div class="title">▣ DECISIONES</div>
        <div class="subtitle">REGISTRO Y SEGUIMIENTO DE DECISIONES BASADAS EN KPIs</div>
      </div>
      <div class="user-bar" id="user-bar">
        <span class="me">…</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" data-filter="all">TODAS</button>
      <button class="filter-btn" data-filter="open">ABIERTAS</button>
      <button class="filter-btn" data-filter="closed">CERRADAS</button>
      <button class="filter-btn" data-filter="overdue">VENCIDAS</button>
      <div class="spacer"></div>
      <button class="btn-primary" id="btn-new">+ NUEVA DECISIÓN</button>
    </div>

    <div id="list-container">
      <div class="empty-state">Cargando decisiones…</div>
    </div>

    <div id="detail-container"></div>
  </div>

  <!-- New decision modal -->
  <div id="modal-new" style="display:none"></div>

  <script src="/static/js/decisions.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
