<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuración del sistema — ΩMEGA</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/settings.css">
</head>
<body>
  <main id="settings-root" class="settings-page">
    <header class="settings-header">
      <a href="/" class="settings-back" aria-label="Volver al panel">← Volver al panel</a>
      <h1>Settings / Configuración del sistema</h1>
      <p class="settings-subtitle">Edita feature flags, políticas y configuración global. Las credenciales de cartuchos se administran en Vault.</p>
    </header>

    <section id="settings-status" class="settings-status" aria-live="polite">
      Cargando configuración…
    </section>

    <div id="settings-content" class="settings-content" hidden>
    </div>

    <div id="settings-error" class="settings-error" hidden role="alert"></div>
  </main>

  <script type="module" src="/static/js/settings/main.js"></script>
  <script src="/static/js/theme-switch.js" defer></script>
</body>
</html>
