version: 1
datasets:
  - cartridge: sap_hcm
    dataset: manager_hierarchy
    readiness: partial
    reason: "Flat hierarchy: HRP1001Set or PA0001.Sbrtr is missing, so real manager chains are not available."
    blockers:
      - "Extract manager-worker relationships from HRP1001Set or PA0001.Sbrtr."
    evidence:
      - cartridges/sap_hcm/datasets/manager_hierarchy.sql
      - infra/init/80_sap_hcm_datasets_seed.sql
  - cartridge: sap_hcm
    dataset: sap_hcm_org_hierarchy
    readiness: partial
    reason: "Parent-child organizational relationships require HRP1001Set."
    blockers:
      - "Extract HRP1001Set before using this as a real OM hierarchy."
    evidence:
      - cartridges/sap_hcm/datasets/sap_hcm_org_hierarchy.sql
      - infra/init/80_sap_hcm_datasets_seed.sql
  - cartridge: sap_hcm
    dataset: workforce_cost_monthly
    readiness: stub
    reason: "The dataset exposes headcount dimensions with salary/cost values as NULL until PA0008 BasicPay is extracted."
    blockers:
      - "Extract PA0008 BasicPay and define payroll-cost aggregation rules."
    evidence:
      - cartridges/sap_hcm/datasets/workforce_cost_monthly.sql
      - infra/init/80_sap_hcm_datasets_seed.sql
  - cartridge: sap_hcm
    dataset: employees_anomalies
    readiness: partial
    reason: "Most anomaly checks are active, but the invalid-manager check depends on a manager source that is not extracted yet."
    blockers:
      - "Extract HRP1001Set or PA0001.Sbrtr before claiming complete manager-quality anomaly coverage."
    evidence:
      - cartridges/sap_hcm/datasets/employees_anomalies.sql
      - infra/init/80_sap_hcm_datasets_seed.sql
  - cartridge: sap_s4hana
    dataset: cost_center_expense
    readiness: stub
    reason: "Purchase-order to cost-center assignment is missing, so total_expense is NULL by design."
    blockers:
      - "Extract A_PurchaseOrderAccountAssignment and join it to purchase-order lines."
    evidence:
      - cartridges/sap_s4hana/datasets/cost_center_expense.sql
      - infra/init/81_sap_s4hana_datasets_seed.sql
  - cartridge: sap_s4hana
    dataset: inventory_movement_summary
    readiness: partial
    reason: "Current view is header-level; material, quantity, and movement-class detail require item extraction."
    blockers:
      - "Extract A_MaterialDocumentItem for inventory movement detail."
    evidence:
      - cartridges/sap_s4hana/datasets/inventory_movement_summary.sql
      - infra/init/81_sap_s4hana_datasets_seed.sql
  - cartridge: sap_s4hana
    dataset: overdue_billing
    readiness: partial
    reason: "Overdue status is estimated from billing age and does not use FI open-item payment state."
    blockers:
      - "Extract FI open items to distinguish paid from unpaid invoices."
    evidence:
      - cartridges/sap_s4hana/datasets/overdue_billing.sql
      - infra/init/81_sap_s4hana_datasets_seed.sql
  - cartridge: sap_s4hana
    dataset: business_partner_anomalies
    readiness: partial
    reason: "Current checks cover missing addresses and duplicate names; tax-number and blocked-partner checks need additional fields."
    blockers:
      - "Extract fiscal/tax sub-entities and blocking flags before claiming full business-partner anomaly coverage."
    evidence:
      - cartridges/sap_s4hana/datasets/business_partner_anomalies.sql
      - infra/init/81_sap_s4hana_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_compensation_distribution
    readiness: stub
    reason: "paycompValue is protected in bronze and cannot be safely aggregated in SQL; the dataset exposes an empty schema stub."
    blockers:
      - "Define a privacy-safe compensation aggregation design before enabling this dataset."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_compensation_distribution.sql
      - infra/init/82_sap_successfactors_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_recruitment_funnel
    readiness: partial
    reason: "Candidate stages use JobApplication when the tenant exposes it; otherwise the dataset remains requisition-level partial."
    blockers:
      - "Run target=talent metadata readiness and extract JobApplication before promising applied/interview/offer stage detail."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_recruitment_funnel.sql
      - infra/init/82_sap_successfactors_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_recruitment_pipeline
    readiness: partial
    reason: "candidate_pool_total is requisition-linked when JobApplication is metadata-ready; otherwise it stays partial."
    blockers:
      - "Run target=talent metadata readiness and extract JobApplication to count candidates by requisition."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_recruitment_pipeline.sql
      - infra/init/82_sap_successfactors_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_employees_anomalies
    readiness: partial
    reason: "Current checks cover department, manager, and job-code anomalies; active-with-termination needs a validated termination cross-check."
    blockers:
      - "Validate EmpEmploymentTermination joins before claiming full employee anomaly coverage."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_employees_anomalies.sql
      - infra/init/82_sap_successfactors_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_turnover_by_period
    readiness: partial
    reason: "Turnover by period depends on EmpEmploymentTermination, which is blocked by the FEMSA SuccessFactors OAuth client scope."
    blockers:
      - "Enable EmpEmploymentTermination in the FEMSA SuccessFactors OAuth client before materializing turnover_by_period."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_turnover_by_period.sql
      - infra/init/82_sap_successfactors_datasets_seed.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_employee_profile
    readiness: partial
    reason: "Uses validated foundation data only: employee_360 plus manager_hierarchy; C/P/A fields are explicitly null and flagged."
    blockers:
      - "Enable C/P/A entities before treating this as a complete talent profile."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_employee_profile.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_role_profile
    readiness: partial
    reason: "Role profile is derived from job_code/FOJobCode; required skills and position requirements need tenant metadata."
    blockers:
      - "Validate Position and tenant-specific skill/competency entities before claiming full role requirements coverage."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_role_profile.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_mobility_history
    readiness: partial
    reason: "Mobility comes from effective-dated EmpJob history; it is observed movement, not declared career aspiration."
    blockers:
      - "Validate career interest or aspiration entities before using mobility as aspiration evidence."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_mobility_history.sql
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_readiness
    readiness: partial
    reason: "The dataset keeps the readiness contract stable but returns insufficient_data while competency, performance and aspiration are missing."
    blockers:
      - "Validate and extract performance, competency and aspiration entities before calculating Fit Score."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_readiness.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_cpa_scores
    readiness: partial
    reason: "C/P/A score columns are contract-ready but remain insufficient_data until performance, competency and aspiration entities are validated."
    blockers:
      - "Run SuccessFactors metadata preflight for performance reviews, competency/skills MDF and career aspiration entities."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_cpa_scores.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_9box
    readiness: partial
    reason: "The 9-box contract is materialized, but performance and potential bands are blocked until C/P/A components exist."
    blockers:
      - "Enable performance plus competency/aspiration components before calculating 9-box placement."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_9box.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_9box_operational
    readiness: partial
    reason: "Aggregates the native 9-box contract for Control Room; boxes stay blocked when C/P/A is incomplete."
    blockers:
      - "Materialize C/P/A, readiness and 9-box before using this as an operational matrix."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_9box_operational.sql
      - console-next/src/components/control-room/talent/TalentControlRoom.tsx
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_retention_risk
    readiness: partial
    reason: "Retention risk is recommendation-only and excludes sensitive compensation; it depends on Fit Score plus mobility."
    blockers:
      - "Calculate Fit Score from real C/P/A before treating retention risk as actionable."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_retention_risk.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_promotion_alignment
    readiness: partial
    reason: "Promotion alignment uses observed job movements and 9-box placement; calibration entities are still pending."
    blockers:
      - "Validate succession/calibration entities before claiming promotion calibration coverage."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_promotion_alignment.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_calibration_sensitivity
    readiness: partial
    reason: "Sensitivity detects records near 9-box cuts and remains advisory while C/P/A inputs are incomplete."
    blockers:
      - "Validate score distributions and business cuts with real C/P/A values."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_calibration_sensitivity.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_role_fit_assignments
    readiness: partial
    reason: "Role-fit assignments are recommendations from Fit Score and 9-box; Position requirements are not yet authoritative."
    blockers:
      - "Validate Position and required skills metadata before recommending role assignment changes."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_role_fit_assignments.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_action_candidates
    readiness: partial
    reason: "Action candidates are read-only Control Room recommendations; preview, write-back, and compensation-sensitive actions are unavailable."
    blockers:
      - "Approve action thresholds and governance before enabling any future supervised workflow."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_action_candidates.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
  - cartridge: sap_successfactors
    dataset: sap_successfactors_talent_signals
    readiness: partial
    reason: "Signals are recommendations derived from action candidates; they are not automatic actions."
    blockers:
      - "Validate C/P/A entities and signal thresholds before promoting signals to operational decisions."
    evidence:
      - cartridges/sap_successfactors/datasets/sap_successfactors_talent_signals.sql
      - cartridges/sap_successfactors/app/config/wisdom_bits.yaml
