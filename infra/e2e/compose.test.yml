services:
  e2e-test:
    build:
      context: ../..
      dockerfile: infra/e2e/Dockerfile
    environment:
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?required}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?required}
      CONSOLE_URL: http://console:8000
      REFINEMENT_URL: http://refinement:8500
      POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/modecissions
      AIRFLOW_POSTGRES_DSN: postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?required}@postgres:5432/modecissions
      GOLD_POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?required}@postgres_gold:5433/modecissions_gold
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:?required}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?required}
    volumes:
      - ${E2E_ARTIFACTS_DIR:?required}:/artifacts
    depends_on:
      postgres: {condition: service_healthy}
      postgres_gold: {condition: service_healthy}
      minio: {condition: service_healthy}
      refinement: {condition: service_healthy}
      mcp-infra: {condition: service_healthy}
      console: {condition: service_healthy}
      airflow: {condition: service_healthy}
      airflow-scheduler: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 96
    restart: "no"
