services:
  mock_mcp:
    image: python:3.12-slim
    command: python /mock_service.py --kind mcp-infra --ports 8010
    ports:
      - "${MOCK_MCP_PORT:-18010}:8010"
    volumes:
      - ../scripts/mock_test_services.py:/mock_service.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  mock_sap_api:
    image: python:3.12-slim
    command: python /mock_service.py --kind cartridge --ports 8201,8202,8203,8204
    ports:
      - "${MOCK_REPLICON_PORT:-18201}:8201"
      - "${MOCK_SAP_HCM_PORT:-18202}:8202"
      - "${MOCK_SAP_SUCCESSFACTORS_PORT:-18203}:8203"
      - "${MOCK_SAP_S4HANA_PORT:-18204}:8204"
    volumes:
      - ../scripts/mock_test_services.py:/mock_service.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8201/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
