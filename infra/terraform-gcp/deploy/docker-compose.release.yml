# GCP day-2 release overlay.
#
# The base Compose file remains the source of service configuration.  This
# overlay replaces local builds with the 15 immutable GHCR release images and
# moves mutable runtime mounts out of the immutable release directory.
# `day2-release.sh` adds a final, generated overlay which pins every value below
# to the RepoDigest pulled for the requested immutable tag.

services:
  console:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/console:${IMAGE_TAG:?IMAGE_TAG is required}
  workspace:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/workspace:${IMAGE_TAG:?IMAGE_TAG is required}
  refinement:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/refinement:${IMAGE_TAG:?IMAGE_TAG is required}
  vault:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/vault:${IMAGE_TAG:?IMAGE_TAG is required}
  mcp-infra:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/mcp-infra:${IMAGE_TAG:?IMAGE_TAG is required}
  airflow-init:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    volumes:
      - /opt/modecissions/shared/airflow/logs:/opt/airflow/logs
      - /opt/modecissions/shared/airflow/plugins:/opt/airflow/plugins
  airflow:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    volumes:
      - /opt/modecissions/shared/airflow/logs:/opt/airflow/logs
      - /opt/modecissions/shared/airflow/plugins:/opt/airflow/plugins
  airflow-scheduler:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    volumes:
      - /opt/modecissions/shared/airflow/logs:/opt/airflow/logs
      - /opt/modecissions/shared/airflow/plugins:/opt/airflow/plugins
  replicon:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/replicon:${IMAGE_TAG:?IMAGE_TAG is required}
  hubspot:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/hubspot:${IMAGE_TAG:?IMAGE_TAG is required}
  salesforce:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/salesforce:${IMAGE_TAG:?IMAGE_TAG is required}
  banxico:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/banxico:${IMAGE_TAG:?IMAGE_TAG is required}
  inegi:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/inegi:${IMAGE_TAG:?IMAGE_TAG is required}
  sec-edgar:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sec_edgar:${IMAGE_TAG:?IMAGE_TAG is required}
  sap-hcm:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_hcm:${IMAGE_TAG:?IMAGE_TAG is required}
  sap-successfactors:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_successfactors:${IMAGE_TAG:?IMAGE_TAG is required}
  sap-s4hana:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_s4hana:${IMAGE_TAG:?IMAGE_TAG is required}
  minio:
    volumes:
      - /opt/modecissions/shared/gcp-local-minio:/data
