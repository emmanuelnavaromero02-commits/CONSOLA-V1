  superset-init:
    security_opt: ["no-new-privileges:true"]
    # One-shot bootstrap: creates the ``superset`` DB on first boot
    # and runs ``superset db upgrade`` to populate it. Connects as
    # the postgres superuser BY DESIGN — at this point the metastore
    # role (omega_superset_meta) doesn't yet own any tables, and we
    # need privilege to CREATE DATABASE. After the upgrade we run a
    # second connection as postgres to transfer ownership of the
    # newly-created tables to omega_superset_meta so the runtime
    # container (next service) can use the dedicated role.
    image: apache/superset:3.1.3
    container_name: mode_superset_init
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_PREVIOUS_SECRET_KEY: ${SUPERSET_PREVIOUS_SECRET_KEY:-}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMEGA_SUPERSET_META_PASSWORD: ${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_ENABLE_PROXY_FIX: ${SUPERSET_ENABLE_PROXY_FIX:-true}
      SUPERSET_SESSION_COOKIE_SECURE: ${SUPERSET_SESSION_COOKIE_SECURE:-false}
      SUPERSET_SESSION_COOKIE_SAMESITE: ${SUPERSET_SESSION_COOKIE_SAMESITE:-Lax}
      SUPERSET_FORCE_HTTPS: ${SUPERSET_FORCE_HTTPS:-false}
    volumes:
      - ./terraform/deploy/superset_config/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        set -e
        superset db upgrade
        python3 - <<'PY'
        import os

        from superset.app import create_app
        from superset.extensions import db

        def upsert_admin(username: str, password: str, first_name: str, last_name: str, email: str) -> None:
            if not username or not password:
                return
            from superset import security_manager

            role = security_manager.find_role("Admin")
            user = security_manager.find_user(username=username)
            if user is None:
                security_manager.add_user(username, first_name, last_name, email, role, password)
                print(f"superset user created: {username}")
                return
            user.first_name = first_name
            user.last_name = last_name
            user.email = email
            user.active = True
            user.roles = [role]
            db.session.add(user)
            db.session.commit()
            security_manager.reset_password(user.id, password)
            print(f"superset user reset: {username}")

        app = create_app()
        with app.app_context():
            upsert_admin(
                os.environ["SUPERSET_ADMIN_USER"],
                os.environ["SUPERSET_ADMIN_PASSWORD"],
                "Admin",
                "User",
                "admin@modecissions.local",
            )
            upsert_admin(
                os.environ.get("SUPERSET_SERVICE_USER", ""),
                os.environ.get("SUPERSET_SERVICE_PASSWORD", ""),
                "Omega",
                "Service",
                "service@modecissions.local",
            )
        PY
        if [ -n "${SUPERSET_PREVIOUS_SECRET_KEY:-}" ]; then superset re-encrypt-secrets; fi
        superset init
        python3 -c "import os, psycopg2; c = psycopg2.connect(host='postgres', port=5432, dbname='superset', user='postgres', password=os.environ['POSTGRES_PASSWORD']); c.autocommit = True; cur = c.cursor(); [cur.execute(s) for s in ['GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON SCHEMA public TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_superset_meta']]; print('omega_superset_meta: grants applied to superset DB'); cur.close(); c.close()"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  superset:
    security_opt: ["no-new-privileges:true"]
    image: apache/superset:3.1.3
    container_name: mode_superset
    environment:
