services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: mode_postgres
    environment:
      POSTGRES_DB: modecissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Sprint v1.19: passwords for the 5 service-specific roles created by
      # infra/init/25_service_roles.sql. The migration uses
      # current_setting('app.omega_xxx_password', true), which libpq
      # populates from these PGOPTIONS connection options when the
      # entrypoint runs the init scripts via psql. `:-` keeps the value
      # empty if .env wasn't regenerated; the migration aborts loudly
      # in that case rather than creating roles with NULL passwords.
      # Sprint v1.38 (audit B5+B6): added six more roles for SAP
      # cartridges, Airflow and Superset (see
      # infra/init/36_cartridge_and_meta_roles.sql).
      PGOPTIONS: "-c app.omega_console_password=${OMEGA_CONSOLE_PASSWORD:-} -c app.omega_refinement_password=${OMEGA_REFINEMENT_PASSWORD:-} -c app.omega_vault_password=${OMEGA_VAULT_PASSWORD:-} -c app.omega_workspace_password=${OMEGA_WORKSPACE_PASSWORD:-} -c app.omega_mcp_infra_password=${OMEGA_MCP_INFRA_PASSWORD:-} -c app.omega_cartridge_sap_hcm_password=${OMEGA_CARTRIDGE_SAP_HCM_PASSWORD:-} -c app.omega_cartridge_sap_s4_password=${OMEGA_CARTRIDGE_SAP_S4_PASSWORD:-} -c app.omega_cartridge_sap_sf_password=${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:-} -c app.omega_airflow_dag_password=${OMEGA_AIRFLOW_DAG_PASSWORD:-} -c app.omega_airflow_meta_password=${OMEGA_AIRFLOW_META_PASSWORD:-} -c app.omega_superset_meta_password=${OMEGA_SUPERSET_META_PASSWORD:-} -c app.omega_cartridge_replicon_password=${OMEGA_CARTRIDGE_REPLICON_PASSWORD:-} -c app.omega_cartridge_salesforce_password=${OMEGA_CARTRIDGE_SALESFORCE_PASSWORD:-} -c app.omega_cartridge_hubspot_password=${OMEGA_CARTRIDGE_HUBSPOT_PASSWORD:-}"
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # Dependents connect through the compose network, so this must probe
      # the final TCP listener instead of Postgres' local Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d modecissions"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_dev_seed:
    image: postgres:15
    container_name: mode_postgres_dev_seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./init_dev:/dev-seeds:ro
    command: >
      bash -lc "psql -h postgres -U postgres -d modecissions
      -v ON_ERROR_STOP=1
      -f /dev-seeds/15_local_dev_bootstrap.sql;
      if [ \"$$APP_ENV\" = production ] || [ \"$$APP_ENV\" = prod ]; then
        echo '[demo-seed] APP_ENV is production — skipping Control Room demo seed';
      else
        psql -h postgres -U postgres -d modecissions -v ON_ERROR_STOP=1 -f /dev-seeds/16_demo_control_room_seed.sql;
      fi"
    restart: "no"

  postgres_gold:
    image: postgres:15
    container_name: mode_postgres_gold
    environment:
      POSTGRES_DB: modecissions_gold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGOPTIONS: "-c app.omega_refinement_gold_password=${OMEGA_REFINEMENT_GOLD_PASSWORD:-}"
    ports:
      - "15433:5433"
    command: -p 5433
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
      - ./init_gold:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U postgres -d modecissions_gold"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mode_redis
    # Shared rate-limit backend for the console (see console/app/services/
    # rate_limiter.py). Without this, the in-memory limiter applies per-replica
    # and an attacker can multiply the limit by the number of pods.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # v1.43.2 (Claude B7): pin MinIO to a specific RELEASE tag.
    # ``:latest`` silently shipped breaking changes between deploys;
    # pinning here gives reproducible local + staging behaviour. Bump
    # deliberately via a versioned migration when needed.
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mode_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: ../data/lakehouse
        target: /data
    # Without a healthcheck, dependents only get service_started semantics
    # and race the MinIO bucket initialization at boot. The /minio/health/live
    # endpoint is part of the MinIO public surface and responds 200 once the
    # server has finished local setup.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application services ──────────────────────────────────────────────────────

  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    container_name: mode_console
    environment:
      # v1.43.2 (Codex P1-2): APP_ENV default flipped to ``production`` in
      # code so an unset env never silently disables guardrails. Local dev
      # opts in explicitly here.
      #
      # v1.44.3.3 R-Mac Mini-fix review (DevOps P2): kept the
      # ${APP_ENV:-development} substitution to preserve symmetry
      # with every other service in this compose file (refinement,
      # vault, workspace, mcp-infra, cartridges, airflow all use
      # the same pattern). The "stale host env" risk the prior
      # commit cited is already neutralised in code — the
      # APP_ENV default in console/app/security.py is "production",
      # so an unset/empty value fails CLOSED.
      APP_ENV: ${APP_ENV:-production}
      ALLOW_RCE_TOOLS: ${ALLOW_RCE_TOOLS:-false}
      # v1.44.3.3 Task A + R-Mac Mini-fix: hardcoded "false" so
      # the limiter is OFF on the dev stack. The earlier
      # ``${RATE_LIMIT_ENABLED:-}`` form produced an EMPTY string
      # when the host env wasn't set, and the helper
      # ``_rate_limit_disabled()`` only treats {false / 0 / no /
      # off} as falsy — empty string fell through and the limiter
      # stayed on, exhausting the 8/300s /auth/login quota during
      # E2E. Production (AWS compose) does NOT set this var; the
      # helper's default is ``enabled`` so prod behaviour is
      # unchanged.
      RATE_LIMIT_ENABLED: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_CONSOLE: ${INTERNAL_API_KEY_CONSOLE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE: ${INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE: ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:-}
      INTERNAL_API_KEY_REPLICON_TO_CONSOLE: ${INTERNAL_API_KEY_REPLICON_TO_CONSOLE:-}
      INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE: ${INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE:-}
      INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE: ${INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE:-}
      INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE:-}
      INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE:-}
      INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE:-}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # The omega_console role can read/write every operational table
      # except vault_entries (locked to omega_vault).
      DATABASE_URL:      "postgresql+psycopg2://omega_console:${OMEGA_CONSOLE_PASSWORD:-}@postgres:5432/modecissions"
      GOLD_DATABASE_URL: "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:-}@postgres_gold:5433/modecissions_gold"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-anthropic}
      CHAT_LLM_MODEL:    ${CHAT_LLM_MODEL:-claude-haiku-4-5-20251001}
      REFINEMENT_URL:    http://refinement:8500
      MCP_INFRA_URL:     http://mcp-infra:8010
      VAULT_URL:         http://vault:8300
      CONSOLE_INTERNAL_URL: http://console:8000
      REPLICON_URL:      ${REPLICON_URL:-http://replicon:8201}
      HUBSPOT_URL:       ${HUBSPOT_URL:-http://hubspot:8210}
      SALESFORCE_URL:    ${SALESFORCE_URL:-http://salesforce:8205}
      SAP_HCM_URL:       ${SAP_HCM_URL:-http://sap-hcm:8202}
      SAP_S4HANA_URL:    ${SAP_S4HANA_URL:-http://sap-s4hana:8204}
      SAP_SUCCESSFACTORS_URL: ${SAP_SUCCESSFACTORS_URL:-http://sap-successfactors:8203}
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:-}
      SUPERSET_URL:      http://superset:8088
      AIRFLOW_PUBLIC_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:8082}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      # Prefer a least-privilege Superset service account for Studio dataset
      # creation. Local dev falls back to the bootstrap admin until one exists.
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_GOLD_SQLALCHEMY_URI: "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:-}@postgres_gold:5433/modecissions_gold"
      CONSOLE_URL:       ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_URL:     ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      RAG_URL:           http://mcp-infra:8010   # RAG migrado a mcp-infra
      # SMTP (MailHog en dev; AWS SES en prod)
      SMTP_HOST:         ${SMTP_HOST:-mailhog}
      SMTP_PORT:         ${SMTP_PORT:-1025}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASSWORD:     ${SMTP_PASSWORD:-}
      SMTP_FROM:         ${SMTP_FROM:-noreply@modecissions.local}
      SMTP_FROM_DOMAIN:  ${SMTP_FROM_DOMAIN:-modecissions.local}
      SMTP_USE_TLS:      ${SMTP_USE_TLS:-false}
      VPN_API_URL:       ${VPN_API_URL:-}
      VPN_API_PASSWORD:  ${VPN_API_PASSWORD:-}
      VPN_TOKEN_TTL_HOURS: ${VPN_TOKEN_TTL_HOURS:-72}
      VPN_CLIENT_ALLOWED_IPS: ${VPN_CLIENT_ALLOWED_IPS:-10.0.0.0/16,10.8.0.0/24}
      VPN_CLIENT_STRIP_DNS: ${VPN_CLIENT_STRIP_DNS:-true}
      APP_BASE_URL:      ${CONSOLE_URL:-http://localhost:8000}
      INVITE_TOKEN_TTL_HOURS: ${INVITE_TOKEN_TTL_HOURS:-72}
      RESET_TOKEN_TTL_HOURS:  ${RESET_TOKEN_TTL_HOURS:-1}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:     ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REDIS_URL:         ${REDIS_URL:-redis://redis:6379/0}
      # Static console-next is served same-origin by FastAPI on :8000.
      # Workspace keeps :8001 as the only local cross-origin browser client.
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:8001}
    ports:
      - "8000:8000"
    volumes:
      # Sprint v1.20: read-only — console reads cartridge .py sources to
      # seed cartridge_dags.source_code at startup, but must NEVER modify
      # the host's cartridge code from inside the container. Existing
      # callers (cartridge_service.export_cartridge fallback) are also
      # read-only, so the tightening is safe.
      - ../cartridges:/registry/cartridges:ro
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../console/app/static:/app/app/static:ro
      - ../VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      mcp-infra:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  workspace:
    build:
      context: ../workspace
      dockerfile: Dockerfile
    container_name: mode_workspace
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-production}
      ALLOW_RCE_TOOLS: ${ALLOW_RCE_TOOLS:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      # Sprint v1.26 (audit F11): provisioned for the day workspace
      # starts calling vault. Until then it's an unused env var here;
      # vault recognizes the value via its own _ALLOWED_SERVICES map.
      INTERNAL_API_KEY_WORKSPACE_TO_VAULT: ${INTERNAL_API_KEY_WORKSPACE_TO_VAULT:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_workspace reads most operational tables and writes only
      # decisions / decision_actions; cannot touch vault_entries.
      DATABASE_URL:         "postgresql+psycopg2://omega_workspace:${OMEGA_WORKSPACE_PASSWORD:-}@postgres:5432/modecissions"
      REFINEMENT_URL:       http://refinement:8500
      MCP_INFRA_URL:        http://mcp-infra:8010
      CONSOLE_URL:          ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      CHAT_LLM_PROVIDER:    ${CHAT_LLM_PROVIDER:-anthropic}
      CHAT_LLM_MODEL:       ${CHAT_LLM_MODEL:-claude-haiku-4-5-20251001}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      refinement:
        condition: service_healthy
      mcp-infra:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  refinement:
    build:
      context: ../refinement
      dockerfile: Dockerfile
    container_name: mode_refinement
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_REFINEMENT_TO_MCP_INFRA: ${INTERNAL_API_KEY_REFINEMENT_TO_MCP_INFRA:-}
      # Sprint v1.26 (audit F11): provisioned for the day refinement
      # starts calling vault. Until then it's an unused env var here;
      # vault recognizes the value via its own _ALLOWED_SERVICES map.
      INTERNAL_API_KEY_REFINEMENT_TO_VAULT: ${INTERNAL_API_KEY_REFINEMENT_TO_VAULT:-}
      # Sprint v1.19/v1.32.1: per-service Postgres roles on the
      # operational DB and analytical GOLD DB. Refinement writes gold_*
      # and master_* tables but must not use the postgres superuser.
      DATABASE_URL:       "postgresql+psycopg2://omega_refinement:${OMEGA_REFINEMENT_PASSWORD:-}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:  "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:-}@postgres_gold:5433/modecissions_gold"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SQL_LLM_MODEL:     ${SQL_LLM_MODEL:-claude-sonnet-4-6}
      MCP_INFRA_URL:     http://mcp-infra:8010
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  vault:
    build:
      context: ../vault
      dockerfile: Dockerfile
    container_name: mode_vault
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-production}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_vault is the ONLY role with access to vault_entries.
      # Every other service is REVOKE'd from this table — that's the
      # whole point of this sprint.
      DATABASE_URL:      "postgresql+psycopg2://omega_vault:${OMEGA_VAULT_PASSWORD:-}@postgres:5432/modecissions"
      INTERNAL_API_KEY:  ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      # Sprint v1.26 (audit F11): dedicated keys for workspace +
      # refinement → vault. Vault reads these to authenticate callers
      # that announce x-internal-service: workspace / refinement.
      # Until those services actually start calling vault, the values
      # exist but are unused; once they do, vault's WARNING log will
      # flag any caller still using the legacy shared INTERNAL_API_KEY.
      INTERNAL_API_KEY_WORKSPACE_TO_VAULT: ${INTERNAL_API_KEY_WORKSPACE_TO_VAULT:-}
      INTERNAL_API_KEY_REFINEMENT_TO_VAULT: ${INTERNAL_API_KEY_REFINEMENT_TO_VAULT:-}
      # Sprint v1.15: Fernet master key for encryption at rest. The vault
      # service validates the key at startup in vault/app/crypto.py
      # (_get_fernet raises VaultEncryptionError if missing/invalid), so
      # `:-` here keeps `docker compose config` usable in CI without an
      # env file present. Production deployments always set the var via
      # infra/.env generated by bootstrap.sh.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
    # Internal callers reach the service over the Docker network as
    # http://vault:8300 (uvicorn already listens on 8300 — see
    # ../vault/Dockerfile CMD). Exposing the same port to the host makes
    # the smoke check `curl http://localhost:8300/health` work without
    # having to docker-exec into a peer container.
    ports:
      - "8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mode_mailhog
    ports:
      - "1025:1025"   # SMTP (consumed by console)
      - "8025:8025"   # Web UI (open in browser to read sent emails)
    restart: unless-stopped
    # Sprint v1.41.1: docker compose ps now reports real health. wget is
    # bundled inside the alpine-based mailhog image.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/api/v1/messages || exit 1"]
      interval: 30s
      timeout: 5s
