  # ── MCP Infrastructure (incluye RAG) ─────────────────────────────────────────

  mcp-infra:
    build:
      context: ../mcp-infra
      dockerfile: Dockerfile
    container_name: mode_mcp_infra
    environment:
      # v1.43.2 (Codex P1-2): see console block above. mcp-infra is the
      # service most affected — airflow/superset/vault tools gate on
      # _is_development() and would have run unrestricted if APP_ENV
      # was simply unset. Default flipped, explicit opt-in here.
      APP_ENV: ${APP_ENV:-production}
      ALLOW_RCE_TOOLS: ${ALLOW_RCE_TOOLS:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_REFINEMENT_TO_MCP_INFRA: ${INTERNAL_API_KEY_REFINEMENT_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      AIRFLOW_URL:      http://airflow:8080
      AIRFLOW_USER:     ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      AIRFLOW_DAGS_PATH: /opt/airflow/dags
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      PG_HOST:          postgres
      PG_PORT:          5432
      PG_DB:            modecissions
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_mcp_infra can read/write only mcp_servers / mcp_custom_tools.
      # No vault_entries access, no auth-state access.
      PG_USER:          omega_mcp_infra
      PG_PASSWORD:      ${OMEGA_MCP_INFRA_PASSWORD:-}
      PG_GOLD_HOST:     postgres_gold
      PG_GOLD_PORT:     5433
      PG_GOLD_DB:       modecissions_gold
      PG_GOLD_USER:     omega_refinement_gold
      PG_GOLD_PASSWORD: ${OMEGA_REFINEMENT_GOLD_PASSWORD:-}
      SUPERSET_URL:     http://superset:8088
      SUPERSET_USER:    ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      AWS_REGION:       ${AWS_REGION:-us-east-1}
      BEDROCK_REGION:   ${BEDROCK_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      EMBED_MODEL:      ${EMBED_MODEL:-amazon.titan-embed-text-v2:0}
      EMBED_DIM:        ${EMBED_DIM:-1024}
      ADMIN_EMAIL:      ${ADMIN_EMAIL:-}
    ports:
      - "8010:8010"
    volumes:
      - ../airflow/dags:/opt/airflow/dags   # write DAGs directly
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      airflow:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Superset ──────────────────────────────────────────────────────────────────

  superset-init:
    # One-shot bootstrap: creates the ``superset`` DB on first boot
    # and runs ``superset db upgrade`` to populate it. Connects as
    # the postgres superuser BY DESIGN — at this point the metastore
    # role (omega_superset_meta) doesn't yet own any tables, and we
    # need privilege to CREATE DATABASE. After the upgrade we run a
    # second connection as postgres to transfer ownership of the
    # newly-created tables to omega_superset_meta so the runtime
    # container (next service) can use the dedicated role.
    image: apache/superset:3.1.3
    container_name: mode_superset_init
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_PREVIOUS_SECRET_KEY: ${SUPERSET_PREVIOUS_SECRET_KEY:-}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMEGA_SUPERSET_META_PASSWORD: ${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_ENABLE_PROXY_FIX: ${SUPERSET_ENABLE_PROXY_FIX:-true}
      SUPERSET_SESSION_COOKIE_SECURE: ${SUPERSET_SESSION_COOKIE_SECURE:-false}
      SUPERSET_SESSION_COOKIE_SAMESITE: ${SUPERSET_SESSION_COOKIE_SAMESITE:-Lax}
      SUPERSET_FORCE_HTTPS: ${SUPERSET_FORCE_HTTPS:-false}
    volumes:
      - ./terraform/deploy/superset_config/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        set -e
        superset db upgrade
        python3 - <<'PY'
        import os

        from superset.app import create_app
        from superset.extensions import db

        def upsert_admin(username: str, password: str, first_name: str, last_name: str, email: str) -> None:
            if not username or not password:
                return
            from superset import security_manager

            role = security_manager.find_role("Admin")
            user = security_manager.find_user(username=username)
            if user is None:
                security_manager.add_user(username, first_name, last_name, email, role, password)
                print(f"superset user created: {username}")
                return
            user.first_name = first_name
            user.last_name = last_name
            user.email = email
            user.active = True
            user.roles = [role]
            db.session.add(user)
            db.session.commit()
            security_manager.reset_password(user.id, password)
            print(f"superset user reset: {username}")

        app = create_app()
        with app.app_context():
            upsert_admin(
                os.environ["SUPERSET_ADMIN_USER"],
                os.environ["SUPERSET_ADMIN_PASSWORD"],
                "Admin",
                "User",
                "admin@modecissions.local",
            )
            upsert_admin(
                os.environ.get("SUPERSET_SERVICE_USER", ""),
                os.environ.get("SUPERSET_SERVICE_PASSWORD", ""),
                "Omega",
                "Service",
                "service@modecissions.local",
            )
        PY
        if [ -n "${SUPERSET_PREVIOUS_SECRET_KEY:-}" ]; then superset re-encrypt-secrets; fi
        superset init
        python3 -c "import os, psycopg2; c = psycopg2.connect(host='postgres', port=5432, dbname='superset', user='postgres', password=os.environ['POSTGRES_PASSWORD']); c.autocommit = True; cur = c.cursor(); [cur.execute(s) for s in ['GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON SCHEMA public TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_superset_meta']]; print('omega_superset_meta: grants applied to superset DB'); cur.close(); c.close()"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  superset:
    image: apache/superset:3.1.3
    container_name: mode_superset
    environment:
      SUPERSET_SECRET_KEY:     ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_PREVIOUS_SECRET_KEY: ${SUPERSET_PREVIOUS_SECRET_KEY:-}
      POSTGRES_PASSWORD:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Sprint v1.38 (audit B6 P0.5): runtime uses the dedicated
      # omega_superset_meta role created by 36_cartridge_and_meta_roles.sql.
      # superset-init grants ALL on the public schema of the
      # superset DB to this role after `superset db upgrade`.
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://omega_superset_meta:${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}@postgres:5432/superset
      SUPERSET_WEBSERVER_PORT: 8088
      SUPERSET_ADMIN_USER:     ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_TALISMAN_ENABLED: ${SUPERSET_TALISMAN_ENABLED:-true}
      SUPERSET_CSRF_ENABLED:     ${SUPERSET_CSRF_ENABLED:-true}
      SUPERSET_RATELIMIT_ENABLED: ${SUPERSET_RATELIMIT_ENABLED:-true}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_ENABLE_PROXY_FIX: ${SUPERSET_ENABLE_PROXY_FIX:-true}
      SUPERSET_SESSION_COOKIE_SECURE: ${SUPERSET_SESSION_COOKIE_SECURE:-false}
      SUPERSET_SESSION_COOKIE_SAMESITE: ${SUPERSET_SESSION_COOKIE_SAMESITE:-Lax}
      SUPERSET_FORCE_HTTPS: ${SUPERSET_FORCE_HTTPS:-false}
    volumes:
      - ./terraform/deploy/superset_config/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: superset run -h 0.0.0.0 -p 8088 --with-threads --reload
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sprint v1.41.1: Superset exposes /health on the same web port.
    # start_period generous because the first boot pulls the metadata
    # cache from postgres.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow ───────────────────────────────────────────────────────────────────
  # Initializes Airflow metadata idempotently, including existing local Postgres
  # volumes where /docker-entrypoint-initdb.d no longer runs.

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_init
    entrypoint: /bin/bash
    command: >
      -c "
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='modecissions', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute(\\\"SELECT 1 FROM pg_database WHERE datname = 'airflow'\\\"); exists = cur.fetchone(); cur.execute('CREATE DATABASE airflow') if exists is None else None; cur.close(); conn.close()\" &&
        airflow db migrate &&
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='airflow', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute('GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON SCHEMA public TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_airflow_meta'); print('omega_airflow_meta: grants applied to airflow DB'); cur.close(); conn.close()\" &&
        (airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@modecissions.local || true)
      "
    environment:
      # Sprint v1.38 (audit B6 P0.5): the init container intentionally
      # keeps the postgres superuser — it creates the `airflow` DB
      # and runs `airflow db migrate` which has to CREATE the
      # metastore tables. After that, it transfers ownership /
      # grants to omega_airflow_meta so the runtime webserver /
      # scheduler (next two services) can use the dedicated role.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE: ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:-}
      VAULT_URL: http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
    volumes:
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      # HubSpot CRM cartridge DAGs ship inside the cartridge (same pattern).
      - ../cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      # Salesforce Sales Cloud cartridge DAGs ship inside the cartridge.
      - ../cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
    restart: "no"

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow
    entrypoint: /bin/bash
    command: -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE: ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:-}
      CONSOLE_URL: http://console:8000
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:-}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Sprint v1.38 (audit B6 P0.5): the webserver runtime uses the
      # dedicated omega_airflow_meta role. airflow-init grants ALL
      # on the public schema of the `airflow` DB to this role after
      # `airflow db migrate`.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      # GitHub Actions runners are memory-constrained; the default
      # Airflow webserver worker count can restart-loop before E2E
      # begins. Keep the UI available with a single worker by default,
      # while allowing operators to raise it locally/prod via env.
      AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-1}
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: ${AIRFLOW_WEBSERVER_MASTER_TIMEOUT:-300}
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: ${AIRFLOW_WEBSERVER_WORKER_TIMEOUT:-300}
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # Variables disponibles en los DAGs via Variable.get(). Sprint
      # v1.38: scoped to the operational omega_airflow_dag role
      # (REVOKEs on users / decisions / vault_entries enforced by
      # 36_cartridge_and_meta_roles.sql) so if a DAG ever starts
      # consuming this variable, the blast radius is the operational
      # tables, not superuser.
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      DATABASE_URL: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "${OUTLOOK_RECEIVER_EMAIL:-devnull@modecissions.local}"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "${OUTLOOK_SENDER_EMAIL:-devnull@modecissions.local}"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # v1.43.1 (Claude B2): cartridge URLs are env-var driven so the
      # SAP DAGs are portable to Kubernetes / MWAA / Composer without
      # code edits. Defaults match the compose service hostnames so
      # local dev continues working unchanged.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      SAP_SUCCESSFACTORS_URL: "${SAP_SUCCESSFACTORS_URL:-http://sap-successfactors:8203}"
      # v1.43.1 R1 Security-F3: mirror docker-compose.aws.yml — even
      # though the Replicon DAG posts back through the console today,
      # keep the var here so a future cartridge-direct DAG works
      # without operators having to touch compose first.
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      HUBSPOT_URL:            "${HUBSPOT_URL:-http://hubspot:8210}"
      SALESFORCE_URL:         "${SALESFORCE_URL:-http://salesforce:8205}"
      # Conexiones API — definir aquí o en Airflow UI > Admin > Connections
    ports:
      - "8082:8080"
    volumes:
      # Kept read-write on purpose: the per-cartridge DAGs below are nested
      # bind mounts under this directory (/opt/airflow/dags/<cartridge>), and
      # Docker has to create those mountpoints inside this mount at container
      # start. A :ro parent makes that fail (EROFS) because the subdirs don't
      # pre-exist on the host. Runtime DAG-write protection lives in the
      # airflow_create_dag tool (APP_ENV dev + ALLOW_RCE_TOOLS), not here.
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      # HubSpot CRM cartridge DAGs ship inside the cartridge (same pattern).
      - ../cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      # Salesforce Sales Cloud cartridge DAGs ship inside the cartridge.
      - ../cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sprint v1.41.1: Airflow webserver exposes /health on port 8080.
    # start_period covers the slow first boot while plugins/dags load.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_scheduler
    command: scheduler
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE: ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:-}
      CONSOLE_URL:                          http://console:8000
      AGENT_RUNNER_TOKEN:                   ${AGENT_RUNNER_TOKEN:-}

      AIRFLOW_ADMIN_USER:                   ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD:               ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}

      VAULT_URL:                            http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Sprint v1.38 (audit B6 P0.5): see comment on the airflow
      # webserver service above.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      DATABASE_URL: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "${OUTLOOK_RECEIVER_EMAIL:-devnull@modecissions.local}"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "${OUTLOOK_SENDER_EMAIL:-devnull@modecissions.local}"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # v1.43.1 (Claude B2): mirror the webserver's cartridge URL env vars
      # so DAGs parse the same way regardless of which Airflow component
      # imports them.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      SAP_SUCCESSFACTORS_URL: "${SAP_SUCCESSFACTORS_URL:-http://sap-successfactors:8203}"
      # v1.43.1 R1 Security-F3: mirror docker-compose.aws.yml.
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      HUBSPOT_URL:            "${HUBSPOT_URL:-http://hubspot:8210}"
      SALESFORCE_URL:         "${SALESFORCE_URL:-http://salesforce:8205}"
    volumes:
      # Kept read-write on purpose: the per-cartridge DAGs below are nested
      # bind mounts under this directory (/opt/airflow/dags/<cartridge>), and
      # Docker has to create those mountpoints inside this mount at container
      # start. A :ro parent makes that fail (EROFS) because the subdirs don't
      # pre-exist on the host. Runtime DAG-write protection lives in the
      # airflow_create_dag tool (APP_ENV dev + ALLOW_RCE_TOOLS), not here.
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      # HubSpot CRM cartridge DAGs ship inside the cartridge (same pattern).
      - ../cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      # Salesforce Sales Cloud cartridge DAGs ship inside the cartridge.
      - ../cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Scheduler does not expose HTTP. Keep the healthcheck lightweight:
    # `airflow jobs check` can hang under DAG parsing load and pile up
    # healthcheck processes, making an otherwise live scheduler look dead.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys; sys.exit(0 if any(('airflow scheduler' in open('/proc/' + p + '/cmdline', 'rb').read().replace(b'\\0', b' ').decode('utf-8', 'ignore')) for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  postgres_gold_data:
