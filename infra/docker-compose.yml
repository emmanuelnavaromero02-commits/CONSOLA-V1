services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: mode_postgres
    environment:
      POSTGRES_DB: modecissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Sprint v1.19: passwords for the 5 service-specific roles created by
      # infra/init/25_service_roles.sql. The migration uses
      # current_setting('app.omega_xxx_password', true), which libpq
      # populates from these PGOPTIONS connection options when the
      # entrypoint runs the init scripts via psql. `:-` keeps the value
      # empty if .env wasn't regenerated; the migration aborts loudly
      # in that case rather than creating roles with NULL passwords.
      PGOPTIONS: "-c app.omega_console_password=${OMEGA_CONSOLE_PASSWORD:-} -c app.omega_refinement_password=${OMEGA_REFINEMENT_PASSWORD:-} -c app.omega_vault_password=${OMEGA_VAULT_PASSWORD:-} -c app.omega_workspace_password=${OMEGA_WORKSPACE_PASSWORD:-} -c app.omega_mcp_infra_password=${OMEGA_MCP_INFRA_PASSWORD:-}"
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modecissions"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_gold:
    image: postgres:15
    container_name: mode_postgres_gold
    environment:
      POSTGRES_DB: modecissions_gold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "15433:5433"
    command: -p 5433
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
      - ./init_gold:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modecissions_gold -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mode_redis
    # Shared rate-limit backend for the console (see console/app/services/
    # rate_limiter.py). Without this, the in-memory limiter applies per-replica
    # and an attacker can multiply the limit by the number of pods.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mode_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: ../data/lakehouse
        target: /data
    # Without a healthcheck, dependents only get service_started semantics
    # and race the MinIO bucket initialization at boot. The /minio/health/live
    # endpoint is part of the MinIO public surface and responds 200 once the
    # server has finished local setup.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application services ──────────────────────────────────────────────────────

  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    container_name: mode_console
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # The omega_console role can read/write every operational table
      # except vault_entries (locked to omega_vault).
      DATABASE_URL:      "postgresql+psycopg2://omega_console:${OMEGA_CONSOLE_PASSWORD:-}@postgres:5432/modecissions"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:    ${GEMINI_API_KEY:-}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-gemini}
      CHAT_LLM_MODEL:    ${CHAT_LLM_MODEL:-gemini-1.5-flash}
      GEMINI_CACHE_ENABLED: ${GEMINI_CACHE_ENABLED:-true}
      REFINEMENT_URL:    http://refinement:8500
      MCP_INFRA_URL:     http://mcp-infra:8010
      SUPERSET_URL:      http://superset:8088
      CONSOLE_URL:       ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_URL:     ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      RAG_URL:           http://mcp-infra:8010   # RAG migrado a mcp-infra
      # SMTP (MailHog en dev; AWS SES en prod)
      SMTP_HOST:         ${SMTP_HOST:-mailhog}
      SMTP_PORT:         ${SMTP_PORT:-1025}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASSWORD:     ${SMTP_PASSWORD:-}
      SMTP_FROM:         ${SMTP_FROM:-noreply@modecissions.local}
      SMTP_USE_TLS:      ${SMTP_USE_TLS:-false}
      APP_BASE_URL:      ${CONSOLE_URL:-http://localhost:8000}
      INVITE_TOKEN_TTL_HOURS: ${INVITE_TOKEN_TTL_HOURS:-72}
      RESET_TOKEN_TTL_HOURS:  ${RESET_TOKEN_TTL_HOURS:-1}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:     ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REDIS_URL:         ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      # Sprint v1.20: read-only — console reads cartridge .py sources to
      # seed cartridge_dags.source_code at startup, but must NEVER modify
      # the host's cartridge code from inside the container. Existing
      # callers (cartridge_service.export_cartridge fallback) are also
      # read-only, so the tightening is safe.
      - ../cartridges:/registry/cartridges:ro
      - ../console/app/static:/app/app/static:ro
      - ../VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-infra:
        condition: service_started
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  workspace:
    build:
      context: ../workspace
      dockerfile: Dockerfile
    container_name: mode_workspace
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_workspace reads most operational tables and writes only
      # decisions / decision_actions; cannot touch vault_entries.
      DATABASE_URL:         "postgresql+psycopg2://omega_workspace:${OMEGA_WORKSPACE_PASSWORD:-}@postgres:5432/modecissions"
      REFINEMENT_URL:       http://refinement:8500
      MCP_INFRA_URL:        http://mcp-infra:8010
      CONSOLE_URL:          ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:       ${GEMINI_API_KEY:-}
      CHAT_LLM_PROVIDER:    ${CHAT_LLM_PROVIDER:-gemini}
      CHAT_LLM_MODEL:       ${CHAT_LLM_MODEL:-gemini-1.5-flash}
      GEMINI_CACHE_ENABLED: ${GEMINI_CACHE_ENABLED:-true}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      refinement:
        condition: service_started
      mcp-infra:
        condition: service_started
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  refinement:
    build:
      context: ../refinement
      dockerfile: Dockerfile
    container_name: mode_refinement
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.19: per-service Postgres role on the operational DB
      # (least-privilege). omega_refinement reads dataset/cartridge
      # metadata and writes datasets/run_logs/pipeline_runs/silver_lineage.
      # The analytical GOLD DB connection (next line) stays on `postgres`
      # — that DB has no auth-state tables to lock down.
      DATABASE_URL:       "postgresql+psycopg2://omega_refinement:${OMEGA_REFINEMENT_PASSWORD:-}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:  "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SQL_LLM_MODEL:     ${SQL_LLM_MODEL:-claude-sonnet-4-6}
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8500/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  vault:
    build:
      context: ../vault
      dockerfile: Dockerfile
    container_name: mode_vault
    environment:
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_vault is the ONLY role with access to vault_entries.
      # Every other service is REVOKE'd from this table — that's the
      # whole point of this sprint.
      DATABASE_URL:      "postgresql+psycopg2://omega_vault:${OMEGA_VAULT_PASSWORD:-}@postgres:5432/modecissions"
      INTERNAL_API_KEY:  ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      # Sprint v1.15: Fernet master key for encryption at rest. The vault
      # service validates the key at startup in vault/app/crypto.py
      # (_get_fernet raises VaultEncryptionError if missing/invalid), so
      # `:-` here keeps `docker compose config` usable in CI without an
      # env file present. Production deployments always set the var via
      # infra/.env generated by bootstrap.sh.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
    # Internal callers reach the service over the Docker network as
    # http://vault:8300 (uvicorn already listens on 8300 — see
    # ../vault/Dockerfile CMD). Exposing the same port to the host makes
    # the smoke check `curl http://localhost:8300/health` work without
    # having to docker-exec into a peer container.
    ports:
      - "8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8300/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mode_mailhog
    ports:
      - "1025:1025"   # SMTP (consumed by console)
      - "8025:8025"   # Web UI (open in browser to read sent emails)
    restart: unless-stopped

  replicon-mock:
    # Sprint v1.21 (F3): opt-in via `--profile dev`. The mock serves
    # synthetic Replicon data for local development; in production a
    # rogue or misconfigured REPLICON_BASE_URL pointing at this service
    # would feed real ETL pipelines with fake records. Gating it behind
    # a profile means `make up` in production never starts the mock,
    # and a deliberate `docker compose --profile dev up` does.
    profiles: ["dev"]
    build:
      context: ./replicon-mock
      dockerfile: Dockerfile
    container_name: mode_replicon_mock
    environment:
      REPLICON_MOCK_USER_COUNT: ${REPLICON_MOCK_USER_COUNT:-1000}
    ports:
      - "8100:8100"
    restart: unless-stopped

  # ── SAP cartridges (opt-in via `--profile sap`) ─────────────────────────────
  # These cartridges are part of the registry mount and run as standalone
  # FastAPI services for direct console / MCP access. They're under the
  # ``sap`` profile so the default ``docker compose up`` is unchanged.

  sap-successfactors:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_successfactors
      dockerfile: Dockerfile
    container_name: mode_sap_successfactors
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      DATABASE_URL:     "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SF_BASE_URL:      ${SF_BASE_URL:-}
      SF_COMPANY_ID:    ${SF_COMPANY_ID:-}
      SF_CLIENT_ID:     ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_TOKEN_URL:     ${SF_TOKEN_URL:-}
    ports:
      - "8203:8203"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  sap-hcm:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_hcm
      dockerfile: Dockerfile
    container_name: mode_sap_hcm
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      DATABASE_URL:     "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SAP_HCM_BASE_URL:        ${SAP_HCM_BASE_URL:-}
      SAP_HCM_USER:            ${SAP_HCM_USER:-}
      SAP_HCM_PASS:            ${SAP_HCM_PASS:-}
      SAP_HCM_CLIENT_MANDANT:  ${SAP_HCM_CLIENT_MANDANT:-100}
    ports:
      - "8202:8202"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  sap-s4hana:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_s4hana
      dockerfile: Dockerfile
    container_name: mode_sap_s4hana
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      DATABASE_URL:     "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SAP_S4_BASE_URL:        ${SAP_S4_BASE_URL:-}
      SAP_S4_USER:            ${SAP_S4_USER:-}
      SAP_S4_PASS:            ${SAP_S4_PASS:-}
      SAP_S4_CLIENT_MANDANT:  ${SAP_S4_CLIENT_MANDANT:-100}
      SAP_S4_API_KEY:         ${SAP_S4_API_KEY:-}
    ports:
      - "8204:8204"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Infrastructure (incluye RAG) ─────────────────────────────────────────

  mcp-infra:
    build:
      context: ../mcp-infra
      dockerfile: Dockerfile
    container_name: mode_mcp_infra
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      AIRFLOW_URL:      http://airflow:8080
      AIRFLOW_USER:     ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      AIRFLOW_DAGS_PATH: /opt/airflow/dags
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      PG_HOST:          postgres
      PG_PORT:          5432
      PG_DB:            modecissions
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_mcp_infra can read/write only mcp_servers / mcp_custom_tools.
      # No vault_entries access, no auth-state access.
      PG_USER:          omega_mcp_infra
      PG_PASSWORD:      ${OMEGA_MCP_INFRA_PASSWORD:-}
      PG_GOLD_HOST:     postgres_gold
      PG_GOLD_PORT:     5433
      PG_GOLD_DB:       modecissions_gold
      SUPERSET_URL:     http://superset:8088
      SUPERSET_USER:    ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      GEMINI_API_KEY:   ${GEMINI_API_KEY:-}
      EMBED_MODEL:      ${EMBED_MODEL:-gemini-embedding-001}
      EMBED_DIM:        ${EMBED_DIM:-768}
    ports:
      - "8010:8010"
    volumes:
      - ../airflow/dags:/opt/airflow/dags   # write DAGs directly
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow:
        condition: service_started
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Superset ──────────────────────────────────────────────────────────────────

  superset-init:
    image: apache/superset:3.1.3
    container_name: mode_superset_init
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset
    entrypoint: /bin/bash
    command: >
      -c "
        superset db upgrade &&
        superset fab create-admin
          --username ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
          --firstname Admin
          --lastname User
          --email admin@modecissions.local
          --password ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required} &&
        superset init
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  superset:
    image: apache/superset:3.1.3
    container_name: mode_superset
    environment:
      SUPERSET_SECRET_KEY:     ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset
      SUPERSET_WEBSERVER_PORT: 8088
      TALISMAN_ENABLED:        "false"
      WTF_CSRF_ENABLED:        "false"
    command: superset run -p 8088 --with-threads --reload
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Airflow ───────────────────────────────────────────────────────────────────
  # Initializes Airflow metadata idempotently, including existing local Postgres
  # volumes where /docker-entrypoint-initdb.d no longer runs.

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_init
    entrypoint: /bin/bash
    command: >
      -c "
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='modecissions', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute(\\\"SELECT 1 FROM pg_database WHERE datname = 'airflow'\\\"); exists = cur.fetchone(); cur.execute('CREATE DATABASE airflow') if exists is None else None; cur.close(); conn.close()\" &&
        airflow db migrate &&
        (airflow connections delete replicon_analytics || true) &&
        airflow connections add replicon_analytics --conn-type http --conn-host http://replicon-mock:8100/analytics --conn-password dummy-local-token &&
        (airflow connections delete replicon_services || true) &&
        airflow connections add replicon_services --conn-type http --conn-host http://replicon-mock:8100/services --conn-password dummy-local-token &&
        (airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@modecissions.local || true)
      "
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      VAULT_URL: http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
    volumes:
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.21 (F3): no `replicon-mock: service_started` here.
      # airflow only needs the connection POINTING at the mock URL,
      # not the mock running. The mock is now under `--profile dev`,
      # so making it a hard dependency would prevent prod boot.
    restart: "no"

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow
    entrypoint: /bin/bash
    command: -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # Variables disponibles en los DAGs via Variable.get()
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "dummy-local-password"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # Conexiones API — definir aquí o en Airflow UI > Admin > Connections
    ports:
      - "8082:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.21 (F3): no `replicon-mock: service_started` here.
      # airflow only needs the connection POINTING at the mock URL,
      # not the mock running. The mock is now under `--profile dev`,
      # so making it a hard dependency would prevent prod boot.
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_scheduler
    command: scheduler
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}

      AIRFLOW_ADMIN_USER:                   ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD:               ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}

      VAULT_URL:                            http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "dummy-local-password"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.21 (F3): no `replicon-mock: service_started` here.
      # airflow only needs the connection POINTING at the mock URL,
      # not the mock running. The mock is now under `--profile dev`,
      # so making it a hard dependency would prevent prod boot.
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_gold_data:
