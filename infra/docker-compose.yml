      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      MINIO_ENDPOINT:      "minio:9000"
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET:         "lakehouse"
      MINIO_SECURE:         "false"
      REFINEMENT_URL:       http://refinement:8500
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      SAP_B1_URL:             "${SAP_B1_URL:-http://sap-b1:8206}"
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      HUBSPOT_URL:            "${HUBSPOT_URL:-http://hubspot:8210}"
      SALESFORCE_URL:         "${SALESFORCE_URL:-http://salesforce:8205}"
      BANXICO_URL:            "${BANXICO_URL:-http://banxico:8215}"
      INEGI_URL:              "${INEGI_URL:-http://inegi:8216}"
      SEC_EDGAR_URL:          "${SEC_EDGAR_URL:-http://sec-edgar:8217}"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      - ../cartridges/sap_b1/dags:/opt/airflow/dags/sap_b1:ro
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      - ../cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      - ../cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
      - ../cartridges/banxico/dags:/opt/airflow/dags/banxico:ro
      - ../cartridges/inegi/dags:/opt/airflow/dags/inegi:ro
      - ../cartridges/sec_edgar/dags:/opt/airflow/dags/sec_edgar:ro
      - ${SF_PRIVATE_KEY_HOST_PATH:-/dev/null}:${SF_PRIVATE_KEY_PATH:-/run/secrets/sf_epiuse_iaappliance_connector.pem}:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      
      
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys; sys.exit(0 if any(('airflow scheduler' in open('/proc/' + p + '/cmdline', 'rb').read().replace(b'\\0', b' ').decode('utf-8', 'ignore')) for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  postgres_gold_data:
