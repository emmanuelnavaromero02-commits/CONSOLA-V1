services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: mode_postgres
    environment:
      POSTGRES_DB: modecissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Sprint v1.19: passwords for the 5 service-specific roles created by
      # infra/init/25_service_roles.sql. The migration uses
      # current_setting('app.omega_xxx_password', true), which libpq
      # populates from these PGOPTIONS connection options when the
      # entrypoint runs the init scripts via psql. `:-` keeps the value
      # empty if .env wasn't regenerated; the migration aborts loudly
      # in that case rather than creating roles with NULL passwords.
      # Sprint v1.38 (audit B5+B6): added six more roles for SAP
      # cartridges, Airflow and Superset (see
      # infra/init/36_cartridge_and_meta_roles.sql).
      PGOPTIONS: "-c app.omega_console_password=${OMEGA_CONSOLE_PASSWORD:-} -c app.omega_refinement_password=${OMEGA_REFINEMENT_PASSWORD:-} -c app.omega_vault_password=${OMEGA_VAULT_PASSWORD:-} -c app.omega_workspace_password=${OMEGA_WORKSPACE_PASSWORD:-} -c app.omega_mcp_infra_password=${OMEGA_MCP_INFRA_PASSWORD:-} -c app.omega_cartridge_sap_hcm_password=${OMEGA_CARTRIDGE_SAP_HCM_PASSWORD:-} -c app.omega_cartridge_sap_s4_password=${OMEGA_CARTRIDGE_SAP_S4_PASSWORD:-} -c app.omega_cartridge_sap_sf_password=${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:-} -c app.omega_airflow_dag_password=${OMEGA_AIRFLOW_DAG_PASSWORD:-} -c app.omega_airflow_meta_password=${OMEGA_AIRFLOW_META_PASSWORD:-} -c app.omega_superset_meta_password=${OMEGA_SUPERSET_META_PASSWORD:-} -c app.omega_cartridge_replicon_password=${OMEGA_CARTRIDGE_REPLICON_PASSWORD:-}"
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modecissions"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_gold:
    image: postgres:15
    container_name: mode_postgres_gold
    environment:
      POSTGRES_DB: modecissions_gold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGOPTIONS: "-c app.omega_refinement_gold_password=${OMEGA_REFINEMENT_GOLD_PASSWORD:-}"
    ports:
      - "15433:5433"
    command: -p 5433
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
      - ./init_gold:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modecissions_gold -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mode_redis
    # Shared rate-limit backend for the console (see console/app/services/
    # rate_limiter.py). Without this, the in-memory limiter applies per-replica
    # and an attacker can multiply the limit by the number of pods.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # v1.43.2 (Claude B7): pin MinIO to a specific RELEASE tag.
    # ``:latest`` silently shipped breaking changes between deploys;
    # pinning here gives reproducible local + staging behaviour. Bump
    # deliberately via a versioned migration when needed.
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mode_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: ../data/lakehouse
        target: /data
    # Without a healthcheck, dependents only get service_started semantics
    # and race the MinIO bucket initialization at boot. The /minio/health/live
    # endpoint is part of the MinIO public surface and responds 200 once the
    # server has finished local setup.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application services ──────────────────────────────────────────────────────

  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    container_name: mode_console
    environment:
      # v1.43.2 (Codex P1-2): APP_ENV default flipped to ``production`` in
      # code so an unset env never silently disables guardrails. Local dev
      # opts in explicitly here.
      #
      # v1.44.3.3 R-Mac Mini-fix: hardcoded the dev value (was
      # ``${APP_ENV:-development}``) so a stale host env can't
      # silently flip the container into production/test by
      # accident.  The AWS compose at
      # infra/terraform/deploy/docker-compose.aws.yml is the prod
      # source of truth and continues to default to ``production``.
      APP_ENV: "development"
      # v1.44.3.3 Task A + R-Mac Mini-fix: hardcoded "false" so
      # the limiter is OFF on the dev stack. The earlier
      # ``${RATE_LIMIT_ENABLED:-}`` form produced an EMPTY string
      # when the host env wasn't set, and the helper
      # ``_rate_limit_disabled()`` only treats {false / 0 / no /
      # off} as falsy — empty string fell through and the limiter
      # stayed on, exhausting the 8/300s /auth/login quota during
      # E2E. Production (AWS compose) does NOT set this var; the
      # helper's default is ``enabled`` so prod behaviour is
      # unchanged.
      RATE_LIMIT_ENABLED: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # The omega_console role can read/write every operational table
      # except vault_entries (locked to omega_vault).
      DATABASE_URL:      "postgresql+psycopg2://omega_console:${OMEGA_CONSOLE_PASSWORD:-}@postgres:5432/modecissions"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:    ${GEMINI_API_KEY:-}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-gemini}
      CHAT_LLM_MODEL:    ${CHAT_LLM_MODEL:-gemini-1.5-flash}
      GEMINI_CACHE_ENABLED: ${GEMINI_CACHE_ENABLED:-true}
      REFINEMENT_URL:    http://refinement:8500
      MCP_INFRA_URL:     http://mcp-infra:8010
      SUPERSET_URL:      http://superset:8088
      CONSOLE_URL:       ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_URL:     ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      RAG_URL:           http://mcp-infra:8010   # RAG migrado a mcp-infra
      # SMTP (MailHog en dev; AWS SES en prod)
      SMTP_HOST:         ${SMTP_HOST:-mailhog}
      SMTP_PORT:         ${SMTP_PORT:-1025}
      SMTP_USER:         ${SMTP_USER:-}
      SMTP_PASSWORD:     ${SMTP_PASSWORD:-}
      SMTP_FROM:         ${SMTP_FROM:-noreply@modecissions.local}
      SMTP_USE_TLS:      ${SMTP_USE_TLS:-false}
      APP_BASE_URL:      ${CONSOLE_URL:-http://localhost:8000}
      INVITE_TOKEN_TTL_HOURS: ${INVITE_TOKEN_TTL_HOURS:-72}
      RESET_TOKEN_TTL_HOURS:  ${RESET_TOKEN_TTL_HOURS:-1}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:     ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REDIS_URL:         ${REDIS_URL:-redis://redis:6379/0}
      # v1.44.3.2.2 R-Mac: explicit CORS allowlist so the Next.js
      # console on :3000 can hit the FastAPI backend on :8000.
      # Override in prod to the public origins. The Python default
      # already includes :3000 + :8000 for local-dev parity if this
      # var isn't set, but pin it here so every env is deterministic.
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      # Sprint v1.20: read-only — console reads cartridge .py sources to
      # seed cartridge_dags.source_code at startup, but must NEVER modify
      # the host's cartridge code from inside the container. Existing
      # callers (cartridge_service.export_cartridge fallback) are also
      # read-only, so the tightening is safe.
      - ../cartridges:/registry/cartridges:ro
      - ../console/app/static:/app/app/static:ro
      - ../VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-infra:
        condition: service_started
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # v1.44.2 — Next.js 14 frontend. Consumes the FastAPI /api/* surface
  # via two URLs:
  #   - server-side (RSC / route handlers): API_INTERNAL_URL → http://console:8000
  #   - browser:                            NEXT_PUBLIC_API_BASE → ${CONSOLE_PUBLIC_URL}
  # Container does NOT receive INTERNAL_API_KEY — it talks to the
  # console with the user's session cookie (JWT httpOnly) only. The
  # legacy admin pages still live under /static/* of the Python
  # console; this container is additive.
  console_next:
    build:
      context: ../console-next
      dockerfile: Dockerfile
    container_name: omega_console_next
    environment:
      NODE_ENV: production
      # v1.44.3.2.2 R-Mac-4: the Next.js app proxies every browser
      # call to the FastAPI backend server-side via the docker
      # network (see console-next/src/app/api/[...path]/route.ts).
      # BACKEND_INTERNAL_URL is the canonical name consumed by
      # lib/proxy.ts; API_INTERNAL_URL stays as a fallback so older
      # imports in lib/api.ts keep working through the transition.
      # NEXT_PUBLIC_API_BASE is no longer needed — the browser
      # never sees the backend's public origin — but we leave the
      # var unset rather than removing the key to avoid surprising
      # any one-off scripts that may grep for it in the meantime.
      BACKEND_INTERNAL_URL: http://console:8000
      API_INTERNAL_URL: http://console:8000
    ports:
      - "3000:3000"
    depends_on:
      console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped


  workspace:
    build:
      context: ../workspace
      dockerfile: Dockerfile
    container_name: mode_workspace
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE: ${INTERNAL_API_KEY_WORKSPACE_TO_CONSOLE:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      # Sprint v1.26 (audit F11): provisioned for the day workspace
      # starts calling vault. Until then it's an unused env var here;
      # vault recognizes the value via its own _ALLOWED_SERVICES map.
      INTERNAL_API_KEY_WORKSPACE_TO_VAULT: ${INTERNAL_API_KEY_WORKSPACE_TO_VAULT:-}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_workspace reads most operational tables and writes only
      # decisions / decision_actions; cannot touch vault_entries.
      DATABASE_URL:         "postgresql+psycopg2://omega_workspace:${OMEGA_WORKSPACE_PASSWORD:-}@postgres:5432/modecissions"
      REFINEMENT_URL:       http://refinement:8500
      MCP_INFRA_URL:        http://mcp-infra:8010
      CONSOLE_URL:          ${CONSOLE_URL:-http://localhost:8000}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:-http://localhost:8001}
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:       ${GEMINI_API_KEY:-}
      CHAT_LLM_PROVIDER:    ${CHAT_LLM_PROVIDER:-gemini}
      CHAT_LLM_MODEL:       ${CHAT_LLM_MODEL:-gemini-1.5-flash}
      GEMINI_CACHE_ENABLED: ${GEMINI_CACHE_ENABLED:-true}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      refinement:
        condition: service_started
      mcp-infra:
        condition: service_started
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  refinement:
    build:
      context: ../refinement
      dockerfile: Dockerfile
    container_name: mode_refinement
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT: ${INTERNAL_API_KEY_CONSOLE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT: ${INTERNAL_API_KEY_WORKSPACE_TO_REFINEMENT:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.26 (audit F11): provisioned for the day refinement
      # starts calling vault. Until then it's an unused env var here;
      # vault recognizes the value via its own _ALLOWED_SERVICES map.
      INTERNAL_API_KEY_REFINEMENT_TO_VAULT: ${INTERNAL_API_KEY_REFINEMENT_TO_VAULT:-}
      # Sprint v1.19/v1.32.1: per-service Postgres roles on the
      # operational DB and analytical GOLD DB. Refinement writes gold_*
      # and master_* tables but must not use the postgres superuser.
      DATABASE_URL:       "postgresql+psycopg2://omega_refinement:${OMEGA_REFINEMENT_PASSWORD:-}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:  "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:-}@postgres_gold:5433/modecissions_gold"
      MINIO_ENDPOINT:    minio:9000
      MINIO_ACCESS_KEY:  minio
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:      lakehouse
      MINIO_SECURE:      "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SQL_LLM_MODEL:     ${SQL_LLM_MODEL:-claude-sonnet-4-6}
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  vault:
    build:
      context: ../vault
      dockerfile: Dockerfile
    container_name: mode_vault
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_vault is the ONLY role with access to vault_entries.
      # Every other service is REVOKE'd from this table — that's the
      # whole point of this sprint.
      DATABASE_URL:      "postgresql+psycopg2://omega_vault:${OMEGA_VAULT_PASSWORD:-}@postgres:5432/modecissions"
      INTERNAL_API_KEY:  ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      # Sprint v1.26 (audit F11): dedicated keys for workspace +
      # refinement → vault. Vault reads these to authenticate callers
      # that announce x-internal-service: workspace / refinement.
      # Until those services actually start calling vault, the values
      # exist but are unused; once they do, vault's WARNING log will
      # flag any caller still using the legacy shared INTERNAL_API_KEY.
      INTERNAL_API_KEY_WORKSPACE_TO_VAULT: ${INTERNAL_API_KEY_WORKSPACE_TO_VAULT:-}
      INTERNAL_API_KEY_REFINEMENT_TO_VAULT: ${INTERNAL_API_KEY_REFINEMENT_TO_VAULT:-}
      # Sprint v1.15: Fernet master key for encryption at rest. The vault
      # service validates the key at startup in vault/app/crypto.py
      # (_get_fernet raises VaultEncryptionError if missing/invalid), so
      # `:-` here keeps `docker compose config` usable in CI without an
      # env file present. Production deployments always set the var via
      # infra/.env generated by bootstrap.sh.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
    # Internal callers reach the service over the Docker network as
    # http://vault:8300 (uvicorn already listens on 8300 — see
    # ../vault/Dockerfile CMD). Exposing the same port to the host makes
    # the smoke check `curl http://localhost:8300/health` work without
    # having to docker-exec into a peer container.
    ports:
      - "8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mode_mailhog
    ports:
      - "1025:1025"   # SMTP (consumed by console)
      - "8025:8025"   # Web UI (open in browser to read sent emails)
    restart: unless-stopped
    # Sprint v1.41.1: docker compose ps now reports real health. wget is
    # bundled inside the alpine-based mailhog image.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/api/v1/messages || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Replicon cartridge (Sprint v1.40 — restored from original) ─────────────
  # Standalone FastAPI service that exposes Replicon ETL tools via MCP.
  # Credentials live in Vault (operators configure them in the OMEGA
  # console at /apps-gallery), not in Airflow Connections. The mock
  # service was removed in v1.40 — production never wants synthetic
  # data feeding the pipeline, and dev hits Replicon's sandbox URL
  # configured per-environment from Vault.
  replicon:
    build:
      context: ../cartridges/replicon
      dockerfile: Dockerfile
    container_name: omega_replicon
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_REPLICON_TO_CONSOLE: ${INTERNAL_API_KEY_REPLICON_TO_CONSOLE:?INTERNAL_API_KEY_REPLICON_TO_CONSOLE is required}
      INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA: ${INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA:?INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_REPLICON_TO_REFINEMENT: ${INTERNAL_API_KEY_REPLICON_TO_REFINEMENT:?INTERNAL_API_KEY_REPLICON_TO_REFINEMENT is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for Replicon cartridge}
      CONSOLE_URL: http://console:8000
      MCP_INFRA_URL: http://mcp-infra:8010
      REFINEMENT_URL: http://refinement:8500
      # Sprint v1.40 (audit B6 pattern): least-privilege DB role.
      # See infra/init/37_replicon_role_and_tables.sql.
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_replicon:${OMEGA_CARTRIDGE_REPLICON_PASSWORD:?OMEGA_CARTRIDGE_REPLICON_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: lakehouse
      MINIO_SECURE: "false"
    ports:
      - "8201:8201"
    healthcheck:
      # The cartridge exposes /health (not /healthz) — see
      # cartridges/replicon/app/api/routes_health.py. We probe it as-is
      # to keep the cartridge bit-identical to the original ZIP.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8201/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── SAP cartridges (opt-in via `--profile sap`) ─────────────────────────────
  # These cartridges are part of the registry mount and run as standalone
  # FastAPI services for direct console / MCP access. They're under the
  # ``sap`` profile so the default ``docker compose up`` is unchanged.

  sap-successfactors:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_successfactors
      dockerfile: Dockerfile
    container_name: mode_sap_successfactors
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.38 (audit B6 P0.5): least-privilege DB role. Pre-v1.38
      # the SAP cartridges connected as the postgres superuser; a
      # compromise of the cartridge handed the attacker every table
      # in the DB. omega_cartridge_sap_sf is scoped to the operational
      # tables (cartridges, entity_config, kb_config, watermarks,
      # extraction_runs, jobs, run_logs) and is explicitly REVOKED on
      # users / decisions / vault_entries via 36_cartridge_and_meta_roles.sql.
      DATABASE_URL:     "postgresql+psycopg2://omega_cartridge_sap_sf:${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:?OMEGA_CARTRIDGE_SAP_SF_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SF_BASE_URL:      ${SF_BASE_URL:-}
      SF_COMPANY_ID:    ${SF_COMPANY_ID:-}
      SF_CLIENT_ID:     ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_TOKEN_URL:     ${SF_TOKEN_URL:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for SAP cartridges}
    ports:
      - "8203:8203"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Sprint v1.41.1: the cartridge's /health is unauth and reports
    # degraded vs ok based on vault reachability — perfect for compose.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8203/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  sap-hcm:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_hcm
      dockerfile: Dockerfile
    container_name: mode_sap_hcm
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.38 (audit B6 P0.5): least-privilege DB role; see
      # comment on sap-successfactors above.
      DATABASE_URL:     "postgresql+psycopg2://omega_cartridge_sap_hcm:${OMEGA_CARTRIDGE_SAP_HCM_PASSWORD:?OMEGA_CARTRIDGE_SAP_HCM_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SAP_HCM_BASE_URL:        ${SAP_HCM_BASE_URL:-}
      SAP_HCM_USER:            ${SAP_HCM_USER:-}
      SAP_HCM_PASS:            ${SAP_HCM_PASS:-}
      SAP_HCM_CLIENT_MANDANT:  ${SAP_HCM_CLIENT_MANDANT:-100}
      FIELD_ENCRYPTION_KEY:    ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for SAP cartridges}
    ports:
      - "8202:8202"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Sprint v1.41.1: /health unauth, reports ok/degraded based on
    # vault reachability.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8202/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  sap-s4hana:
    profiles: ["sap"]
    build:
      context: ../cartridges/sap_s4hana
      dockerfile: Dockerfile
    container_name: mode_sap_s4hana
    environment:
      # v1.43.2 (Codex P1-2): see console block above.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      # Sprint v1.38 (audit B6 P0.5): least-privilege DB role; see
      # comment on sap-successfactors above.
      DATABASE_URL:     "postgresql+psycopg2://omega_cartridge_sap_s4:${OMEGA_CARTRIDGE_SAP_S4_PASSWORD:?OMEGA_CARTRIDGE_SAP_S4_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      REFINEMENT_URL:   http://refinement:8500
      SAP_S4_BASE_URL:        ${SAP_S4_BASE_URL:-}
      SAP_S4_USER:            ${SAP_S4_USER:-}
      SAP_S4_PASS:            ${SAP_S4_PASS:-}
      SAP_S4_CLIENT_MANDANT:  ${SAP_S4_CLIENT_MANDANT:-100}
      SAP_S4_API_KEY:         ${SAP_S4_API_KEY:-}
      FIELD_ENCRYPTION_KEY:   ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for SAP cartridges}
    ports:
      - "8204:8204"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Sprint v1.41.1: /health unauth, reports ok/degraded based on
    # vault reachability.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8204/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── MCP Infrastructure (incluye RAG) ─────────────────────────────────────────

  mcp-infra:
    build:
      context: ../mcp-infra
      dockerfile: Dockerfile
    container_name: mode_mcp_infra
    environment:
      # v1.43.2 (Codex P1-2): see console block above. mcp-infra is the
      # service most affected — airflow/superset/vault tools gate on
      # _is_development() and would have run unrestricted if APP_ENV
      # was simply unset. Default flipped, explicit opt-in here.
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA: ${INTERNAL_API_KEY_CONSOLE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA: ${INTERNAL_API_KEY_WORKSPACE_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:-}
      AIRFLOW_URL:      http://airflow:8080
      AIRFLOW_USER:     ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      AIRFLOW_DAGS_PATH: /opt/airflow/dags
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET:     lakehouse
      MINIO_SECURE:     "false"
      PG_HOST:          postgres
      PG_PORT:          5432
      PG_DB:            modecissions
      # Sprint v1.19: per-service Postgres role (least-privilege).
      # omega_mcp_infra can read/write only mcp_servers / mcp_custom_tools.
      # No vault_entries access, no auth-state access.
      PG_USER:          omega_mcp_infra
      PG_PASSWORD:      ${OMEGA_MCP_INFRA_PASSWORD:-}
      PG_GOLD_HOST:     postgres_gold
      PG_GOLD_PORT:     5433
      PG_GOLD_DB:       modecissions_gold
      SUPERSET_URL:     http://superset:8088
      SUPERSET_USER:    ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      GEMINI_API_KEY:   ${GEMINI_API_KEY:-}
      EMBED_MODEL:      ${EMBED_MODEL:-gemini-embedding-001}
      EMBED_DIM:        ${EMBED_DIM:-768}
    ports:
      - "8010:8010"
    volumes:
      - ../airflow/dags:/opt/airflow/dags   # write DAGs directly
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow:
        condition: service_started
    healthcheck:
      # Sprint v1.21 (F2): liveness probe so dependent services can
      # wait on `condition: service_healthy`. The image is
      # python:3.12-slim (no wget/curl), hence python3 -c.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Superset ──────────────────────────────────────────────────────────────────

  superset-init:
    # One-shot bootstrap: creates the ``superset`` DB on first boot
    # and runs ``superset db upgrade`` to populate it. Connects as
    # the postgres superuser BY DESIGN — at this point the metastore
    # role (omega_superset_meta) doesn't yet own any tables, and we
    # need privilege to CREATE DATABASE. After the upgrade we run a
    # second connection as postgres to transfer ownership of the
    # newly-created tables to omega_superset_meta so the runtime
    # container (next service) can use the dedicated role.
    image: apache/superset:3.1.3
    container_name: mode_superset_init
    environment:
      SUPERSET_SECRET_KEY:   ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OMEGA_SUPERSET_META_PASSWORD: ${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}
    entrypoint: /bin/bash
    command: >
      -c "
        superset db upgrade &&
        superset fab create-admin
          --username ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
          --firstname Admin
          --lastname User
          --email admin@modecissions.local
          --password ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required} &&
        superset init &&
        python3 -c \"import os, psycopg2; c = psycopg2.connect(host='postgres', port=5432, dbname='superset', user='postgres', password=os.environ['POSTGRES_PASSWORD']); c.autocommit = True; cur = c.cursor(); [cur.execute(s) for s in ['GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_superset_meta', 'GRANT ALL ON SCHEMA public TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_superset_meta', 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_superset_meta']]; print('omega_superset_meta: grants applied to superset DB'); cur.close(); c.close()\"
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  superset:
    image: apache/superset:3.1.3
    container_name: mode_superset
    environment:
      SUPERSET_SECRET_KEY:     ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      # Sprint v1.38 (audit B6 P0.5): runtime uses the dedicated
      # omega_superset_meta role created by 36_cartridge_and_meta_roles.sql.
      # superset-init grants ALL on the public schema of the
      # superset DB to this role after `superset db upgrade`.
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://omega_superset_meta:${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}@postgres:5432/superset
      SUPERSET_WEBSERVER_PORT: 8088
      TALISMAN_ENABLED:        "false"
      WTF_CSRF_ENABLED:        "false"
    command: superset run -p 8088 --with-threads --reload
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Sprint v1.41.1: Superset exposes /health on the same web port.
    # start_period generous because the first boot pulls the metadata
    # cache from postgres.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow ───────────────────────────────────────────────────────────────────
  # Initializes Airflow metadata idempotently, including existing local Postgres
  # volumes where /docker-entrypoint-initdb.d no longer runs.

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_init
    entrypoint: /bin/bash
    command: >
      -c "
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='modecissions', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute(\\\"SELECT 1 FROM pg_database WHERE datname = 'airflow'\\\"); exists = cur.fetchone(); cur.execute('CREATE DATABASE airflow') if exists is None else None; cur.close(); conn.close()\" &&
        airflow db migrate &&
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='airflow', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute('GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON SCHEMA public TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_airflow_meta'); print('omega_airflow_meta: grants applied to airflow DB'); cur.close(); conn.close()\" &&
        (airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@modecissions.local || true)
      "
    environment:
      # Sprint v1.38 (audit B6 P0.5): the init container intentionally
      # keeps the postgres superuser — it creates the `airflow` DB
      # and runs `airflow db migrate` which has to CREATE the
      # metastore tables. After that, it transfers ownership /
      # grants to omega_airflow_meta so the runtime webserver /
      # scheduler (next two services) can use the dedicated role.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      VAULT_URL: http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
    volumes:
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
    restart: "no"

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow
    entrypoint: /bin/bash
    command: -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Sprint v1.38 (audit B6 P0.5): the webserver runtime uses the
      # dedicated omega_airflow_meta role. airflow-init grants ALL
      # on the public schema of the `airflow` DB to this role after
      # `airflow db migrate`.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # Variables disponibles en los DAGs via Variable.get(). Sprint
      # v1.38: scoped to the operational omega_airflow_dag role
      # (REVOKEs on users / decisions / vault_entries enforced by
      # 36_cartridge_and_meta_roles.sql) so if a DAG ever starts
      # consuming this variable, the blast radius is the operational
      # tables, not superuser.
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "dummy-local-password"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # v1.43.1 (Claude B2): cartridge URLs are env-var driven so the
      # SAP DAGs are portable to Kubernetes / MWAA / Composer without
      # code edits. Defaults match the compose service hostnames so
      # local dev continues working unchanged.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      SAP_SUCCESSFACTORS_URL: "${SAP_SUCCESSFACTORS_URL:-http://sap-successfactors:8203}"
      # v1.43.1 R1 Security-F3: mirror docker-compose.aws.yml — even
      # though the Replicon DAG posts back through the console today,
      # keep the var here so a future cartridge-direct DAG works
      # without operators having to touch compose first.
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      # Conexiones API — definir aquí o en Airflow UI > Admin > Connections
    ports:
      - "8082:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sprint v1.41.1: Airflow webserver exposes /health on port 8080.
    # start_period covers the slow first boot while plugins/dags load.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: mode-airflow:2.10.5-local
    container_name: mode_airflow_scheduler
    command: scheduler
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:-}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:-}

      AIRFLOW_ADMIN_USER:                   ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD:               ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}

      VAULT_URL:                            http://vault:8300
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Sprint v1.38 (audit B6 P0.5): see comment on the airflow
      # webserver service above.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW_VAR_POSTGRES_CONN: "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      AIRFLOW_VAR_MINIO_ENDPOINT: "minio:9000"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "minio"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      AIRFLOW_VAR_MINIO_BUCKET: "lakehouse"
      AIRFLOW_VAR_MINIO_SECURE: "false"
      AIRFLOW_VAR_OUTLOOK_RECEIVER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_SENDER_EMAIL: "devnull@modecissions.local"
      AIRFLOW_VAR_OUTLOOK_APP_PASSWORD: "dummy-local-password"
      # DAG get_secret() prefers these env names over Variable.get; kept
      # alongside AIRFLOW_VAR_* during the transition off metadata-DB storage.
      MINIO_ACCESS_KEY:     "minio"
      MINIO_SECRET_KEY:     "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      OUTLOOK_APP_PASSWORD: "${OUTLOOK_APP_PASSWORD:-dummy-local-password}"
      # v1.43.1 (Claude B2): mirror the webserver's cartridge URL env vars
      # so DAGs parse the same way regardless of which Airflow component
      # imports them.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      SAP_SUCCESSFACTORS_URL: "${SAP_SUCCESSFACTORS_URL:-http://sap-successfactors:8203}"
      # v1.43.1 R1 Security-F3: mirror docker-compose.aws.yml.
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../cartridges:/registry/cartridges:ro
      - ../cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - ../cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      - ../cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - ../cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint v1.40: replicon-mock service was removed (cartridge restored,
      # real Replicon credentials live in Vault).
      
      
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sprint v1.41.1: scheduler doesn't expose HTTP; use `airflow jobs
    # check` against itself. Generous start_period — scheduler boot
    # also waits on DAG parsing.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  postgres_gold_data:
