      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for Replicon cartridge}
      CONSOLE_URL: http://console:8000
      MCP_INFRA_URL: http://mcp-infra:8010
      REFINEMENT_URL: http://refinement:8500
      REPLICON_API_TOKEN: ${REPLICON_API_TOKEN:-}
      REPLICON_TOKEN: ${REPLICON_TOKEN:-}
      REPLICON_BASE_URL: ${REPLICON_BASE_URL:-https://na5.replicon.com/analytics}
      # Sprint v1.40 (audit B6 pattern): least-privilege DB role.
      # See infra/init/37_replicon_role_and_tables.sql.
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_replicon:${OMEGA_CARTRIDGE_REPLICON_PASSWORD:?OMEGA_CARTRIDGE_REPLICON_PASSWORD is required}@postgres:5432/modecissions"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: lakehouse
      MINIO_SECURE: "false"
