# Optional same-host cartridge overlay for AWS/staging.
#
# Use together with the core compose:
#   docker compose -f docker-compose.aws.yml -f docker-compose.cartridges.yml up -d
#
# Production can still run cartridges in ECS/K8s/another EC2 by setting
# REPLICON_URL / HUBSPOT_URL / SALESFORCE_URL / SAP_*_URL in .env and
# setting DEPLOY_CARTRIDGES_SAME_HOST=false.

x-cartridge-env: &cartridge-env
  APP_ENV: ${APP_ENV:-production}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
  SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
  INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE: ${INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE:?INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE is required}
  INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:?INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE is required}
  INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:?INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE is required}
  INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:?INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT is required}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required}
  CONSOLE_URL: http://console:8000
  MCP_INFRA_URL: http://mcp-infra:8010
  REFINEMENT_URL: http://refinement:8500
  # Provider is explicit so an EC2 role-only deployment never interprets the
  # AWS endpoint as local MinIO when static AWS credentials are intentionally
  # absent.
  LAKEHOUSE_PROVIDER: "s3"
  LAKEHOUSE_ENDPOINT: s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com
  LAKEHOUSE_BUCKET: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
  MINIO_ENDPOINT: s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com
  MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-}
  MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  MINIO_BUCKET: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
  MINIO_SECURE: "true"
  AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
  AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION is required}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}

services:
  replicon:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/replicon:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_REPLICON_TO_CONSOLE: ${INTERNAL_API_KEY_REPLICON_TO_CONSOLE:?INTERNAL_API_KEY_REPLICON_TO_CONSOLE is required}
      INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA: ${INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA:?INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_REPLICON_TO_REFINEMENT: ${INTERNAL_API_KEY_REPLICON_TO_REFINEMENT:?INTERNAL_API_KEY_REPLICON_TO_REFINEMENT is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_replicon:${OMEGA_CARTRIDGE_REPLICON_PASSWORD:?OMEGA_CARTRIDGE_REPLICON_PASSWORD is required}@postgres:5432/modecissions"
      REPLICON_BASE_URL: ${REPLICON_BASE_URL:-https://na5.replicon.com/analytics}
      REPLICON_API_TOKEN: ${REPLICON_API_TOKEN:-}
      REPLICON_TOKEN: ${REPLICON_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8201/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  hubspot:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/hubspot:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE: ${INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE:?INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE is required}
      INTERNAL_API_KEY_HUBSPOT_TO_MCP_INFRA: ${INTERNAL_API_KEY_HUBSPOT_TO_MCP_INFRA:?INTERNAL_API_KEY_HUBSPOT_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_HUBSPOT_TO_REFINEMENT: ${INTERNAL_API_KEY_HUBSPOT_TO_REFINEMENT:?INTERNAL_API_KEY_HUBSPOT_TO_REFINEMENT is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_hubspot:${OMEGA_CARTRIDGE_HUBSPOT_PASSWORD:?OMEGA_CARTRIDGE_HUBSPOT_PASSWORD is required}@postgres:5432/modecissions"
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
      HUBSPOT_API_TOKEN: ${HUBSPOT_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8210/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  salesforce:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/salesforce:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE: ${INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE:?INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_salesforce:${OMEGA_CARTRIDGE_SALESFORCE_PASSWORD:?OMEGA_CARTRIDGE_SALESFORCE_PASSWORD is required}@postgres:5432/modecissions"
      SF_BASE_URL: ${SALESFORCE_BASE_URL:-}
      SF_TOKEN_URL: ${SALESFORCE_TOKEN_URL:-https://login.salesforce.com/services/oauth2/token}
      SF_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SF_USERNAME: ${SALESFORCE_USERNAME:-}
      SF_PASSWORD: ${SALESFORCE_PASSWORD:-}
      SF_SECURITY_TOKEN: ${SALESFORCE_SECURITY_TOKEN:-}
      SF_API_VERSION: ${SALESFORCE_API_VERSION:-v60.0}
      SF_ACCESS_TOKEN: ${SALESFORCE_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8205/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  banxico:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/banxico:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_BANXICO_TO_CONSOLE: ${INTERNAL_API_KEY_BANXICO_TO_CONSOLE:?INTERNAL_API_KEY_BANXICO_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_banxico:${OMEGA_CARTRIDGE_BANXICO_PASSWORD:?OMEGA_CARTRIDGE_BANXICO_PASSWORD is required}@postgres:5432/modecissions"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8215/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  inegi:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/inegi:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_INEGI_TO_CONSOLE: ${INTERNAL_API_KEY_INEGI_TO_CONSOLE:?INTERNAL_API_KEY_INEGI_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_inegi:${OMEGA_CARTRIDGE_INEGI_PASSWORD:?OMEGA_CARTRIDGE_INEGI_PASSWORD is required}@postgres:5432/modecissions"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8216/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sec-edgar:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sec_edgar:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_SEC_EDGAR_TO_CONSOLE: ${INTERNAL_API_KEY_SEC_EDGAR_TO_CONSOLE:?INTERNAL_API_KEY_SEC_EDGAR_TO_CONSOLE is required}
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:?SEC_EDGAR_USER_AGENT is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_sec_edgar:${OMEGA_CARTRIDGE_SEC_EDGAR_PASSWORD:?OMEGA_CARTRIDGE_SEC_EDGAR_PASSWORD is required}@postgres:5432/modecissions"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8217/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sap-hcm:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_hcm:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE:?INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_sap_hcm:${OMEGA_CARTRIDGE_SAP_HCM_PASSWORD:?OMEGA_CARTRIDGE_SAP_HCM_PASSWORD is required}@postgres:5432/modecissions"
      SAP_HCM_BASE_URL: ${SAP_HCM_BASE_URL:-}
      SAP_HCM_USER: ${SAP_HCM_USER:-}
      SAP_HCM_PASS: ${SAP_HCM_PASS:-}
      SAP_HCM_CLIENT_MANDANT: ${SAP_HCM_CLIENT_MANDANT:-100}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8202/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sap-successfactors:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_successfactors:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE:?INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_sap_sf:${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:?OMEGA_CARTRIDGE_SAP_SF_PASSWORD is required}@postgres:5432/modecissions"
      SF_BASE_URL: ${SF_BASE_URL:-}
      SF_COMPANY_ID: ${SF_COMPANY_ID:-}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_TOKEN_URL: ${SF_TOKEN_URL:-}
      SF_IDP_URL: ${SF_IDP_URL:-}
      SF_AUTH_METHOD: ${SF_AUTH_METHOD:-oauth2_client_credentials}
      SF_ADMIN_USER: ${SF_ADMIN_USER:-}
      SF_PRIVATE_KEY_PATH: ${SF_PRIVATE_KEY_PATH:-/run/secrets/sf_epiuse_iaappliance_connector.pem}
    volumes:
      # Optional X.509 key for SuccessFactors OAuth2 SAML Bearer Assertion.
      # In AWS the host file is normally rendered from SSM SecureString at boot.
      - ${SF_PRIVATE_KEY_HOST_PATH:-/dev/null}:${SF_PRIVATE_KEY_PATH:-/run/secrets/sf_epiuse_iaappliance_connector.pem}:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8203/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sap-s4hana:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_s4hana:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      <<: *cartridge-env
      INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE:?INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE is required}
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_sap_s4:${OMEGA_CARTRIDGE_SAP_S4_PASSWORD:?OMEGA_CARTRIDGE_SAP_S4_PASSWORD is required}@postgres:5432/modecissions"
      SAP_S4_BASE_URL: ${SAP_S4_BASE_URL:-}
      SAP_S4_USER: ${SAP_S4_USER:-}
      SAP_S4_PASS: ${SAP_S4_PASS:-}
      SAP_S4_CLIENT_MANDANT: ${SAP_S4_CLIENT_MANDANT:-100}
      SAP_S4_API_KEY: ${SAP_S4_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modecissions_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8204/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  modecissions_net:
    external: false
