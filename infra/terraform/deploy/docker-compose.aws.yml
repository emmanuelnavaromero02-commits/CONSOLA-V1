# ============================================================================
# MODecissions — Producción AWS (EC2 single-node)
# Secrets are injected by scripts/aws-entrypoint.sh at boot — DO NOT commit a .env to git.
# Repo clonado en /opt/modecissions/   (este archivo: /opt/modecissions/deploy/)
# postgres / postgres_gold → contenedores en la misma EC2 (paridad con local)
# minio                    → S3
# Imágenes buildeadas localmente con deploy/build.sh
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

networks:
  modecissions_net:
    driver: bridge

services:
  # ── Infrastructure (Postgres en contenedor, igual que local) ──────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: mode_postgres
    environment:
      POSTGRES_DB:       modecissions
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Sprint v1.38 + v1.40: forward every per-role password GUC the
      # init scripts read so AWS prod creates the same role set as
      # local dev. ``:-`` keeps the value empty if the operator hasn't
      # rotated .env to match — the migration aborts loudly via
      # ``RAISE EXCEPTION`` instead of creating a NULL-password role.
      PGOPTIONS: "-c app.omega_console_password=${OMEGA_CONSOLE_PASSWORD:?OMEGA_CONSOLE_PASSWORD is required} -c app.omega_outcome_binder_password=${OMEGA_OUTCOME_BINDER_PASSWORD:?OMEGA_OUTCOME_BINDER_PASSWORD is required} -c app.omega_refinement_password=${OMEGA_REFINEMENT_PASSWORD:?OMEGA_REFINEMENT_PASSWORD is required} -c app.omega_vault_password=${OMEGA_VAULT_PASSWORD:?OMEGA_VAULT_PASSWORD is required} -c app.omega_workspace_password=${OMEGA_WORKSPACE_PASSWORD:?OMEGA_WORKSPACE_PASSWORD is required} -c app.omega_mcp_infra_password=${OMEGA_MCP_INFRA_PASSWORD:?OMEGA_MCP_INFRA_PASSWORD is required} -c app.omega_cartridge_sap_hcm_password=${OMEGA_CARTRIDGE_SAP_HCM_PASSWORD:-} -c app.omega_cartridge_sap_s4_password=${OMEGA_CARTRIDGE_SAP_S4_PASSWORD:-} -c app.omega_cartridge_sap_sf_password=${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:-} -c app.omega_airflow_dag_password=${OMEGA_AIRFLOW_DAG_PASSWORD:-} -c app.omega_airflow_meta_password=${OMEGA_AIRFLOW_META_PASSWORD:-} -c app.omega_superset_meta_password=${OMEGA_SUPERSET_META_PASSWORD:-} -c app.omega_cartridge_replicon_password=${OMEGA_CARTRIDGE_REPLICON_PASSWORD:-} -c app.omega_cartridge_salesforce_password=${OMEGA_CARTRIDGE_SALESFORCE_PASSWORD:-} -c app.omega_cartridge_hubspot_password=${OMEGA_CARTRIDGE_HUBSPOT_PASSWORD:-} -c app.omega_cartridge_banxico_password=${OMEGA_CARTRIDGE_BANXICO_PASSWORD:-} -c app.omega_cartridge_inegi_password=${OMEGA_CARTRIDGE_INEGI_PASSWORD:-} -c app.omega_cartridge_sec_edgar_password=${OMEGA_CARTRIDGE_SEC_EDGAR_PASSWORD:-}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/modecissions/infra/init:/docker-entrypoint-initdb.d
    networks:
      - modecissions_net
    restart: unless-stopped
    logging: *default-logging
    # v1.43.4 (Claude N3): mirror the local healthcheck so AWS
    # depends_on can use ``condition: service_healthy`` instead of
    # the implicit "container started" semantics that race-condition
    # boot order.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d modecissions"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_gold:
    image: postgres:15
    container_name: mode_postgres_gold
    environment:
      POSTGRES_DB:       modecissions_gold
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGOPTIONS: "-c app.omega_refinement_gold_password=${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required} -c app.omega_gold_publisher_password=${OMEGA_GOLD_PUBLISHER_PASSWORD:?OMEGA_GOLD_PUBLISHER_PASSWORD is required} -c app.omega_gold_verifier_password=${OMEGA_GOLD_VERIFIER_PASSWORD:?OMEGA_GOLD_VERIFIER_PASSWORD is required}"
    command: -p 5433
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
      - /opt/modecissions/infra/init_gold:/docker-entrypoint-initdb.d
    networks:
      - modecissions_net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U postgres -d modecissions_gold"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mode_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - modecissions_net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Application services ──────────────────────────────────────────────────

  console:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/console:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_console
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: true
      - path: ${MODECISSIONS_CONTROL_ROOM_EVIDENCE_ENV_FILE:-${AWS_ENV_FILE:-.env}.control-room-evidence}
        required: true
    environment:
      APP_ENV:             ${APP_ENV:-production}
      COOKIE_SECURE:       ${COOKIE_SECURE:-true}
      DATABASE_URL:        "postgresql+psycopg2://omega_console:${OMEGA_CONSOLE_PASSWORD:?OMEGA_CONSOLE_PASSWORD is required}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:   "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      OUTCOME_BINDER_DATABASE_URL: "postgresql+psycopg2://omega_outcome_binder:${OMEGA_OUTCOME_BINDER_PASSWORD:?OMEGA_OUTCOME_BINDER_PASSWORD is required}@postgres:5432/modecissions"
      LAKEHOUSE_PROVIDER:  "s3"
      LAKEHOUSE_ENDPOINT:  "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET:    ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_BUCKET:        ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT:      "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY:    ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY:    ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_SECURE:        "true"
      AWS_DEFAULT_REGION:  ${AWS_REGION:?AWS_REGION is required}
      S3_BUCKET_NAME:      ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY:-}
      CHAT_LLM_PROVIDER:   ${CHAT_LLM_PROVIDER:-anthropic}
      CHAT_LLM_MODEL:      ${CHAT_LLM_MODEL:-claude-haiku-4-5-20251001}
      REFINEMENT_URL:      http://refinement:8500
      MCP_INFRA_URL:       http://mcp-infra:8010
      CONSOLE_INTERNAL_URL: http://console:8000
      AGENT_RUNNER_TOKEN:  ${AGENT_RUNNER_TOKEN:?AGENT_RUNNER_TOKEN is required}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_CONSOLE: ${INTERNAL_API_KEY_CONSOLE_TO_CONSOLE:?INTERNAL_API_KEY_CONSOLE_TO_CONSOLE is required}
      INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE: ${INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE:?INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE is required}
      SUPERSET_URL:        http://superset:8088
      AIRFLOW_PUBLIC_URL:  ${AIRFLOW_PUBLIC_URL:-}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-}
      # Least-privilege Superset service account for Studio dataset creation.
      # Production refuses admin fallback.
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:?SUPERSET_SERVICE_USER is required}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?SUPERSET_SERVICE_PASSWORD is required}
      SUPERSET_ADMIN_USER:  ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_GOLD_SQLALCHEMY_URI: "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      CONSOLE_URL:         ${CONSOLE_URL:?CONSOLE_URL is required}
      WORKSPACE_URL:       ${WORKSPACE_PUBLIC_URL:?WORKSPACE_PUBLIC_URL is required}
      RAG_URL:             http://mcp-infra:8010   # RAG migrado a mcp-infra
      REDIS_URL:           ${REDIS_URL:-redis://redis:6379/0}
      # Email: MailHog/SMTP in staging, SES API in production after domain verification.
      EMAIL_PROVIDER:      ${EMAIL_PROVIDER:-smtp}
      AWS_REGION:          ${AWS_REGION:?AWS_REGION is required}
      SMTP_HOST:           ${SMTP_HOST:-mailhog}
      SMTP_PORT:           ${SMTP_PORT:-1025}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASSWORD:       ${SMTP_PASSWORD:-}
      SMTP_FROM:           ${SMTP_FROM:-noreply@modecissions.local}
      SMTP_FROM_DOMAIN:    ${SMTP_FROM_DOMAIN:-modecissions.local}
      SMTP_USE_TLS:        ${SMTP_USE_TLS:-false}
      VPN_API_URL:         ${VPN_API_URL:-}
      VPN_API_PASSWORD:    ${VPN_API_PASSWORD:-}
      VPN_TOKEN_TTL_HOURS: ${VPN_TOKEN_TTL_HOURS:-72}
      VPN_CLIENT_ALLOWED_IPS: ${VPN_CLIENT_ALLOWED_IPS:-10.0.0.0/16,10.8.0.0/24}
      VPN_CLIENT_STRIP_DNS: ${VPN_CLIENT_STRIP_DNS:-true}
      APP_BASE_URL:        ${APP_BASE_URL:-}
      INVITE_TOKEN_TTL_HOURS: ${INVITE_TOKEN_TTL_HOURS:-72}
      RESET_TOKEN_TTL_HOURS:  ${RESET_TOKEN_TTL_HOURS:-1}
      JWT_SECRET_KEY:      ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:       ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    ports:
      - "8000:8000"
    volumes:
      - /opt/modecissions/VERSION:/app/VERSION:ro
      - /opt/modecissions/cartridges:/registry/cartridges:ro
      - /opt/modecissions/airflow/dags:/opt/airflow/dags:ro
      - /opt/modecissions/console/app/static:/app/app/static:ro
    networks:
      - modecissions_net
    # v1.43.4 (Claude N3): wait on the upstream healthchecks rather
    # than the implicit "container started" race window — postgres
    # accepting connections, mcp-infra serving /healthz, mailhog
    # listening on its inbox port. Pre-v1.43.4 a slow Postgres init
    # would let console boot, fail its DB pool warmup, and end up
    # in a restart loop while the operator stared at "starting".
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-infra:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  workspace:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/workspace:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_workspace
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV:              ${APP_ENV:-production}
      COOKIE_SECURE:        ${COOKIE_SECURE:-true}
      DATABASE_URL:         "postgresql+psycopg2://omega_workspace:${OMEGA_WORKSPACE_PASSWORD:?OMEGA_WORKSPACE_PASSWORD is required}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:    "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      REFINEMENT_URL:       http://refinement:8500
      MCP_INFRA_URL:        http://mcp-infra:8010
      CONSOLE_URL:          ${CONSOLE_URL:?CONSOLE_URL is required}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:?WORKSPACE_PUBLIC_URL is required}
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      CHAT_LLM_PROVIDER:    ${CHAT_LLM_PROVIDER:-anthropic}
      CHAT_LLM_MODEL:       ${CHAT_LLM_MODEL:-claude-haiku-4-5-20251001}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8001:8001"
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      refinement:
        condition: service_healthy
      mcp-infra:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  refinement:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/refinement:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_refinement
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    # Refinement is the only service that can consume the whole host on a single
    # request: DuckDB sizes itself from host RAM, not from the container. Nothing
    # here bounded it, so an unbounded materialization took the host down on
    # 2026-09-20. All four keys are declared by the service rather than inherited
    # from the shared .env on purpose -- that is how the limit reached production
    # until now, and a re-rendered .env must not be able to remove the ceiling.
    mem_limit: ${REFINEMENT_MEM_LIMIT:-3g}
    cpus: ${REFINEMENT_CPUS:-1.5}
    environment:
      DUCKDB_MEMORY_LIMIT:            ${DUCKDB_MEMORY_LIMIT:-1GB}
      # DuckDB already spills without these: to the relative path ".tmp", capped
      # at ~90% of the filesystem -- the same volume as the Postgres data
      # directories. These two pin the spill somewhere stable and bound it. The
      # path is absolute (DuckDB rejects relative ones) and lives on the
      # container's writable layer, which is disk, not tmpfs.
      #
      # The engine only reads them from v1.45.230-beta onward (#658, #659). On
      # an older image they are inert: harmless, but spill stays uncapped.
      DUCKDB_TEMP_DIRECTORY:          ${DUCKDB_TEMP_DIRECTORY:-/tmp/duckdb-spill}
      DUCKDB_MAX_TEMP_DIRECTORY_SIZE: ${DUCKDB_MAX_TEMP_DIRECTORY_SIZE:-8GB}
      DUCKDB_THREADS:                 ${DUCKDB_THREADS:-2}
      APP_ENV:            ${APP_ENV:-production}
      DATABASE_URL:       "postgresql+psycopg2://omega_refinement:${OMEGA_REFINEMENT_PASSWORD:?OMEGA_REFINEMENT_PASSWORD is required}@postgres:5432/modecissions"
      GOLD_DATABASE_URL:  "postgresql+psycopg2://omega_refinement_gold:${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      GOLD_PUBLISHER_DATABASE_URL: "postgresql+psycopg2://omega_gold_publisher:${OMEGA_GOLD_PUBLISHER_PASSWORD:?OMEGA_GOLD_PUBLISHER_PASSWORD is required}@postgres_gold:5433/modecissions_gold"
      GOLD_VERIFIER_DATABASE_URL_FILE: /run/secrets/gold_verifier_database_url
      LAKEHOUSE_PROVIDER: "s3"
      LAKEHOUSE_ENDPOINT: "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET:   ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_BUCKET:       ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT:     "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY:   ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY:   ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_SECURE:       "true"
      AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION is required}
      S3_BUCKET_NAME:     ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      SQL_LLM_MODEL:      ${SQL_LLM_MODEL:-claude-sonnet-4-6}
      MCP_INFRA_URL:      http://mcp-infra:8010
      INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT: ${INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT:?INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT is required}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
    volumes:
      - type: bind
        source: ${GOLD_VERIFIER_DATABASE_URL_HOST_FILE:?GOLD_VERIFIER_DATABASE_URL_HOST_FILE is required}
        target: /run/secrets/gold_verifier_database_url
        read_only: true
    ports:
      - "8500:8500"
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/readyz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  vault:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/vault:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_vault
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV:           ${APP_ENV:-production}
      DATABASE_URL:      "postgresql+psycopg2://omega_vault:${OMEGA_VAULT_PASSWORD:?OMEGA_VAULT_PASSWORD is required}@postgres:5432/modecissions"
      INTERNAL_API_KEY:  ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      INTERNAL_API_KEY_CONSOLE_TO_VAULT: ${INTERNAL_API_KEY_CONSOLE_TO_VAULT:?INTERNAL_API_KEY_CONSOLE_TO_VAULT is required}
      INTERNAL_API_KEY_MCP_INFRA_TO_VAULT: ${INTERNAL_API_KEY_MCP_INFRA_TO_VAULT:?INTERNAL_API_KEY_MCP_INFRA_TO_VAULT is required}
      INTERNAL_API_KEY_WORKSPACE_TO_VAULT: ${INTERNAL_API_KEY_WORKSPACE_TO_VAULT:?INTERNAL_API_KEY_WORKSPACE_TO_VAULT is required}
      INTERNAL_API_KEY_REFINEMENT_TO_VAULT: ${INTERNAL_API_KEY_REFINEMENT_TO_VAULT:?INTERNAL_API_KEY_REFINEMENT_TO_VAULT is required}
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mode_mailhog
    ports:
      - "1025:1025"   # SMTP (consumed by console)
      - "8025:8025"   # Web UI (only accessible from VPN peers via App SG)
    networks:
      - modecissions_net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/api/v1/messages || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sap-successfactors:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/sap_successfactors:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_sap_successfactors
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE: ${INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE:?INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE is required}
      INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE: ${INTERNAL_API_KEY_CONSOLE_TO_CARTRIDGE:-}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE: ${INTERNAL_API_KEY_CARTRIDGE_TO_CONSOLE:-}
      INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT: ${INTERNAL_API_KEY_CARTRIDGE_TO_REFINEMENT:-}
      CONSOLE_URL: http://console:8000
      DATABASE_URL: "postgresql+psycopg2://omega_cartridge_sap_sf:${OMEGA_CARTRIDGE_SAP_SF_PASSWORD:?OMEGA_CARTRIDGE_SAP_SF_PASSWORD is required}@postgres:5432/modecissions"
      LAKEHOUSE_PROVIDER: "s3"
      LAKEHOUSE_ENDPOINT: "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT: "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_BUCKET: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_SECURE: "true"
      AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      REFINEMENT_URL: http://refinement:8500
      SF_BASE_URL: ${SF_BASE_URL:-}
      SF_COMPANY_ID: ${SF_COMPANY_ID:-}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_TOKEN_URL: ${SF_TOKEN_URL:-}
      SF_IDP_URL: ${SF_IDP_URL:-}
      SF_AUTH_METHOD: ${SF_AUTH_METHOD:-oauth2_client_credentials}
      SF_ADMIN_USER: ${SF_ADMIN_USER:-}
      SF_PRIVATE_KEY_PATH: ${SF_PRIVATE_KEY_PATH:-/run/secrets/sf_epiuse_iaappliance_connector.pem}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for SAP cartridges}
    volumes:
      # Optional X.509 key for SuccessFactors OAuth2 SAML Bearer Assertion.
      # Most production installs store the PEM in scoped Vault as private_key_pem;
      # this mount is available only for operators who prefer a host secret file.
      - ${SF_PRIVATE_KEY_HOST_PATH:-/dev/null}:${SF_PRIVATE_KEY_PATH:-/run/secrets/sf_epiuse_iaappliance_connector.pem}:ro
    ports:
      - "8203:8203"
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      console:
        condition: service_healthy
      refinement:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8203/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── MCP Infrastructure ────────────────────────────────────────────────────

  mcp-infra:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/mcp-infra:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_mcp_infra
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV:           ${APP_ENV:-production}
      MCP_INFRA_PDF_MAX_WORKERS: ${MCP_INFRA_PDF_MAX_WORKERS:-2}
      SECURITY_CONTEXT_SIGNING_KEY: ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE: ${INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE:?INTERNAL_API_KEY_MCP_INFRA_TO_CONSOLE is required}
      INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT: ${INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT:?INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT is required}
      CONSOLE_INTERNAL_URL: http://console:8000
      REFINEMENT_URL:     http://refinement:8500
      AIRFLOW_URL:       http://airflow:8080/airflow
      AIRFLOW_USER:      ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_PASSWORD:  ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      AIRFLOW_DAGS_PATH: /opt/airflow/dags
      LAKEHOUSE_PROVIDER: "s3"
      LAKEHOUSE_ENDPOINT: "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_BUCKET:      ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT:    "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY:  ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY:  ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_SECURE:      "true"
      AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_REGION:        ${AWS_REGION:?AWS_REGION is required}
      BEDROCK_REGION:    ${BEDROCK_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_BUCKET_NAME:    ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      PG_HOST:           postgres
      PG_PORT:           5432
      PG_DB:             modecissions
      PG_USER:           omega_mcp_infra
      PG_PASSWORD:       ${OMEGA_MCP_INFRA_PASSWORD:?OMEGA_MCP_INFRA_PASSWORD is required}
      PG_GOLD_HOST:      postgres_gold
      PG_GOLD_PORT:      5433
      PG_GOLD_DB:        modecissions_gold
      PG_GOLD_USER:      omega_refinement_gold
      PG_GOLD_PASSWORD:  ${OMEGA_REFINEMENT_GOLD_PASSWORD:?OMEGA_REFINEMENT_GOLD_PASSWORD is required}
      SUPERSET_URL:      http://superset:8088
      SUPERSET_USER:     ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      EMBED_MODEL:       ${EMBED_MODEL:-amazon.titan-embed-text-v2:0}
      EMBED_DIM:         ${EMBED_DIM:-1024}
      RAG_LOCAL_EMBEDDING_FALLBACK: ${RAG_LOCAL_EMBEDDING_FALLBACK:-true}
      ADMIN_EMAIL:       ${ADMIN_EMAIL:-}
    mem_limit: ${MCP_INFRA_MEM_LIMIT:-1536m}
    cpus: ${MCP_INFRA_CPUS:-2.0}
    pids_limit: ${MCP_INFRA_PIDS_LIMIT:-128}
    # v1.43.4 (Codex H1): mcp-infra port 8010 is no longer published
    # on the host network in AWS — it's an internal service consumed
    # only by console / workspace / airflow workers over the
    # modecissions_net docker bridge. Publishing 8010:8010 exposed
    # the entire MCP tool surface (including airflow_create_dag,
    # which is gated by APP_ENV but still a write-destructive RCE
    # tool) to whatever IPs the AWS security group allows on port
    # 8010 — i.e. one mis-clicked SG rule away from public.
    # Defence-in-depth: the SG already restricts the port, the
    # APP_ENV gate already blocks airflow_create_dag in production,
    # and removing the host-port binding makes external reach
    # impossible regardless of either.
    volumes:
      - /opt/modecissions/airflow/dags:/opt/airflow/dags
      - /opt/modecissions/cartridges:/registry/cartridges:ro
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
      airflow:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Superset ──────────────────────────────────────────────────────────────

  superset-init:
    image: apache/superset:3.1.3
    container_name: mode_superset_init
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_PREVIOUS_SECRET_KEY: ${SUPERSET_PREVIOUS_SECRET_KEY:-}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/superset"
      OMEGA_SUPERSET_META_PASSWORD: ${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}
      SUPERSET_TALISMAN_ENABLED: ${SUPERSET_TALISMAN_ENABLED:-true}
      SUPERSET_CSRF_ENABLED: ${SUPERSET_CSRF_ENABLED:-true}
      SUPERSET_RATELIMIT_ENABLED: ${SUPERSET_RATELIMIT_ENABLED:-true}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_ENABLE_PROXY_FIX: ${SUPERSET_ENABLE_PROXY_FIX:-true}
      SUPERSET_SESSION_COOKIE_SECURE: ${SUPERSET_SESSION_COOKIE_SECURE:-true}
      SUPERSET_SESSION_COOKIE_SAMESITE: ${SUPERSET_SESSION_COOKIE_SAMESITE:-Lax}
      SUPERSET_FORCE_HTTPS: ${SUPERSET_FORCE_HTTPS:-true}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:?SUPERSET_SERVICE_USER is required}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?SUPERSET_SERVICE_PASSWORD is required}
    volumes:
      - /opt/modecissions/infra/terraform/deploy/superset_config/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        set -e
        superset db upgrade
        python3 - <<'PY'
        import os

        from superset.app import create_app
        from superset.extensions import db

        def upsert_admin(username: str, password: str, first_name: str, last_name: str, email: str) -> None:
            from superset import security_manager

            role = security_manager.find_role("Admin")
            user = security_manager.find_user(username=username)
            if user is None:
                security_manager.add_user(username, first_name, last_name, email, role, password)
                print(f"superset user created: {username}")
                return
            user.first_name = first_name
            user.last_name = last_name
            user.email = email
            user.active = True
            user.roles = [role]
            db.session.add(user)
            db.session.commit()
            security_manager.reset_password(user.id, password)
            print(f"superset user reset: {username}")

        app = create_app()
        with app.app_context():
            upsert_admin(
                os.environ["SUPERSET_ADMIN_USER"],
                os.environ["SUPERSET_ADMIN_PASSWORD"],
                "Admin",
                "User",
                "admin@modecissions.local",
            )
            upsert_admin(
                os.environ["SUPERSET_SERVICE_USER"],
                os.environ["SUPERSET_SERVICE_PASSWORD"],
                "Omega",
                "Service",
                "service@modecissions.local",
            )
        PY
        if [ -n "${SUPERSET_PREVIOUS_SECRET_KEY:-}" ]; then
          superset re-encrypt-secrets
        fi
        superset init
        python3 - <<'PY'
        import os
        import psycopg2

        conn = psycopg2.connect(
            host="postgres",
            port=5432,
            dbname="superset",
            user="postgres",
            password=os.environ["POSTGRES_PASSWORD"],
        )
        conn.autocommit = True
        cur = conn.cursor()
        for statement in (
            "GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_superset_meta",
            "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_superset_meta",
            "GRANT ALL ON SCHEMA public TO omega_superset_meta",
            "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_superset_meta",
            "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_superset_meta",
        ):
            cur.execute(statement)
        print("omega_superset_meta grants applied to superset DB")
        cur.close()
        conn.close()
        PY
    networks:
      - modecissions_net
    # v1.43.4 (Claude N3): one-shot init waits on postgres healthy
    # so ``superset db upgrade`` doesn't race the DB startup.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  superset:
    image: apache/superset:3.1.3
    container_name: mode_superset
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    environment:
      SUPERSET_SECRET_KEY:     ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_PREVIOUS_SECRET_KEY: ${SUPERSET_PREVIOUS_SECRET_KEY:-}
      POSTGRES_PASSWORD:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://omega_superset_meta:${OMEGA_SUPERSET_META_PASSWORD:?OMEGA_SUPERSET_META_PASSWORD is required}@postgres:5432/superset"
      SUPERSET_TALISMAN_ENABLED: ${SUPERSET_TALISMAN_ENABLED:-true}
      SUPERSET_CSRF_ENABLED: ${SUPERSET_CSRF_ENABLED:-true}
      SUPERSET_RATELIMIT_ENABLED: ${SUPERSET_RATELIMIT_ENABLED:-true}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_ENABLE_PROXY_FIX: ${SUPERSET_ENABLE_PROXY_FIX:-true}
      SUPERSET_SESSION_COOKIE_SECURE: ${SUPERSET_SESSION_COOKIE_SECURE:-true}
      SUPERSET_SESSION_COOKIE_SAMESITE: ${SUPERSET_SESSION_COOKIE_SAMESITE:-Lax}
      SUPERSET_FORCE_HTTPS: ${SUPERSET_FORCE_HTTPS:-true}
      SUPERSET_WEBSERVER_PORT: 8088
    volumes:
      - /opt/modecissions/infra/terraform/deploy/superset_config/superset_config.py:/app/pythonpath/superset_config.py:ro
    # El contenedor escucha internamente en 0.0.0.0, pero el puerto del host se
    # limita a loopback. Produccion debe exponer Superset por proxy/TLS/auth.
    command: superset run -h 0.0.0.0 -p 8088 --with-threads --reload
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow ───────────────────────────────────────────────────────────────
  # Init (correr una vez):
  #   docker compose -f docker-compose.aws.yml run --rm airflow-init

  airflow-init:
    # One-shot bootstrap: connects as the postgres superuser BY
    # DESIGN — `airflow db migrate` has to CREATE the metastore
    # tables, then we transfer GRANTs to omega_airflow_meta so the
    # runtime services (next two) can use the dedicated role.
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_airflow_init
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate &&
        pip install --quiet psycopg2-binary &&
        python -c \"import os, psycopg2; conn = psycopg2.connect(host='postgres', port=5432, dbname='airflow', user='postgres', password=os.environ['POSTGRES_PASSWORD']); conn.autocommit = True; cur = conn.cursor(); cur.execute('GRANT ALL ON ALL TABLES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO omega_airflow_meta'); cur.execute('GRANT ALL ON SCHEMA public TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO omega_airflow_meta'); cur.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO omega_airflow_meta'); print('omega_airflow_meta: grants applied'); cur.close(); conn.close()\" &&
        (airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname User --role Admin --email admin@modecissions.local || true) &&
        airflow users reset-password --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      "
    environment:
      POSTGRES_PASSWORD:                    ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_ADMIN_USER:                   ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required}
      AIRFLOW_ADMIN_PASSWORD:               ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      AIRFLOW__CORE__EXECUTOR:              LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:  "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES:         "false"
      AIRFLOW__WEBSERVER__SECRET_KEY:       ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      INTERNAL_API_KEY:                     ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:  ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:?INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:?INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:?INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:?INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE is required}
      SECURITY_CONTEXT_SIGNING_KEY:         ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      CONSOLE_URL:                          http://console:8000
      AGENT_RUNNER_TOKEN:                   ${AGENT_RUNNER_TOKEN:?AGENT_RUNNER_TOKEN is required}
      VAULT_URL:                            http://vault:8300
      FIELD_ENCRYPTION_KEY:                 ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for cartridge DAGs}
    networks:
      - modecissions_net
    # v1.43.4 (Claude N3): wait on postgres healthy so
    # ``airflow db migrate`` doesn't race the DB startup.
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  airflow:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_airflow
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    entrypoint: /bin/bash
    command: -c "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"
    environment:
      AIRFLOW__CORE__EXECUTOR:              LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Sprint v1.38 (audit B6 P0.5): runtime services use dedicated
      # omega_airflow_meta role; init keeps superuser by design.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:  "postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES:         "false"
      AIRFLOW__WEBSERVER__SECRET_KEY:       ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      INTERNAL_API_KEY:                     ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:  ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:?INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:?INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:?INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:?INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE is required}
      SECURITY_CONTEXT_SIGNING_KEY:         ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      CONSOLE_URL:                          http://console:8000
      AGENT_RUNNER_TOKEN:                   ${AGENT_RUNNER_TOKEN:?AGENT_RUNNER_TOKEN is required}
      VAULT_URL:                            http://vault:8300
      FIELD_ENCRYPTION_KEY:                 ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for cartridge DAGs}
      AIRFLOW_URL:                          http://airflow:8080/airflow
      AIRFLOW__API__AUTH_BACKENDS:          "airflow.api.auth.backend.basic_auth"
      AIRFLOW__WEBSERVER__BASE_URL:         "${AIRFLOW_PUBLIC_URL:-http://airflow:8080}"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW_HEALTH_PATH:                  "${AIRFLOW_HEALTH_PATH:-/airflow/health}"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: ${AIRFLOW_WEBSERVER_MASTER_TIMEOUT:-300}
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: ${AIRFLOW_WEBSERVER_WORKER_TIMEOUT:-300}
      # Sprint v1.38: scoped operational role; see local compose comment.
      AIRFLOW_VAR_POSTGRES_CONN:            "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      DATABASE_URL:                         "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      LAKEHOUSE_PROVIDER:                   "s3"
      LAKEHOUSE_ENDPOINT:                   "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET:                     ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_LAKEHOUSE_PROVIDER:       "s3"
      AIRFLOW_VAR_LAKEHOUSE_ENDPOINT:       "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      AIRFLOW_VAR_LAKEHOUSE_BUCKET:         ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_S3_BUCKET:                ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_MINIO_BUCKET:             ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_MINIO_ENDPOINT:           "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      AIRFLOW_VAR_MINIO_ACCESS_KEY:         ${AWS_ACCESS_KEY_ID:-}
      AIRFLOW_VAR_MINIO_SECRET_KEY:         ${AWS_SECRET_ACCESS_KEY:-}
      AIRFLOW_VAR_MINIO_SECURE:             "true"
      AIRFLOW_VAR_AWS_REGION:               ${AWS_REGION:?AWS_REGION is required}
      MINIO_BUCKET:                         ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT:                       "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY:                     ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY:                     ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_SECURE:                         "true"
      REFINEMENT_URL:                       http://refinement:8500
      # v1.43.1 (Codex P0-4): cartridges are deployed OUT OF THIS COMPOSE
      # — see DEPLOY-RUNBOOK.md §"Cartridges deployed separately". The
      # DAGs need to know where each cartridge lives; the operator sets
      # these env vars to the cluster-local hostnames (Kubernetes service
      # DNS, MWAA secret, etc.). The defaults here MATCH the local
      # docker-compose service names so that pinning the cartridges on
      # the same host with `--profile sap` (escape hatch for staging)
      # works without further env tweaks.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      SALESFORCE_URL:         "${SALESFORCE_URL:-http://salesforce:8205}"
      HUBSPOT_URL:            "${HUBSPOT_URL:-http://hubspot:8210}"
      BANXICO_URL:            "${BANXICO_URL:-http://banxico:8215}"
      INEGI_URL:              "${INEGI_URL:-http://inegi:8216}"
      SEC_EDGAR_URL:          "${SEC_EDGAR_URL:-http://sec-edgar:8217}"
    ports:
      - "8082:8080"
    volumes:
      - /opt/modecissions/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - /opt/modecissions/cartridges:/registry/cartridges:ro
      - /opt/modecissions/cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - /opt/modecissions/cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - /opt/modecissions/cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      - /opt/modecissions/cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      - /opt/modecissions/cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Salesforce DAGs (service may not be provisioned on every AWS
      # target yet; mount is safe — Airflow sees an empty dir if unprovisioned).
      - /opt/modecissions/cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
      - /opt/modecissions/cartridges/banxico/dags:/opt/airflow/dags/banxico:ro
      - /opt/modecissions/cartridges/inegi/dags:/opt/airflow/dags/inegi:ro
      - /opt/modecissions/cartridges/sec_edgar/dags:/opt/airflow/dags/sec_edgar:ro
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080$${AIRFLOW_HEALTH_PATH:-/health} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    image: ghcr.io/${GHCR_OWNER:-emmanuelnavaromero02-commits}/airflow:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: mode_airflow_scheduler
    env_file:
      - path: ${AWS_ENV_FILE:-.env}
        required: false
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR:              LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Sprint v1.38 (audit B6 P0.5): runtime services use dedicated
      # omega_airflow_meta role; init keeps superuser by design.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:  "postgresql+psycopg2://omega_airflow_meta:${OMEGA_AIRFLOW_META_PASSWORD:?OMEGA_AIRFLOW_META_PASSWORD is required}@postgres:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES:         "false"
      AIRFLOW__WEBSERVER__SECRET_KEY:       ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      INTERNAL_API_KEY:                     ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:  ${INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE:?INTERNAL_API_KEY_AIRFLOW_TO_CONSOLE is required}
      INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA: ${INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA:?INTERNAL_API_KEY_AIRFLOW_TO_MCP_INFRA is required}
      INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT: ${INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT:?INTERNAL_API_KEY_AIRFLOW_TO_REFINEMENT is required}
      INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE: ${INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE:?INTERNAL_API_KEY_AIRFLOW_TO_CARTRIDGE is required}
      SECURITY_CONTEXT_SIGNING_KEY:         ${SECURITY_CONTEXT_SIGNING_KEY:?SECURITY_CONTEXT_SIGNING_KEY is required}
      CONSOLE_URL:                          http://console:8000
      AGENT_RUNNER_TOKEN:                   ${AGENT_RUNNER_TOKEN:?AGENT_RUNNER_TOKEN is required}
      VAULT_URL:                            http://vault:8300
      FIELD_ENCRYPTION_KEY:                 ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY is required for cartridge DAGs}
      AIRFLOW_URL:                          http://airflow:8080/airflow
      # Sprint v1.38: scoped operational role; see local compose comment.
      AIRFLOW_VAR_POSTGRES_CONN:            "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      DATABASE_URL:                         "postgresql://omega_airflow_dag:${OMEGA_AIRFLOW_DAG_PASSWORD:?OMEGA_AIRFLOW_DAG_PASSWORD is required}@postgres:5432/modecissions"
      LAKEHOUSE_PROVIDER:                   "s3"
      LAKEHOUSE_ENDPOINT:                   "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      LAKEHOUSE_BUCKET:                     ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_LAKEHOUSE_PROVIDER:       "s3"
      AIRFLOW_VAR_LAKEHOUSE_ENDPOINT:       "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      AIRFLOW_VAR_LAKEHOUSE_BUCKET:         ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_S3_BUCKET:                ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_MINIO_BUCKET:             ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      AIRFLOW_VAR_MINIO_ENDPOINT:           "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      AIRFLOW_VAR_MINIO_ACCESS_KEY:         ${AWS_ACCESS_KEY_ID:-}
      AIRFLOW_VAR_MINIO_SECRET_KEY:         ${AWS_SECRET_ACCESS_KEY:-}
      AIRFLOW_VAR_MINIO_SECURE:             "true"
      AIRFLOW_VAR_AWS_REGION:               ${AWS_REGION:?AWS_REGION is required}
      MINIO_BUCKET:                         ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      MINIO_ENDPOINT:                       "s3.${AWS_REGION:?AWS_REGION is required}.amazonaws.com"
      MINIO_ACCESS_KEY:                     ${AWS_ACCESS_KEY_ID:-}
      MINIO_SECRET_KEY:                     ${AWS_SECRET_ACCESS_KEY:-}
      MINIO_SECURE:                         "true"
      REFINEMENT_URL:                       http://refinement:8500
      # v1.43.1 (Codex P0-4): mirror the webserver's cartridge URL vars.
      SAP_HCM_URL:            "${SAP_HCM_URL:-http://sap-hcm:8202}"
      SAP_S4HANA_URL:         "${SAP_S4HANA_URL:-http://sap-s4hana:8204}"
      REPLICON_URL:           "${REPLICON_URL:-http://replicon:8201}"
      SALESFORCE_URL:         "${SALESFORCE_URL:-http://salesforce:8205}"
      HUBSPOT_URL:            "${HUBSPOT_URL:-http://hubspot:8210}"
      BANXICO_URL:            "${BANXICO_URL:-http://banxico:8215}"
      INEGI_URL:              "${INEGI_URL:-http://inegi:8216}"
      SEC_EDGAR_URL:          "${SEC_EDGAR_URL:-http://sec-edgar:8217}"
    volumes:
      - /opt/modecissions/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - /opt/modecissions/cartridges:/registry/cartridges:ro
      - /opt/modecissions/cartridges/sap_successfactors/dags:/opt/airflow/dags/sap_successfactors:ro
      - /opt/modecissions/cartridges/sap_hcm/dags:/opt/airflow/dags/sap_hcm:ro
      # Sprint v1.40: Replicon DAGs ship inside the cartridge.
      - /opt/modecissions/cartridges/replicon/dags:/opt/airflow/dags/replicon:ro
      - /opt/modecissions/cartridges/hubspot/dags:/opt/airflow/dags/hubspot:ro
      - /opt/modecissions/cartridges/sap_s4hana/dags:/opt/airflow/dags/sap_s4hana:ro
      # Salesforce DAGs (service may not be provisioned on every AWS
      # target yet; mount is safe — Airflow sees an empty dir if unprovisioned).
      - /opt/modecissions/cartridges/salesforce/dags:/opt/airflow/dags/salesforce:ro
      - /opt/modecissions/cartridges/banxico/dags:/opt/airflow/dags/banxico:ro
      - /opt/modecissions/cartridges/inegi/dags:/opt/airflow/dags/inegi:ro
      - /opt/modecissions/cartridges/sec_edgar/dags:/opt/airflow/dags/sec_edgar:ro
    networks:
      - modecissions_net
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys; sys.exit(0 if any(('airflow scheduler' in open('/proc/' + p + '/cmdline', 'rb').read().replace(b'\\0', b' ').decode('utf-8', 'ignore')) for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  postgres_gold_data:
  redis_data:
  airflow_logs:
  airflow_plugins:
  wireguard_data:
