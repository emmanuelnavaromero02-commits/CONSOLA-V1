[extend]
useDefault = true

[allowlist]
description = "Documented public or CI-only literal values"
regexes = [
    # CI-only dummy Fernet key (.github/workflows/docker-image.yml compose validation).
    '''d7to_DkrHVKV5_jOzwCNV-wOl4r6gGCY7Usccczm9dk=''',
    # INEGI public catalog token (cartridges/inegi/app/core/inegi_client.py).
    '''96fbd1bf-21e6-28e3-6e64-2b15999d2c89''',
]

[[rules]]
id = "omega-personal-access-token"
description = "OMEGA personal access token"
regex = '''omega_pat_[A-Za-z0-9]{43}'''
keywords = ["omega_pat_"]
