# SAP HCM (NetWeaver Gateway OData).
#
# Phase-2 alignment: the ``entity:`` key is the BUSINESS name the rest of the
# platform already uses (entity_config rows, knowledge_bits, the bronze path
# raw/sap_hcm/<entity>/, semantic_terms). The technical OData path lives in
# ``odata_entity:`` — extraction_service resolves it via
# ``config.get("odata_entity", entity)`` and never sees the business name.
#
# Point ``SAP_HCM_BASE_URL`` at /sap/opu/odata/sap (NOT one specific service);
# ``odata_entity`` spells out "<SERVICE>/<EntitySet>" per entity.
#
# Organizational Management objects (OrgUnit / Position / JobCode) all live in
# the same HRP1000Set entity set, distinguished by object type. ``odata_filter``
# carries the OData ``$filter`` (e.g. "Otype eq 'O'") so they no longer
# overwrite each other in bronze.
#
# Privacy is declared per field under ``protection:`` (plain | masked |
# shadowed | encrypted) and enforced by protection_service before parquet write.
entities:
  # ── Employee master data (PA infotypes) ───────────────────────────────────
  - entity: EmployeeMaster
    odata_entity: HRPA_EE_PA_SRV/PA0001Set
    description: "Organizational assignment (IT0001): org unit, position, cost center."
    mode: incremental
    watermark_field: AedtmAed
    watermark_format: iso8601
    page_size: 1000
    primary_key: Pernr
    effective_dated: true
    date_field: Begda
    select_fields:
      - Pernr
      - Begda
      - Endda
      - Bukrs
      - Werks
      - Persg
      - Persk
      - Orgeh
      - Plans
      - Kostl
      - AedtmAed
    protection:
      Pernr: shadowed

  - entity: PersonalData
    odata_entity: HRPA_EE_PA_SRV/PA0002Set
    description: "Personal data (IT0002): name, gender, date of birth, marital status."
    mode: incremental
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: Pernr
    select_fields:
      - Pernr
      - Vorna
      - Nachn
      - Gbdat
      - Gesch
      - Famst
      - AedtmAed
    protection:
      Pernr: shadowed
      Vorna: masked
      Nachn: masked
      Gbdat: encrypted

  - entity: EmployeeActions
    odata_entity: HRPA_EE_PA_SRV/PA0000Set
    description: "Actions (IT0000): hire, transfer, termination."
    mode: incremental
    watermark_field: AedtmAed
    page_size: 500
    primary_key: Pernr
    select_fields:
      - Pernr
      - Begda
      - Endda
      - Massn
      - Massg
      - AedtmAed
    protection:
      Pernr: shadowed

  - entity: ContractData
    odata_entity: HRPA_EE_PA_SRV/PA0016Set
    description: "Contract elements (IT0016): contract type, probation, notice."
    mode: incremental
    watermark_field: AedtmAed
    page_size: 500
    primary_key: Pernr
    effective_dated: true
    date_field: Begda
    protection:
      Pernr: shadowed

  - entity: WorkSchedule
    odata_entity: HRPA_EE_PA_SRV/PA0007Set
    description: "Planned working time (IT0007): work schedule rule."
    mode: full
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: Pernr
    effective_dated: true
    date_field: Begda
    protection:
      Pernr: shadowed

  - entity: LeaveAbsence
    odata_entity: HRESS_TEAM_SRV/PA2001Set
    description: "Absences (IT2001): leave, sickness."
    mode: incremental
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: Pernr
    date_field: Begda
    protection:
      Pernr: shadowed

  - entity: CostCenter
    odata_entity: HRPA_EE_PA_SRV/PA0001Set
    description: "Cost-center assignment (subset of IT0001, keyed on Kostl)."
    mode: full
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: Kostl
    select_fields:
      - Pernr
      - Kostl
      - Orgeh
      - Begda
      - Endda
      - AedtmAed
    protection:
      Pernr: shadowed

  # ── Organizational Management (HRP1000, filtered by object type) ───────────
  - entity: OrgUnit
    odata_entity: HRORG_OBJECT_SRV/HRP1000Set
    odata_filter: "Otype eq 'O'"
    description: "Organizational units (OM objects, object type O)."
    mode: full
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: ObjId
    effective_dated: true
    date_field: Begda

  - entity: Position
    odata_entity: HRORG_OBJECT_SRV/HRP1000Set
    odata_filter: "Otype eq 'S'"
    description: "Positions (OM objects, object type S)."
    mode: full
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: ObjId
    effective_dated: true
    date_field: Begda

  - entity: JobCode
    odata_entity: HRORG_OBJECT_SRV/HRP1000Set
    odata_filter: "Otype eq 'C'"
    description: "Jobs (OM objects, object type C)."
    mode: full
    watermark_field: AedtmAed
    page_size: 1000
    primary_key: ObjId
    effective_dated: true
    date_field: Begda
