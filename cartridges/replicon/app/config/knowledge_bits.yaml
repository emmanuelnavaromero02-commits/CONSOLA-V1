knowledge_bits:
- id: kb_project_financial_summary
  name: Project Financial Summary
  description: 'Budget, actuals, billed amount, burn rate and gross margin per project.

    '
  source_entities:
  - Project
  - TimeEntry
  - ExpenseEntry
  - BillingItem
  - User
  - Client
  output_path: knowledge_bits/replicon/project_financial_summary
  pg_table: replicon_project_financial_summary
  sql: "WITH time_actuals AS (\n    SELECT\n        projectid,\n        SUM(durationhours)\
    \                                       AS total_hours,\n        SUM(CASE WHEN\
    \ isbillable THEN durationhours ELSE 0 END)  AS billable_hours\n    FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet')\n\
    \    GROUP BY projectid\n),\nexpense_actuals AS (\n    SELECT projectid, SUM(amountbasecurrency)\
    \ AS total_expenses\n    FROM read_parquet('s3://{bucket}/raw/replicon/ExpenseEntry/load_date=*/batch_id=*/*.parquet')\n\
    \    GROUP BY projectid\n),\nbilling AS (\n    SELECT projectid, SUM(billingitemamountbasecurrency)\
    \ AS billed_amount\n    FROM read_parquet('s3://{bucket}/raw/replicon/BillingItem/load_date=*/batch_id=*/*.parquet')\n\
    \    GROUP BY projectid\n),\nprojects AS (\n    SELECT DISTINCT ON (projectid)\n\
    \        projectid, name AS project_name, clientid, clientname,\n        projectstatuslabelname\
    \ AS status,\n        startdate, enddate,\n        budgeteddurationhours  AS budget_hours,\n\
    \        budgetedcostbasecurrency AS budget_cost\n    FROM read_parquet('s3://{bucket}/raw/replicon/Project/load_date=*/batch_id=*/*.parquet')\n\
    \    ORDER BY projectid, _extracted_at DESC\n)\nSELECT\n    p.projectid,\n   \
    \ p.project_name,\n    p.clientname,\n    p.status,\n    p.startdate,\n    p.enddate,\n\
    \    COALESCE(p.budget_hours, 0)                                  AS budget_hours,\n\
    \    COALESCE(p.budget_cost, 0)                                   AS budget_cost,\n\
    \    COALESCE(ta.total_hours, 0)                                  AS actual_hours,\n\
    \    COALESCE(ta.billable_hours, 0)                               AS billable_hours,\n\
    \    COALESCE(ea.total_expenses, 0)                               AS actual_expenses,\n\
    \    COALESCE(b.billed_amount, 0)                                 AS billed_amount,\n\
    \    ROUND(COALESCE(ta.total_hours, 0) /\n          NULLIF(p.budget_hours, 0)\
    \ * 100, 2)                    AS hours_burn_pct,\n    ROUND((COALESCE(b.billed_amount,\
    \ 0) - COALESCE(ea.total_expenses, 0)) /\n          NULLIF(COALESCE(b.billed_amount,\
    \ 0), 0) * 100, 2)     AS gross_margin_pct,\n    COALESCE(p.budget_cost, 0) -\
    \ COALESCE(ea.total_expenses, 0) AS budget_variance\nFROM projects p\nLEFT JOIN\
    \ time_actuals ta ON p.projectid = ta.projectid\nLEFT JOIN expense_actuals ea\
    \ ON p.projectid = ea.projectid\nLEFT JOIN billing b ON p.projectid = b.projectid\n"
- id: kb_resource_utilization
  name: Resource Utilization
  description: >
    Utilización mensual por usuario: horas trabajadas vs horas disponibles
    (días hábiles del mes × 8). Incluye supervisor, % utilización y % billable.
    Agrupable por supervisor_name para vista gerencial.
  source_entities:
  - TimeEntry
  - User
  output_path: knowledge_bits/replicon/resource_utilization
  pg_table: replicon_resource_utilization
  sql: |
    WITH calendar AS (
        -- Días hábiles (lun-vie) por mes — dayofweek: 0=Dom, 6=Sáb
        SELECT
            DATE_TRUNC('month', d::DATE)  AS month,
            COUNT(*)                       AS business_days
        FROM generate_series(
            DATE '2020-01-01',
            (CURRENT_DATE + INTERVAL '24 months')::DATE,
            INTERVAL '1 day'
        ) gs(d)
        WHERE DAYOFWEEK(d::DATE) NOT IN (0, 6)
        GROUP BY 1
    ),
    users AS (
        SELECT DISTINCT ON (userid)
            userid,
            firstname || ' ' || lastname   AS full_name,
            departmentname,
            employeetypename,
            currentsupervisorusername          AS supervisor_name,
            currenthourlybillingamount     AS billing_rate,
            currenthourlycostamount        AS cost_rate
        FROM read_parquet('s3://{bucket}/raw/replicon/User/load_date=*/batch_id=*/*.parquet')
        ORDER BY userid, _extracted_at DESC
    ),
    entries AS (
        SELECT
            userid,
            username,
            DATE_TRUNC('month', TRY_CAST(entrydate AS DATE))       AS month,
            SUM(durationhours)                                       AS total_hours,
            SUM(CASE WHEN isbillable THEN durationhours ELSE 0 END)  AS billable_hours
        FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet')
        WHERE entrydate IS NOT NULL
        GROUP BY userid, username, DATE_TRUNC('month', TRY_CAST(entrydate AS DATE))
    )
    SELECT
        e.month,
        e.userid,
        COALESCE(u.full_name, e.username)                            AS user_name,
        COALESCE(u.supervisor_name, 'Sin supervisor')                AS supervisor_name,
        u.departmentname                                             AS department,
        u.employeetypename                                           AS employee_type,
        COALESCE(c.business_days, 22)                                AS business_days,
        COALESCE(c.business_days, 22) * 8                           AS available_hours,
        ROUND(e.total_hours, 2)                                      AS total_hours,
        ROUND(e.billable_hours, 2)                                   AS billable_hours,
        ROUND(
            e.total_hours / NULLIF(COALESCE(c.business_days, 22) * 8.0, 0) * 100
        , 2)                                                         AS utilization_pct,
        ROUND(
            e.billable_hours / NULLIF(e.total_hours, 0) * 100
        , 2)                                                         AS billable_pct,
        ROUND(e.billable_hours * COALESCE(u.billing_rate, 0), 2)    AS billable_revenue
    FROM entries e
    LEFT JOIN users    u ON e.userid = u.userid
    LEFT JOIN calendar c ON e.month  = c.month
    ORDER BY e.month DESC, supervisor_name, user_name
- id: kb_time_entries_detail
  name: Time Entries Detail
  description: 'Enriched time entries for detailed billing and productivity analysis.

    '
  source_entities:
  - TimeEntry
  - User
  - Project
  output_path: knowledge_bits/replicon/time_entries_detail
  pg_table: replicon_time_entries_detail
  sql: "SELECT DISTINCT ON (timeentryid)\n    timeentryid,\n    TRY_CAST(entrydate\
    \ AS DATE)   AS entry_date,\n    username                       AS user_name,\n\
    \    clientname,\n    projectname,\n    taskname,\n    activityname,\n    durationhours\
    \                  AS hours,\n    isbillable,\n    billabletype,\n    timesheetstartdate,\n\
    \    timesheetenddate\nFROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet')\n\
    WHERE entrydate IS NOT NULL\nORDER BY timeentryid, _extracted_at DESC\n"
- id: kb_resource_allocation
  name: Resource Allocation
  description: >
    Asignacion mensual por usuario y proyecto vs horas disponibles (dias habiles x 8).
    Incluye supervisor, % de asignacion sobre capacidad total y % de avance real.
  source_entities:
  - ResourceAllocation
  - User
  - Project
  - TimeEntry
  output_path: knowledge_bits/replicon/resource_allocation
  pg_table: replicon_resource_allocation
  sql: |
    WITH calendar AS (
        SELECT
            DATE_TRUNC('month', d::DATE)  AS month,
            COUNT(*)                       AS business_days
        FROM generate_series(
            DATE '2020-01-01',
            (CURRENT_DATE + INTERVAL '24 months')::DATE,
            INTERVAL '1 day'
        ) gs(d)
        WHERE DAYOFWEEK(d::DATE) NOT IN (0, 6)
        GROUP BY 1
    ),
    users AS (
        SELECT DISTINCT ON (userid)
            userid,
            firstname || ' ' || lastname  AS full_name,
            departmentname,
            currentsupervisorusername         AS supervisor_name
        FROM read_parquet('s3://{bucket}/raw/replicon/User/load_date=*/batch_id=*/*.parquet')
        ORDER BY userid, _extracted_at DESC
    ),
    alloc AS (
        SELECT
            userid, username, projectid, projectname,
            DATE_TRUNC('month', TRY_CAST(date AS DATE))        AS month,
            SUM(durationhours)                                  AS allocated_hours,
            projectrolename                                     AS role,
            projectrolebillingratebasecurrency                  AS billing_rate
        FROM read_parquet('s3://{bucket}/raw/replicon/ResourceAllocation/load_date=*/batch_id=*/*.parquet')
        WHERE date IS NOT NULL
        GROUP BY userid, username, projectid, projectname,
                 DATE_TRUNC('month', TRY_CAST(date AS DATE)),
                 projectrolename, projectrolebillingratebasecurrency
    ),
    actuals AS (
        SELECT userid, projectid,
               DATE_TRUNC('month', TRY_CAST(entrydate AS DATE))  AS month,
               SUM(durationhours)                                  AS actual_hours
        FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet')
        WHERE entrydate IS NOT NULL
        GROUP BY userid, projectid, DATE_TRUNC('month', TRY_CAST(entrydate AS DATE))
    )
    SELECT
        a.month,
        a.userid,
        COALESCE(u.full_name, a.username)                           AS user_name,
        COALESCE(u.supervisor_name, 'Sin supervisor')               AS supervisor_name,
        u.departmentname                                            AS department,
        a.projectname,
        a.role,
        COALESCE(c.business_days, 22)                               AS business_days,
        COALESCE(c.business_days, 22) * 8                          AS available_hours,
        ROUND(a.allocated_hours, 2)                                 AS allocated_hours,
        ROUND(COALESCE(ac.actual_hours, 0), 2)                      AS actual_hours,
        ROUND(a.allocated_hours - COALESCE(ac.actual_hours, 0), 2)  AS remaining_hours,
        ROUND(a.allocated_hours / NULLIF(COALESCE(c.business_days, 22) * 8.0, 0) * 100, 2) AS allocation_pct,
        ROUND(COALESCE(ac.actual_hours, 0) / NULLIF(a.allocated_hours, 0) * 100, 2)        AS completion_pct
    FROM alloc a
    LEFT JOIN users    u  ON a.userid    = u.userid
    LEFT JOIN actuals  ac ON a.userid    = ac.userid
                         AND a.projectid = ac.projectid
                         AND a.month     = ac.month
    LEFT JOIN calendar c  ON a.month     = c.month
    ORDER BY a.month DESC, supervisor_name, user_name

- id: kb_wip_mensual
  name: WIP Mensual
  description: WIP mensual por proyecto y usuario. Conserva facturación original por moneda; sólo calcula USD con FX real y publica missing_fx/insufficient_data cuando faltan insumos.
  source_entities: [TimeEntry, BillingItem, Project, User]
  output_path: knowledge_bits/replicon/wip_mensual
  pg_table: replicon_wip_mensual
  sql: |
    WITH fx AS (
      SELECT DATE_TRUNC('month', TRY_CAST(year_month AS DATE)) AS month, CASE WHEN isfinite(TRY_CAST(avg_rate AS DOUBLE)) AND TRY_CAST(avg_rate AS DOUBLE) > 0 THEN TRY_CAST(avg_rate AS DOUBLE) END AS mxn_to_usd FROM read_parquet('s3://{bucket}/raw/fx_rates/mxn_usd/fx_rates.parquet')
    ), project_rate_monthly AS (
      SELECT projectid, DATE_TRUNC('month', TRY_CAST(entrydate AS DATE)) AS month, CASE WHEN isfinite(TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE)) AND TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) > 0 THEN TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) END AS rate_usd FROM read_parquet('s3://{bucket}/raw/replicon/BillingItem/load_date=*/batch_id=*/*.parquet') WHERE billabledurationhours > 0 GROUP BY 1, 2
    ), project_rate_default AS (
      SELECT projectid, CASE WHEN isfinite(TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE)) AND TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) > 0 THEN TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) END AS rate_usd FROM read_parquet('s3://{bucket}/raw/replicon/BillingItem/load_date=*/batch_id=*/*.parquet') WHERE billabledurationhours > 0 GROUP BY 1
    ), time_worked AS (
      SELECT DATE_TRUNC('month', TRY_CAST(entrydate AS DATE)) AS month, projectid, projectname, clientname, userid, username, SUM(durationhours) AS worked_hours, SUM(CASE WHEN isbillable THEN durationhours ELSE 0 END) AS billable_hours FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet') WHERE entrydate IS NOT NULL GROUP BY 1, 2, 3, 4, 5, 6
    ), billable AS (
      SELECT t.*, COALESCE(rm.rate_usd, rd.rate_usd) AS rate_usd, ROUND(t.billable_hours * COALESCE(rm.rate_usd, rd.rate_usd), 2) AS billable_amount_usd FROM time_worked t LEFT JOIN project_rate_monthly rm ON t.projectid = rm.projectid AND t.month = rm.month LEFT JOIN project_rate_default rd ON t.projectid = rd.projectid
    ), invoice_rows AS (
      SELECT DATE_TRUNC('month', TRY_CAST(invoice_date AS DATE)) AS month, project_id AS projectid, UPPER(TRIM(CAST(currency AS VARCHAR))) AS currency, CASE WHEN isfinite(TRY_CAST(billed_amount AS DOUBLE)) THEN TRY_CAST(billed_amount AS DOUBLE) END AS billed_amount, fx.mxn_to_usd FROM read_parquet('s3://{bucket}/raw/excel_billing/invoices/load_date=*/*.parquet') inv LEFT JOIN fx ON DATE_TRUNC('month', TRY_CAST(inv.invoice_date AS DATE)) = fx.month WHERE invoice_date IS NOT NULL AND invoice_status != 'Cancelada' AND project_id IS NOT NULL AND project_id != '0'
    ), billed_aggregated AS (
      SELECT month, projectid, SUM(CASE WHEN currency = 'USD' THEN billed_amount END) AS original_billed_usd, SUM(CASE WHEN currency = 'MXN' THEN billed_amount END) AS original_billed_mxn, SUM(CASE WHEN currency = 'USD' THEN billed_amount WHEN currency = 'MXN' AND mxn_to_usd IS NOT NULL THEN billed_amount * mxn_to_usd END) AS converted_candidate, SUM(CASE WHEN currency = 'MXN' AND mxn_to_usd IS NULL THEN 1 ELSE 0 END) AS missing_fx_count, SUM(CASE WHEN currency IS NULL OR currency NOT IN ('USD', 'MXN') OR billed_amount IS NULL THEN 1 ELSE 0 END) AS invalid_invoice_count FROM invoice_rows GROUP BY 1, 2
    ), billed AS (
      SELECT *, CASE WHEN missing_fx_count > 0 THEN 'missing_fx' WHEN invalid_invoice_count > 0 THEN 'insufficient_data' ELSE 'ready' END AS billing_data_status, CASE WHEN missing_fx_count = 0 AND invalid_invoice_count = 0 THEN converted_candidate END AS converted_billed_amount_usd FROM billed_aggregated
    ), project_billable_totals AS (
      SELECT month, projectid, SUM(billable_hours) AS total_billable FROM billable GROUP BY 1, 2
    ), billed_per_user AS (
      SELECT b.month, b.projectid, bl.userid, ROUND(b.original_billed_usd * bl.billable_hours / NULLIF(pt.total_billable, 0), 2) AS original_billed_usd, ROUND(b.original_billed_mxn * bl.billable_hours / NULLIF(pt.total_billable, 0), 2) AS original_billed_mxn, b.billing_data_status, ROUND(b.converted_billed_amount_usd * bl.billable_hours / NULLIF(pt.total_billable, 0), 2) AS converted_billed_amount_usd FROM billed b JOIN billable bl ON b.month = bl.month AND b.projectid = bl.projectid JOIN project_billable_totals pt ON b.month = pt.month AND b.projectid = pt.projectid
    ), combined AS (
      SELECT bl.*, bu.original_billed_usd, bu.original_billed_mxn, COALESCE(bu.billing_data_status, 'insufficient_data') AS billing_data_status, bu.converted_billed_amount_usd, CASE WHEN bu.billing_data_status = 'missing_fx' THEN 'missing_fx' WHEN bl.rate_usd IS NULL OR bu.billing_data_status IS NULL OR bu.billing_data_status != 'ready' THEN 'insufficient_data' ELSE 'ready' END AS financial_status FROM billable bl LEFT JOIN billed_per_user bu ON bl.month = bu.month AND bl.projectid = bu.projectid AND bl.userid = bu.userid WHERE bl.billable_hours > 0
    )
    SELECT month, projectid, projectname, clientname, userid, username, worked_hours, billable_hours, rate_usd AS billing_rate_usd, billable_amount_usd, original_billed_usd, original_billed_mxn, billing_data_status, financial_status, CASE WHEN billing_data_status = 'ready' THEN converted_billed_amount_usd END AS billed_amount_usd, CASE WHEN financial_status = 'ready' THEN ROUND(billable_amount_usd - converted_billed_amount_usd, 2) END AS wip_amount_usd, CASE WHEN financial_status = 'ready' THEN ROUND(converted_billed_amount_usd / NULLIF(billable_amount_usd, 0) * 100, 1) END AS billing_completion_pct FROM combined ORDER BY month DESC, wip_amount_usd DESC
- id: kb_wip_resumen
  name: WIP Resumen por Proyecto
  description: WIP mensual ejecutivo. Mantiene USD/MXN originales separados y no emite monto convertido, porcentaje ni semáforo sin FX y tarifa reales.
  source_entities: [TimeEntry, BillingItem]
  output_path: knowledge_bits/replicon/wip_resumen
  pg_table: replicon_wip_resumen
  sql: |
    WITH fx AS (
      SELECT DATE_TRUNC('month', TRY_CAST(year_month AS DATE)) AS month, CASE WHEN isfinite(TRY_CAST(avg_rate AS DOUBLE)) AND TRY_CAST(avg_rate AS DOUBLE) > 0 THEN TRY_CAST(avg_rate AS DOUBLE) END AS mxn_to_usd FROM read_parquet('s3://{bucket}/raw/fx_rates/mxn_usd/fx_rates.parquet')
    ), project_rate_monthly AS (
      SELECT projectid, DATE_TRUNC('month', TRY_CAST(entrydate AS DATE)) AS month, CASE WHEN isfinite(TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE)) AND TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) > 0 THEN TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) END AS rate_usd FROM read_parquet('s3://{bucket}/raw/replicon/BillingItem/load_date=*/batch_id=*/*.parquet') WHERE billabledurationhours > 0 GROUP BY 1, 2
    ), project_rate_default AS (
      SELECT projectid, CASE WHEN isfinite(TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE)) AND TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) > 0 THEN TRY_CAST(SUM(billableamountbasecurrency) / NULLIF(SUM(billabledurationhours), 0) AS DOUBLE) END AS rate_usd FROM read_parquet('s3://{bucket}/raw/replicon/BillingItem/load_date=*/batch_id=*/*.parquet') WHERE billabledurationhours > 0 GROUP BY 1
    ), time_worked AS (
      SELECT DATE_TRUNC('month', TRY_CAST(entrydate AS DATE)) AS month, projectid, projectname, clientname, SUM(durationhours) AS worked_hours, SUM(CASE WHEN isbillable THEN durationhours ELSE 0 END) AS billable_hours, COUNT(DISTINCT userid) AS contributors FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet') WHERE entrydate IS NOT NULL GROUP BY 1, 2, 3, 4
    ), billable AS (
      SELECT t.*, COALESCE(rm.rate_usd, rd.rate_usd) AS rate_usd, ROUND(t.billable_hours * COALESCE(rm.rate_usd, rd.rate_usd), 2) AS billable_amount_usd FROM time_worked t LEFT JOIN project_rate_monthly rm ON t.projectid = rm.projectid AND t.month = rm.month LEFT JOIN project_rate_default rd ON t.projectid = rd.projectid
    ), invoice_rows AS (
      SELECT DATE_TRUNC('month', TRY_CAST(invoice_date AS DATE)) AS month, project_id AS projectid, UPPER(TRIM(CAST(currency AS VARCHAR))) AS currency, CASE WHEN isfinite(TRY_CAST(billed_amount AS DOUBLE)) THEN TRY_CAST(billed_amount AS DOUBLE) END AS billed_amount, fx.mxn_to_usd FROM read_parquet('s3://{bucket}/raw/excel_billing/invoices/load_date=*/*.parquet') inv LEFT JOIN fx ON DATE_TRUNC('month', TRY_CAST(inv.invoice_date AS DATE)) = fx.month WHERE invoice_date IS NOT NULL AND invoice_status != 'Cancelada' AND project_id IS NOT NULL AND project_id != '0'
    ), billed_aggregated AS (
      SELECT month, projectid, SUM(CASE WHEN currency = 'USD' THEN billed_amount END) AS original_billed_usd, SUM(CASE WHEN currency = 'MXN' THEN billed_amount END) AS original_billed_mxn, SUM(CASE WHEN currency = 'USD' THEN billed_amount WHEN currency = 'MXN' AND mxn_to_usd IS NOT NULL THEN billed_amount * mxn_to_usd END) AS converted_candidate, SUM(CASE WHEN currency = 'MXN' AND mxn_to_usd IS NULL THEN 1 ELSE 0 END) AS missing_fx_count, SUM(CASE WHEN currency IS NULL OR currency NOT IN ('USD', 'MXN') OR billed_amount IS NULL THEN 1 ELSE 0 END) AS invalid_invoice_count FROM invoice_rows GROUP BY 1, 2
    ), billed AS (
      SELECT *, CASE WHEN missing_fx_count > 0 THEN 'missing_fx' WHEN invalid_invoice_count > 0 THEN 'insufficient_data' ELSE 'ready' END AS billing_data_status, CASE WHEN missing_fx_count = 0 AND invalid_invoice_count = 0 THEN converted_candidate END AS converted_billed_amount_usd FROM billed_aggregated
    ), combined AS (
      SELECT bl.*, b.original_billed_usd, b.original_billed_mxn, COALESCE(b.billing_data_status, 'insufficient_data') AS billing_data_status, b.converted_billed_amount_usd, CASE WHEN b.billing_data_status = 'missing_fx' THEN 'missing_fx' WHEN bl.rate_usd IS NULL OR b.billing_data_status IS NULL OR b.billing_data_status != 'ready' THEN 'insufficient_data' ELSE 'ready' END AS financial_status FROM billable bl LEFT JOIN billed b ON bl.month = b.month AND bl.projectid = b.projectid WHERE bl.billable_hours > 0
    )
    SELECT month, projectid, projectname, clientname, contributors, worked_hours, billable_hours, rate_usd AS billing_rate_usd, billable_amount_usd, original_billed_usd, original_billed_mxn, billing_data_status, financial_status, CASE WHEN billing_data_status = 'ready' THEN converted_billed_amount_usd END AS billed_amount_usd, CASE WHEN financial_status = 'ready' THEN ROUND(billable_amount_usd - converted_billed_amount_usd, 2) END AS wip_amount_usd, CASE WHEN financial_status = 'ready' THEN ROUND(converted_billed_amount_usd / NULLIF(billable_amount_usd, 0) * 100, 1) END AS billing_completion_pct, CASE WHEN financial_status != 'ready' THEN financial_status WHEN billable_amount_usd = 0 THEN 'sin_monto' WHEN converted_billed_amount_usd / NULLIF(billable_amount_usd, 0) >= 0.9 THEN 'facturado' WHEN converted_billed_amount_usd / NULLIF(billable_amount_usd, 0) >= 0.5 THEN 'parcial' ELSE 'pendiente' END AS wip_status FROM combined ORDER BY month DESC, wip_amount_usd DESC
- id: kb_project_status
  name: Project Status Overview
  description: 'All projects with team size, hours logged, and completion metrics.

    '
  source_entities:
  - Project
  - TimeEntry
  - ProjectTeamMember
  output_path: knowledge_bits/replicon/project_status
  pg_table: replicon_project_status
  sql: "WITH team AS (\n    SELECT projectid, COUNT(DISTINCT userid) AS team_size\n\
    \    FROM read_parquet('s3://{bucket}/raw/replicon/ProjectTeamMember/load_date=*/batch_id=*/*.parquet')\n\
    \    GROUP BY projectid\n),\nhours AS (\n    SELECT projectid,\n           SUM(durationhours)\
    \                                       AS logged_hours,\n           SUM(CASE\
    \ WHEN isbillable THEN durationhours ELSE 0 END) AS billable_hours,\n        \
    \   COUNT(DISTINCT userid)                                   AS active_users\n\
    \    FROM read_parquet('s3://{bucket}/raw/replicon/TimeEntry/load_date=*/batch_id=*/*.parquet')\n\
    \    GROUP BY projectid\n),\nprojects AS (\n    SELECT DISTINCT ON (projectid)\n\
    \        projectid, name AS project_name, clientname,\n        projectstatuslabelname\
    \ AS status,\n        startdate, enddate,\n        budgeteddurationhours AS budget_hours,\n\
    \        percentcomplete\n    FROM read_parquet('s3://{bucket}/raw/replicon/Project/load_date=*/batch_id=*/*.parquet')\n\
    \    ORDER BY projectid, _extracted_at DESC\n)\nSELECT\n    p.projectid,\n   \
    \ p.project_name,\n    p.clientname,\n    p.status,\n    p.startdate,\n    p.enddate,\n\
    \    COALESCE(t.team_size, 0)    AS team_size,\n    COALESCE(h.active_users, 0)\
    \ AS active_users,\n    COALESCE(p.budget_hours, 0) AS budget_hours,\n    COALESCE(h.logged_hours,\
    \ 0) AS logged_hours,\n    COALESCE(h.billable_hours, 0) AS billable_hours,\n\
    \    p.percentcomplete,\n    CASE\n        WHEN TRY_CAST(p.enddate AS DATE) <\
    \ CURRENT_DATE\n         AND p.status NOT ILIKE '%closed%' THEN 'overdue'\n  \
    \      WHEN TRY_CAST(p.enddate AS DATE) <= CURRENT_DATE + INTERVAL '30 days' THEN\
    \ 'closing_soon'\n        ELSE 'on_track'\n    END AS health\nFROM projects p\n\
    LEFT JOIN team t  ON p.projectid = t.projectid\nLEFT JOIN hours h ON p.projectid\
    \ = h.projectid\nORDER BY p.status, p.enddate\n"
