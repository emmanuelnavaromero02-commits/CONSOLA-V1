version: 1
cartridge: replicon
domain: Rentabilidad
external_sources:
  - id: delivery_calendar
    type: company_calendar
    ttl_seconds: 86400
    enabled: true
  - id: market_notes
    type: market_notes
    ttl_seconds: 86400
    enabled: true
metrics:
  - id: project_margin
    name: Margen bruto mensual por proyecto
    dataset: pnl_mensual
    entity:
      kind: project
      id_field: proyecto
      label_field: project_name
    time_field: mes
    value_field: margen_bruto_usd
    expected_behavior: higher_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 6
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 1
    hypotheses:
      - id: delivery_scope_or_rate_shift
        title: Cambio de alcance, tarifa o mix de entrega
        rationale: El margen puede desviarse por horas no facturables, tarifa efectiva o cambios de alcance.
    signal_rules:
      warning_pct: 0.18
      critical_pct: 0.35
    simulation_template:
      id: project_margin_recovery_v1
      iterations: 1000
      output_metric: net_value
      breach_threshold: "$signal.expected_value"
      breach_direction: below
      input_variables:
        baseline_value:
          type: fixed
          value: "$signal.expected_value"
        expected_delta:
          type: normal
          mean: "$signal.deviation_value"
          stddev: 2500
        cost_per_day:
          type: fixed
          value: "$decision.cost_of_delay.value_per_day"
        delay_days:
          type: triangular
          low: 0
          mode: 3
          high: 14
        probability_of_delay:
          type: fixed
          value: 0.5
        adoption_rate:
          type: triangular
          low: 0.4
          mode: 0.75
          high: 0.95
        recovery_rate:
          type: triangular
          low: 0.1
          mode: 0.35
          high: 0.65
        fixed_cost:
          type: fixed
          value: 900
      assumptions:
        contract_version: replicon_project_margin_v1
        writeback: supervised_internal_only
    action_templates:
      - id: review_project_margin
        label: Revisar margen con Revenue Manager
        action_kind: owner_review
        impact_multiplier: 0.25
        cost: 250
        risk: 120
        time_cost: 90
      - id: prepare_margin_recovery
        label: Preparar plan de recuperacion de margen
        action_kind: remediation_plan
        impact_multiplier: 0.45
        cost: 900
        risk: 350
        time_cost: 220
      - id: monitor_margin
        label: Mantener monitoreo de margen
        action_kind: monitor
        impact_multiplier: 0.00
        cost: 0
        risk: 50
        time_cost: 0
  - id: billable_hours
    name: Horas facturables mensuales por consultor
    dataset: consultor_mensual
    entity:
      kind: consultant
      id_field: consultor
      label_field: consultor
    time_field: mes
    value_field: horas_facturables
    expected_behavior: higher_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 8
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 120
    hypotheses:
      - id: capacity_or_assignment_shift
        title: Cambio de capacidad o asignacion
        rationale: Las horas facturables pueden variar por asignacion, ausencia, demanda o bloqueo del proyecto.
    signal_rules:
      warning_pct: 0.20
      critical_pct: 0.40
    simulation_template:
      id: billable_hours_recovery_v1
      iterations: 1000
      output_metric: net_value
      breach_threshold: "$signal.expected_value"
      breach_direction: below
      input_variables:
        baseline_value:
          type: fixed
          value: "$signal.expected_value"
        expected_delta:
          type: normal
          mean: "$signal.deviation_value"
          stddev: 8
        cost_per_day:
          type: fixed
          value: "$decision.cost_of_delay.value_per_day"
        delay_days:
          type: triangular
          low: 0
          mode: 2
          high: 10
        probability_of_delay:
          type: fixed
          value: 0.55
        adoption_rate:
          type: triangular
          low: 0.45
          mode: 0.75
          high: 0.95
        recovery_rate:
          type: triangular
          low: 0.2
          mode: 0.5
          high: 0.8
        fixed_cost:
          type: fixed
          value: 200
      assumptions:
        contract_version: replicon_billable_hours_v1
        writeback: supervised_internal_only
    action_templates:
      - id: rebalance_assignment
        label: Rebalancear asignacion del consultor
        action_kind: capacity_rebalance
        impact_multiplier: 0.30
        cost: 200
        risk: 140
        time_cost: 120
      - id: manager_followup
        label: Pedir seguimiento al manager
        action_kind: owner_review
        impact_multiplier: 0.18
        cost: 80
        risk: 60
        time_cost: 70
