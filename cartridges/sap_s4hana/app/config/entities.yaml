entities:
  - entity: BusinessPartner
    odata_entity: API_BUSINESS_PARTNER/A_BusinessPartner
    description: "Business Partner header (customers, vendors, employees)."
    mode: incremental
    watermark_field: LastChangeDate
    watermark_format: iso8601
    page_size: 500
    select_fields:
      - BusinessPartner
      - BusinessPartnerCategory
      - BusinessPartnerFullName
      - BusinessPartnerName
      - LegalForm
      - CreationDate
      - LastChangeDate
    protection:
      BusinessPartner: shadowed
      BusinessPartnerFullName: masked
      BusinessPartnerName: masked

  - entity: Customer
    odata_entity: API_BUSINESS_PARTNER/A_Customer
    description: "Customer master."
    mode: incremental
    watermark_field: LastChangeDate
    page_size: 500
    protection:
      Customer: shadowed
      TaxNumber1: masked
      TaxNumber2: masked
      TaxNumber3: masked
      TaxNumber4: masked
      TaxNumber5: masked
      BankAccountHolderName: encrypted
      BankAccount: encrypted
      IBAN: encrypted
      BankNumber: encrypted
      SwiftCode: encrypted

  - entity: Supplier
    odata_entity: API_BUSINESS_PARTNER/A_Supplier
    description: "Supplier (vendor) master."
    mode: incremental
    watermark_field: LastChangeDate
    page_size: 500
    protection:
      Supplier: shadowed
      TaxNumber1: masked
      TaxNumber2: masked
      TaxNumber3: masked
      TaxNumber4: masked
      TaxNumber5: masked
      BankAccountHolderName: encrypted
      BankAccount: encrypted
      IBAN: encrypted
      BankNumber: encrypted
      SwiftCode: encrypted

  - entity: BusinessPartnerAddress
    odata_entity: API_BUSINESS_PARTNER/A_BusinessPartnerAddress
    description: "Business partner addresses."
    mode: incremental
    watermark_field: LastChangeDate
    page_size: 1000
    protection:
      StreetName: masked
      HouseNumber: masked
      EmailAddress: masked
      PhoneNumber: masked
      MobilePhoneNumber: masked
      FaxNumber: masked
      PostalCode: plain
      CityName: plain
      Country: plain
      Region: plain

  - entity: Product
    odata_entity: API_PRODUCT_SRV/A_Product
    description: "Product (material) master."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 500

  - entity: ProductDescription
    odata_entity: API_PRODUCT_SRV/A_ProductDescription
    description: "Product descriptions per language."
    mode: full
    page_size: 1000

  - entity: CompanyCode
    odata_entity: API_COMPANYCODE_SRV/A_CompanyCode
    description: "Company code master."
    mode: full
    page_size: 1000

  - entity: CostCenter
    odata_entity: API_COSTCENTER_SRV/A_CostCenter
    description: "Cost centers."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: ProfitCenter
    odata_entity: API_PROFITCENTER_SRV/A_ProfitCenter
    description: "Profit centers."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: GLAccount
    odata_entity: API_GLACCOUNT_SRV/A_GLAccount
    description: "G/L account master (chart of accounts)."
    mode: full
    page_size: 1000

  - entity: SalesOrder
    odata_entity: API_SALES_ORDER_SRV/A_SalesOrder
    description: "Sales order header."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 500
    date_field: SalesOrderDate

  - entity: SalesOrderItem
    odata_entity: API_SALES_ORDER_SRV/A_SalesOrderItem
    description: "Sales order line items."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: SalesOrderScheduleLine
    odata_entity: API_SALES_ORDER_SRV/A_SalesOrderScheduleLine
    description: "Sales order schedule lines (delivery dates)."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: BillingDocument
    odata_entity: API_BILLING_DOCUMENT_SRV/A_BillingDocument
    description: "Billing document header (invoice header)."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 500
    date_field: BillingDocumentDate

  - entity: BillingDocumentItem
    odata_entity: API_BILLING_DOCUMENT_SRV/A_BillingDocumentItem
    description: "Billing document items."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: PurchaseOrder
    odata_entity: API_PURCHASEORDER_PROCESS_SRV/A_PurchaseOrder
    description: "Purchase order header."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 500
    date_field: PurchaseOrderDate

  - entity: PurchaseOrderItem
    odata_entity: API_PURCHASEORDER_PROCESS_SRV/A_PurchaseOrderItem
    description: "Purchase order line items."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: PurchaseRequisitionHeader
    odata_entity: API_PURCHASEREQ_PROCESS_SRV/A_PurchaseRequisitionHeader
    description: "Purchase requisition header."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 500

  - entity: PurchaseRequisitionItem
    odata_entity: API_PURCHASEREQ_PROCESS_SRV/A_PurchaseRequisitionItem
    description: "Purchase requisition line items."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000

  - entity: SupplierInvoice
    odata_entity: API_SUPPLIERINVOICE_PROCESS_SRV/A_SupplierInvoice
