    mode: incremental
    watermark_field: LastChangeDate
    page_size: 1000
    date_field: PostingDate
    protection:
      AmountInCompanyCodeCurrency: plain

  - entity: OPLAcctgDocItemCube
    odata_entity: API_OPLACCTGDOCITEMCUBE_SRV/YY1_OPLAcctgDocItemCube
    description: "Operational accounting document cube (matrix view of FI postings)."
    mode: incremental
    watermark_field: LastChangeDate
    page_size: 1000
    date_field: PostingDate

  - entity: JournalEntryItem
    odata_entity: API_JOURNALENTRYITEM_SRV/A_JournalEntryItem
    description: "Universal Journal entry items (ACDOCA)."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 2000
    date_field: PostingDate

  - entity: MatlStkInAcctMod
    odata_entity: API_MATERIAL_STOCK_SRV/A_MatlStkInAcctMod
    description: "Material stock by account modification."
    mode: full
    page_size: 1000

  - entity: MaterialDocumentHeader
    odata_entity: API_MATERIAL_DOCUMENT_SRV/A_MaterialDocumentHeader
    description: "Material document header (goods movements)."
    mode: incremental
    watermark_field: LastChangeDateTime
    page_size: 1000
