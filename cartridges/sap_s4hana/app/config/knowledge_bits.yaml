knowledge_bits:
  - id: kb_open_sales_orders
    name: "Open sales orders"
    description: "Sales orders not fully delivered, by company code and customer."
    sql: >
      WITH OrderHeader AS (
        SELECT DISTINCT ON (SalesOrder) SalesOrder, SalesOrderType, SoldToParty,
               SalesOrganization, SalesOrderDate, OverallSDProcessStatus
        FROM read_parquet('s3://{bucket}/raw/sap_s4hana/A_SalesOrder/load_date=*/batch_id=*/*.parquet')
        ORDER BY SalesOrder, _extracted_at DESC
      )
      SELECT SalesOrganization, SoldToParty, COUNT(*) AS open_orders
      FROM OrderHeader
      WHERE OverallSDProcessStatus IN ('A','B')
      GROUP BY SalesOrganization, SoldToParty
    pg_table: kb_open_sales_orders
    output_path: silver/sap_s4hana/kb_open_sales_orders

  - id: kb_overdue_invoices
    name: "Overdue billing documents"
    description: "Billing documents past their due date and still unpaid."
    sql: >
      SELECT BillingDocument, BillingDocumentDate, SoldToParty,
             TotalNetAmount, TransactionCurrency
      FROM read_parquet('s3://{bucket}/raw/sap_s4hana/A_BillingDocument/load_date=*/batch_id=*/*.parquet')
      WHERE CAST(BillingDocumentDate AS DATE) < CURRENT_DATE - INTERVAL 30 DAY
    pg_table: kb_overdue_invoices
    output_path: silver/sap_s4hana/kb_overdue_invoices

  - id: kb_purchase_spend_by_supplier
    name: "Purchase spend by supplier"
    description: "Spend (PO net amount) per supplier in the last 12 months."
    sql: >
      WITH PO AS (
        SELECT DISTINCT ON (PurchaseOrder) PurchaseOrder, Supplier, CompanyCode,
               PurchaseOrderDate
        FROM read_parquet('s3://{bucket}/raw/sap_s4hana/A_PurchaseOrder/load_date=*/batch_id=*/*.parquet')
        ORDER BY PurchaseOrder, _extracted_at DESC
      ),
      Items AS (
        SELECT PurchaseOrder, NetPriceAmount, OrderQuantity
        FROM read_parquet('s3://{bucket}/raw/sap_s4hana/A_PurchaseOrderItem/load_date=*/batch_id=*/*.parquet')
      )
      SELECT po.Supplier, po.CompanyCode,
             SUM(it.NetPriceAmount * it.OrderQuantity) AS spend_amount,
             COUNT(DISTINCT po.PurchaseOrder) AS po_count
      FROM PO po
      JOIN Items it ON it.PurchaseOrder = po.PurchaseOrder
      WHERE CAST(po.PurchaseOrderDate AS DATE) >= CURRENT_DATE - INTERVAL 365 DAY
      GROUP BY po.Supplier, po.CompanyCode
    pg_table: kb_purchase_spend_by_supplier
    output_path: silver/sap_s4hana/kb_purchase_spend_by_supplier

  - id: kb_gl_balance_by_account
    name: "G/L balance by account"
    description: "Posted balance by GL account from journal entry items (ACDOCA)."
    sql: >
      SELECT CompanyCode, GLAccount, FiscalYear,
             SUM(AmountInCompanyCodeCurrency) AS balance
      FROM read_parquet('s3://{bucket}/raw/sap_s4hana/A_JournalEntryItem/load_date=*/batch_id=*/*.parquet')
      GROUP BY CompanyCode, GLAccount, FiscalYear
    pg_table: kb_gl_balance_by_account
    output_path: silver/sap_s4hana/kb_gl_balance_by_account

  # ── Bloque C: KBs sobre los golds del Bloque B (gold/sap_s4hana/<name>/) ──────
  # Leen el parquet gold materializado vía read_parquet (DuckDB), no pggold.
  # Prefijo kb_sap_s4hana_ para id global unico. Columnas = salida real del gold.
  - id: kb_sap_s4hana_revenue_top_customers
    name: "Top clientes por revenue"
    description: "¿Cuáles son mis top 10 clientes por revenue YTD? Ranking de clientes por ingreso del año en curso, desde el gold revenue_by_customer."
    sql: >
      SELECT customer_code, SUM(revenue) AS revenue_ytd, SUM(invoice_count) AS invoices
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/revenue_by_customer/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      WHERE revenue_month >= date_trunc('year', CURRENT_DATE)
      GROUP BY customer_code
      ORDER BY revenue_ytd DESC
      LIMIT 10

  - id: kb_sap_s4hana_revenue_by_month
    name: "Revenue mensual"
    description: "¿Cómo evoluciona mi revenue mes a mes este año? Ingreso agregado por mes calendario, desde el gold revenue_by_customer."
    sql: >
      SELECT revenue_month, SUM(revenue) AS revenue, SUM(invoice_count) AS invoices
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/revenue_by_customer/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      WHERE revenue_month >= date_trunc('year', CURRENT_DATE)
      GROUP BY revenue_month
      ORDER BY revenue_month

  - id: kb_sap_s4hana_open_sales_backlog
    name: "Backlog de pedidos abiertos"
    description: "¿Cuál es el backlog de pedidos de venta abiertos? Total de pedidos y valor abierto con antigüedad promedio, desde el gold open_sales_orders."
    sql: >
      SELECT SUM(open_orders) AS total_open_orders,
             SUM(open_value)  AS total_open_value,
             ROUND(AVG(oldest_age_days), 1) AS avg_oldest_age_days,
             COUNT(DISTINCT customer_code)  AS customers
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/open_sales_orders/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)

  - id: kb_sap_s4hana_overdue_invoices
    name: "Facturas vencidas"
    description: "¿Qué facturas tengo vencidas? (cartera de cobros). Facturas con días de mora ordenadas por antigüedad, desde el gold overdue_billing. Parcial, pendiente ampliación bronze: el estado de pago (PaymentStatus / partidas FI) no se extrae; el vencimiento se estima a 30 días."
    sql: >
      SELECT billing_document, customer_code, amount, currency,
             estimated_due_date, days_overdue
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/overdue_billing/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY days_overdue DESC
      LIMIT 50

  - id: kb_sap_s4hana_top_suppliers_spend
    name: "Top proveedores por gasto"
    description: "¿En qué proveedores estoy gastando más este año? Ranking de proveedores por gasto YTD, desde el gold purchase_spend_by_supplier."
    sql: >
      SELECT supplier_code, SUM(total_spend) AS spend_ytd, SUM(po_count) AS purchase_orders
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/purchase_spend_by_supplier/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      WHERE spend_month >= date_trunc('year', CURRENT_DATE)
      GROUP BY supplier_code
      ORDER BY spend_ytd DESC
      LIMIT 10

  - id: kb_sap_s4hana_gl_balance_summary
    name: "Balance de cuentas contables"
    description: "¿Cuál es el balance de mis cuentas contables principales? Top cuentas por saldo absoluto, desde el gold gl_balance_by_account."
    sql: >
      SELECT company_code, gl_account, fiscal_year, balance, line_items
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/gl_balance_by_account/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY ABS(balance) DESC
      LIMIT 20

  - id: kb_sap_s4hana_inventory_movements_recent
    name: "Movimientos de inventario recientes"
    description: "¿Cuáles son los movimientos de inventario recientes? Documentos de material por mes, desde el gold inventory_movement_summary. Parcial, pendiente ampliación bronze: el detalle por material/cantidad/valor (A_MaterialDocumentItem) no se extrae; hoy es conteo a nivel de documento."
    sql: >
      SELECT posting_month, movement_documents
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/inventory_movement_summary/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY posting_month DESC
      LIMIT 12

  - id: kb_sap_s4hana_business_partner_anomalies
    name: "Anomalías de business partners"
    description: "¿Qué problemas de calidad tengo en mis partners de negocio? Conteo por tipo de anomalía y severidad, desde el gold business_partner_anomalies."
    sql: >
      SELECT anomaly_type, severity, COUNT(*) AS total_cases
      FROM read_parquet('s3://{bucket}/gold/sap_s4hana/business_partner_anomalies/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      GROUP BY anomaly_type, severity
      ORDER BY total_cases DESC
