knowledge_bits:
  - id: kb_employee_360
    name: "Employee 360"
    description: "Vista unificada: User + EmpEmployment + EmpJob + EmpCompensation"
    sql: >
      WITH Users AS (
          SELECT DISTINCT ON (userId) userId, firstName, lastName, email, status
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/User/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      ),
      Employment AS (
          SELECT DISTINCT ON (userId) userId, startDate, endDate
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpEmployment/load_date=*/batch_id=*/*.parquet')
          WHERE CAST(startDate AS DATE) <= CURRENT_DATE AND CAST(endDate AS DATE) >= CURRENT_DATE
          ORDER BY userId, _extracted_at DESC
      ),
      Job AS (
          SELECT DISTINCT ON (userId) userId, jobTitle, jobCode, department, division, location, costCenter, payGrade
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpJob/load_date=*/batch_id=*/*.parquet')
          WHERE CAST(startDate AS DATE) <= CURRENT_DATE AND CAST(endDate AS DATE) >= CURRENT_DATE
          ORDER BY userId, _extracted_at DESC
      ),
      Compensation AS (
          SELECT DISTINCT ON (userId) userId, payGroup, startDate, endDate
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpCompensation/load_date=*/batch_id=*/*.parquet')
          WHERE CAST(startDate AS DATE) <= CURRENT_DATE AND CAST(endDate AS DATE) >= CURRENT_DATE
          ORDER BY userId, _extracted_at DESC
      )
      SELECT
          u.userId, u.firstName, u.lastName, u.email, u.status,
          j.jobTitle, j.jobCode, j.department, j.division, j.location, j.costCenter, j.payGrade,
          c.payGroup, e.startDate, e.endDate
      FROM Users u
      JOIN Employment e ON u.userId = e.userId
      JOIN Job j ON u.userId = j.userId
      JOIN Compensation c ON u.userId = c.userId

  - id: kb_headcount_by_department
    name: "Headcount by department"
    description: "Headcount activo (EmpEmployment activo) por Department, Division, Location"
    sql: >
      WITH ActiveEmployment AS (
          SELECT DISTINCT ON (userId) userId
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpEmployment/load_date=*/batch_id=*/*.parquet')
          WHERE CAST(startDate AS DATE) <= CURRENT_DATE AND CAST(endDate AS DATE) >= CURRENT_DATE
          ORDER BY userId, _extracted_at DESC
      ),
      Job AS (
          SELECT DISTINCT ON (userId) userId, department, division, location
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpJob/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      ),
      Departments AS (
          SELECT DISTINCT ON (externalCode) externalCode, name_defaultValue
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/FODepartment/load_date=*/batch_id=*/*.parquet')
          ORDER BY externalCode, _extracted_at DESC
      ),
      Locations AS (
          SELECT DISTINCT ON (externalCode) externalCode, country
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/FOLocation/load_date=*/batch_id=*/*.parquet')
          ORDER BY externalCode, _extracted_at DESC
      )
      SELECT
          j.department,
          j.division,
          j.location,
          l.country,
          COUNT(e.userId) AS headcount,
          COUNT(e.userId) * 100.0 / SUM(COUNT(e.userId)) OVER () AS pct_total
      FROM ActiveEmployment e
      JOIN Job j ON e.userId = j.userId
      LEFT JOIN Locations l ON j.location = l.externalCode
      GROUP BY j.department, j.division, j.location, l.country

  - id: kb_talent_pipeline
    name: "Talent pipeline"
    description: "Candidatos activos (Candidate) por JobRequisition"
    sql: >
      WITH Reqs AS (
          SELECT DISTINCT ON (jobReqId) jobReqId, jobTitle, department, location
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/JobRequisition/load_date=*/batch_id=*/*.parquet')
          ORDER BY jobReqId, _extracted_at DESC
      ),
      Candidates AS (
          SELECT DISTINCT ON (candidateId) candidateId, firstName, lastName, lastModifiedDateTime
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/Candidate/load_date=*/batch_id=*/*.parquet')
          ORDER BY candidateId, _extracted_at DESC
      )
      SELECT
          r.jobReqId, r.jobTitle, r.department, r.location,
          c.candidateId, c.firstName, c.lastName,
          DATE_DIFF('day', CAST(c.lastModifiedDateTime AS DATE), CURRENT_DATE) AS days_in_pipeline,
          'Active' AS status
      FROM Reqs r
      CROSS JOIN Candidates c

  - id: kb_learning_completion
    name: "Learning completion"
    description: "Por userId y learningItemId: % completado"
    sql: >
      WITH Learning AS (
          SELECT DISTINCT ON (userId, learningItemId) userId, learningItemId, title, status, completionDate, dueDate
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/LearningItem/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, learningItemId, _extracted_at DESC
      ),
      Users AS (
          SELECT DISTINCT ON (userId) userId, firstName, lastName
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/User/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      )
      SELECT
          l.userId, u.firstName, u.lastName,
          l.learningItemId, l.title, l.status, l.completionDate, l.dueDate,
          CASE WHEN l.dueDate IS NOT NULL AND CAST(l.dueDate AS DATE) < CURRENT_DATE AND l.status != 'COMPLETED' THEN TRUE ELSE FALSE END AS overdue
      FROM Learning l
      LEFT JOIN Users u ON l.userId = u.userId

  - id: kb_performance_distribution
    name: "Performance distribution"
    description: "Distribución de overallRating por Department (vía EmpJob)"
    sql: >
      WITH Reviews AS (
          SELECT DISTINCT ON (userId) userId, overallRating
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/PerformanceReview/load_date=*/batch_id=*/*.parquet')
          WHERE EXTRACT(YEAR FROM CAST(formStartDate AS DATE)) = EXTRACT(YEAR FROM CURRENT_DATE)
          ORDER BY userId, _extracted_at DESC
      ),
      Job AS (
          SELECT DISTINCT ON (userId) userId, department
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpJob/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      )
      SELECT
          j.department,
          r.overallRating AS rating_value,
          COUNT(r.userId) AS employee_count,
          COUNT(r.userId) * 100.0 / SUM(COUNT(r.userId)) OVER (PARTITION BY j.department) AS pct_in_dept
      FROM Reviews r
      JOIN Job j ON r.userId = j.userId
      GROUP BY j.department, r.overallRating

  - id: kb_compensation_analysis
    name: "Compensation analysis"
    description: "Salario medio (si EmpCompensation tiene payGrade) por payGrade y department. Proxy de análisis de compensación."
    sql: >
      WITH Compensation AS (
          SELECT DISTINCT ON (userId) userId, payGroup
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpCompensation/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      ),
      Job AS (
          SELECT DISTINCT ON (userId) userId, department, jobCode, payGrade
          FROM read_parquet('s3://{bucket}/raw/sap_successfactors/EmpJob/load_date=*/batch_id=*/*.parquet')
          ORDER BY userId, _extracted_at DESC
      )
      SELECT
          j.payGrade,
          j.department,
          j.jobCode,
          COUNT(c.userId) AS employee_count
      FROM Compensation c
      JOIN Job j ON c.userId = j.userId
      GROUP BY j.payGrade, j.department, j.jobCode

  # ── Bloque C: KBs sobre los golds del Bloque B (gold/sap_successfactors/<name>/) ─
  # Leen el parquet gold materializado vía read_parquet (DuckDB), no pggold. Los
  # datasets gold de SF llevan el prefijo sap_successfactors_ en el nombre, por eso
  # la ruta repite el prefijo. Prefijo kb_sap_successfactors_ para id global unico.
  - id: kb_sap_successfactors_headcount_by_department
    name: "Headcount por departamento"
    description: "¿Cuántos empleados activos tengo por departamento? Headcount activo por departamento, desde el gold sap_successfactors_headcount_by_department."
    sql: >
      SELECT department_id, department_name, headcount
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_headcount_by_department/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY headcount DESC

  - id: kb_sap_successfactors_headcount_by_location
    name: "Headcount por ubicación"
    description: "¿Cómo se distribuye mi plantilla por ubicación geográfica? Headcount activo por location, desde el gold sap_successfactors_headcount_by_location."
    sql: >
      SELECT location_id, location_name, headcount
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_headcount_by_location/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY headcount DESC

  - id: kb_sap_successfactors_headcount_by_company
    name: "Headcount por compañía"
    description: "¿Cuál es mi distribución de plantilla por compañía / legal entity? Headcount activo por company, desde el gold sap_successfactors_headcount_by_company."
    sql: >
      SELECT company_id, company_name, headcount
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_headcount_by_company/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY headcount DESC

  - id: kb_sap_successfactors_recruitment_funnel
    name: "Embudo de reclutamiento"
    description: "¿Cómo está mi embudo de reclutamiento por departamento? Requisiciones totales y abiertas, desde el gold sap_successfactors_recruitment_funnel. Parcial, pendiente bronze: las etapas por candidato requieren JobApplication (no extraída); hoy es a nivel de requisición."
    sql: >
      SELECT department, requisitions, open_requisitions, candidate_pool
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_recruitment_funnel/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY requisitions DESC

  - id: kb_sap_successfactors_turnover_recent
    name: "Rotación reciente"
    description: "¿Cuál es mi rotación reciente y por qué motivos? Bajas por mes y motivo de salida, desde el gold sap_successfactors_turnover_by_period basado en EmpEmploymentTermination."
    sql: >
      SELECT termination_month, event_reason, terminations
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_turnover_by_period/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      ORDER BY termination_month DESC, terminations DESC

  - id: kb_sap_successfactors_manager_hierarchy_depth
    name: "Niveles de organización"
    description: "¿Cómo se estructura mi organización en niveles de management? Empleados y reportes directos promedio por nivel jerárquico, desde el gold sap_successfactors_manager_hierarchy (managerId real en SF)."
    sql: >
      SELECT depth,
             COUNT(*)                       AS employees,
             ROUND(AVG(direct_reports), 1)  AS avg_direct_reports,
             MAX(direct_reports)            AS max_direct_reports
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_manager_hierarchy/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      GROUP BY depth
      ORDER BY depth

  - id: kb_sap_successfactors_employees_anomalies
    name: "Anomalías de empleados"
    description: "¿Qué anomalías tengo en datos de empleados? Conteo por tipo y severidad, desde el gold sap_successfactors_employees_anomalies. Parcial: la cobertura activo-con-baja requiere validar el cruce con EmpEmploymentTermination."
    sql: >
      SELECT anomaly_type, severity, COUNT(*) AS total_cases
      FROM read_parquet('s3://{bucket}/gold/sap_successfactors/sap_successfactors_employees_anomalies/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      GROUP BY anomaly_type, severity
      ORDER BY total_cases DESC

  - id: kb_sap_successfactors_workforce_distribution
    name: "Composición por tipo de empleo"
    description: "¿Cuál es la composición de mi plantilla por tipo de empleo (employee class)? Empleados activos por clase de empleo. Se lee del silver sap_successfactors_empemployment_latest porque no hay gold dedicado (el employee_class no está en los golds de headcount)."
    sql: >
      SELECT employee_class, COUNT(*) AS headcount
      FROM read_parquet('s3://{bucket}/silver/sap_successfactors/sap_successfactors_empemployment_latest/**/*.parquet',
                        hive_partitioning = true, union_by_name = true)
      WHERE CAST(start_date AS DATE) <= CURRENT_DATE
        AND (end_date IS NULL OR CAST(end_date AS DATE) >= CURRENT_DATE)
      GROUP BY employee_class
      ORDER BY headcount DESC
