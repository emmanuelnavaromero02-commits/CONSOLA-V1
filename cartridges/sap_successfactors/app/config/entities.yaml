# SAP SuccessFactors Employee Central — OData v2 entities
# Names match the OData EntitySet name on the customer's API URL
# (e.g. https://api{N}.sapsf.{eu|com}/odata/v2/<EntitySet>).
entities:
  # ── Core people master ────────────────────────────────────────────────────
  - entity: User
    description: "Platform user (login, email, manager, dept). Master record across modules."
    mode: incremental
    watermark_field: lastModifiedDateTime
    watermark_format: iso8601
    page_size: 200
    select_fields:
      - userId
      - username
      - email
      - status
      - firstName
      - lastName
      - department
      - division
      - location
      - manager
      - hireDate
      - lastModifiedDateTime
    protection:
      userId: shadowed
      firstName: masked
      lastName: masked
      email: masked

  - entity: PerPerson
    description: "Personal information (Employee Central core person record)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    watermark_format: iso8601
    page_size: 200
    select_fields:
      - personIdExternal
      - personId
      - dateOfBirth
      - countryOfBirth
      - createdDateTime
      - lastModifiedDateTime
    protection:
      dateOfBirth: encrypted
      personIdExternal: shadowed

  - entity: PerPersonal
    description: "Personal-info effective-dated record (legal name, gender, marital status)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    effective_dated: true
    date_field: startDate
    effective_from_date: "1900-01-01"
    effective_to_date: "9999-12-31"
    select_fields:
      - personIdExternal
      - startDate
      - endDate
      - firstName
      - middleName
      - lastName
      - gender
      - maritalStatus
      - nationality
      - lastModifiedDateTime
    protection:
      firstName: masked
      lastName: masked
      gender: plain
      maritalStatus: plain

  - entity: PerEmail
    description: "Person email addresses (business / personal)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    select_fields:
      - personIdExternal
      - emailType
      - emailAddress
      - isPrimary
      - lastModifiedDateTime
    protection:
      emailAddress: masked

  - entity: PerPhone
    description: "Person phone numbers."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    select_fields:
      - personIdExternal
      - phoneType
      - phoneNumber
      - isPrimary
      - lastModifiedDateTime
    protection:
      phoneNumber: masked

  - entity: PerAddressDEFLT
    description: "Person home / mailing addresses (default country variant)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    select_fields:
      - personIdExternal
      - addressType
      - startDate
      - endDate
      - address1
      - city
      - state
      - zipCode
      - lastModifiedDateTime
    protection:
      address1: masked
      zipCode: masked

  - entity: PerNationalId
    description: "National identifiers (SSN, RFC, CURP, etc)."
    mode: full
    page_size: 200
    select_fields:
      - personIdExternal
      - country
      - cardType
      - nationalId
      - isPrimary
      - lastModifiedDateTime
    protection:
      nationalId: encrypted

  # ── Employment ────────────────────────────────────────────────────────────
  - entity: EmpEmployment
    description: "Employment record per person (start date, employee class, end date)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    select_fields:
      - personIdExternal
      - userId
      - startDate
      - endDate
      - assignmentClass
      - originalStartDate
      - lastModifiedDateTime

  - entity: EmpJob
    description: "Job assignment history (effective-dated). Org/job/position changes."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    effective_dated: true
    date_field: startDate
    effective_from_date: "1900-01-01"
    effective_to_date: "9999-12-31"
    select_fields:
      - userId
      - startDate
      - endDate
      - jobCode
      - position
      - department
      - division
      - location
      - businessUnit
      - company
      - costCenter
      - managerId
      - eventReason
      - lastModifiedDateTime

  - entity: EmpCompensation
    description: "Compensation header (pay group, frequency, currency)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    effective_dated: true
    date_field: startDate
    select_fields:
      - userId
      - startDate
      - endDate
      - payGroup
      - lastModifiedDateTime

  - entity: EmpPayCompRecurring
    description: "Recurring pay components (base salary, allowances)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    effective_dated: true
    date_field: startDate
    select_fields:
      - userId
      - payComponent
      - paycompvalue
      - frequency
      - currencyCode
      - startDate
      - endDate
      - lastModifiedDateTime
    protection:
      paycompValue: encrypted
      paycompvalue: encrypted

  - entity: EmpPayCompNonRecurring
    description: "Non-recurring pay components (bonus, one-time payments)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    date_field: payDate
    select_fields:
      - userId
      - payComponentCode
      - value
      - currencyCode
      - payDate
      - lastModifiedDateTime
    protection:
      paycompValue: encrypted
      value: encrypted

  - entity: PaymentInformationDetailV3
    description: "Payment information detail V3 (bank/payment-method details)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    select_fields:
      - externalCode
      - PaymentInformationV3_worker
      - PaymentInformationV3_effectiveStartDate
      - mdfSystemEffectiveStartDate
      - mdfSystemEffectiveEndDate
      - paymentMethod
      - bankCountry
      - bank
      - businessIdentifierCode
      - routingNumber
      - accountNumber
      - accountOwner
      - iban
      - currency
      - amount
      - percent
      - payType
      - customPayType
      - paySequence
      - purpose
      - lastModifiedDateTime
    protection:
      accountNumber: encrypted
      accountOwner: masked
      iban: encrypted
      routingNumber: encrypted
      businessIdentifierCode: encrypted

  - entity: EmpEmploymentTermination
    description: "Termination record (last day, reason)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    date_field: endDate
    select_fields:
      - userId
      - endDate
      - lastModifiedDateTime

  # ── Org structure (Foundation Objects) ────────────────────────────────────
  - entity: FOCompany
    description: "Foundation Object: legal companies."
    mode: full
    page_size: 500
    select_fields:
      - externalCode
      - name_defaultValue
      - country
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FODepartment
    description: "Foundation Object: departments."
    mode: full
    page_size: 1000
    select_fields:
      - externalCode
      - name_defaultValue
      - costCenter
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FODivision
    description: "Foundation Object: divisions."
    mode: full
    page_size: 500
    select_fields:
      - externalCode
      - name_defaultValue
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FOLocation
    description: "Foundation Object: locations / sites."
    mode: full
    page_size: 1000
    select_fields:
      - externalCode
      - name
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FOBusinessUnit
    description: "Foundation Object: business units."
    mode: full
    page_size: 500
    select_fields:
      - externalCode
      - name_defaultValue
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FOCostCenter
    description: "Foundation Object: cost centers."
    mode: full
    page_size: 1000
    primary_key: externalCode
    select_fields:
      - externalCode
      - name_defaultValue
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FOEventReason
    description: "Foundation Object: event reasons for movements, promotions and terminations."
    mode: full
    page_size: 1000
    primary_key: externalCode
    select_fields:
      - externalCode
      - name_defaultValue
      - event
      - eventReasonCategory
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: FOJobCode
    description: "Foundation Object: job codes / job classifications."
    mode: full
    page_size: 1000
    primary_key: externalCode
    select_fields:
      - externalCode
      - name_defaultValue
      - status
      - startDate
      - endDate
      - lastModifiedDateTime

  - entity: Position
    description: "Position Management: positions (incumbent, parent, FTE)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    select_fields:
      - code
      - externalName_defaultValue
      - department
      - location
      - costCenter
      - lastModifiedDateTime

  # ── Time off ──────────────────────────────────────────────────────────────
  - entity: EmployeeTime
    description: "Time off requests (leave, vacation, sick)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    date_field: startDate
    select_fields:
      - userId
      - startDate
      - endDate
      - timeType
      - approvalStatus
      - lastModifiedDateTime

  - entity: TimeAccount
    description: "Time off accruals / balances per employee."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    select_fields:
      - userId
      - accountType
      - lastModifiedDateTime

  - entity: WorkSchedule
    description: "Work schedule assignments."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    effective_dated: true
    date_field: startDate

  # ── Recruiting ──────────────────────────────────────────────────────────────
  - entity: JobRequisition
    description: "Recruiting: job requisitions (open positions in the pipeline)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: jobReqId
    select_fields:
      - jobReqId
      - jobTitle
      - status
      - department
      - location
      - lastModifiedDateTime

  - entity: Candidate
    description: "Recruiting: candidates in the pipeline."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: candidateId
    select_fields:
      - candidateId
      - firstName
      - lastName
      - status
      - lastModifiedDateTime
    protection:
      candidateId: shadowed
      firstName: masked
      lastName: masked

  - entity: JobApplication
    description: "Recruiting: applications linking candidates to requisitions and stages."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: applicationId
    select_fields:
      - applicationId
      - jobReqId
      - candidateId
      - applicationStatus
      - source
      - lastModifiedDateTime
    protection:
      candidateId: shadowed

  # ── Performance & Goals ───────────────────────────────────────────────────
  # Business names differ from the OData entityset, so odata_entity carries the
  # technical name (extraction_service resolves config.get("odata_entity", entity)).
  - entity: GoalPlan
    odata_entity: Goal
    description: "Performance & Goals: goal entries (OData entityset Goal)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: id
    select_fields:
      - id
      - userId
      - name
      - state
      - percentComplete
      - startDate
      - dueDate
      - lastModifiedDateTime
    protection:
      userId: shadowed

  - entity: PerformanceReview
    odata_entity: FormHeader
    description: "Performance: review form headers (OData entityset FormHeader). overallRating / comments stay plain (operational, not direct PII)."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: formDataId
    select_fields:
      - formDataId
      - formSubjectId
      - formTemplateId
      - status
      - overallRating
      - potentialRating
      - formStartDate
      - formEndDate
      - lastModifiedDateTime
    protection:
      formSubjectId: shadowed

  # ── Competencies and skills ───────────────────────────────────────────────
  - entity: CompetencyEntity
    description: "Tenant competency catalog used to map role requirements and employee skills."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - name
      - description
      - status
      - lastModifiedDateTime

  - entity: UserSkill
    description: "Employee skill/proficiency observations when exposed by the tenant."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - userId
      - skill
      - skillName
      - proficiency
      - rating
      - lastModifiedDateTime
    protection:
      userId: shadowed

  - entity: SkillProfile
    description: "Alternative tenant skill profile entity for employee skill/proficiency observations."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - userId
      - skill
      - skillName
      - proficiency
      - rating
      - lastModifiedDateTime
    protection:
      userId: shadowed

  # ── Career aspiration and succession ──────────────────────────────────────
  - entity: CareerWorksheet
    description: "Career worksheet target roles and readiness preferences."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - userId
      - role
      - jobRole
      - readiness
      - lastModifiedDateTime
    protection:
      userId: shadowed

  - entity: CareerInterest
    description: "Declared career interests and mobility preferences."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - userId
      - jobRole
      - interest
      - mobilityPreference
      - lastModifiedDateTime
    protection:
      userId: shadowed

  - entity: SuccessionNomination
    description: "Succession nominations and readiness for target positions."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: externalCode
    select_fields:
      - externalCode
      - userId
      - position
      - readiness
      - nominationStatus
      - lastModifiedDateTime
    protection:
      userId: shadowed

  # ── Learning ──────────────────────────────────────────────────────────────
  - entity: LearningItem
    odata_entity: Item
    description: "Learning (LMS): learning items. odata_entity 'Item' is the standard default and is NOT externally verified — see PR notes."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    primary_key: learningItemId
    select_fields:
      - learningItemId
      - itemId
      - title
      - status
      - creditHours
      - duration
      - expirationDate
      - lastModifiedDateTime

  - entity: LearningAssignment
    description: "Learning assignments per employee and item."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: assignmentId
    select_fields:
      - assignmentId
      - userId
      - itemId
      - status
      - dueDate
      - completionDate
      - lastModifiedDateTime
    protection:
      userId: shadowed

  - entity: LearningHistory
    description: "Completed learning history and certification events."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 500
    primary_key: historyId
    select_fields:
      - historyId
      - userId
      - itemId
      - completionDate
      - creditHours
      - status
      - lastModifiedDateTime
    protection:
      userId: shadowed

  # ── Job relationships ─────────────────────────────────────────────────────
  - entity: EmpJob_History
    odata_entity: EmpJobRelationships
    description: "Job relationships (matrix / additional managers); OData entityset EmpJobRelationships."
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    select_fields:
      - userId
      - startDate
      - endDate
      - relationshipType
      - relUserId
      - lastModifiedDateTime
