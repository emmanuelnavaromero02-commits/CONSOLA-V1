entities:
  - entity: User
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "User data"
    odata_entity: User
    select_fields: [userId, username, email, status, firstName, lastName, defaultLocale, timezone, lastModifiedDateTime]

  - entity: EmpEmployment
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Employment data"
    odata_entity: EmpEmployment
    select_fields: [userId, assignmentClass, startDate, endDate, isContingentWorker, lastModifiedDateTime]

  - entity: EmpJob
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Job data"
    odata_entity: EmpJob
    select_fields: [userId, startDate, endDate, jobTitle, jobCode, department, division, location, costCenter, payGrade, lastModifiedDateTime]

  - entity: EmpCompensation
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Compensation data"
    odata_entity: EmpCompensation
    select_fields: [userId, startDate, endDate, payGroup, payScaleType, lastModifiedDateTime]

  - entity: Position
    mode: full
    page_size: 200
    description: "Position data"
    odata_entity: Position
    select_fields: [positionCode, externalName_defaultValue, positionTitle, parentPosition, department, division, location, costCenter, payGrade, effectiveStartDate, effectiveEndDate]

  - entity: Department
    mode: full
    page_size: 200
    description: "Department data"
    odata_entity: Department
    select_fields: [externalCode, name_defaultValue, headOfUnit, costCenter, parentDepartment]

  - entity: Division
    mode: full
    page_size: 200
    description: "Division data"
    odata_entity: Division
    select_fields: [externalCode, name_defaultValue, headOfUnit]

  - entity: Location
    mode: full
    page_size: 200
    description: "Location data"
    odata_entity: Location
    select_fields: [externalCode, name_defaultValue, addressLine1, city, country, timeZone]

  - entity: CostCenter
    mode: full
    page_size: 200
    description: "Cost center data"
    odata_entity: CostCenter
    select_fields: [externalCode, name_defaultValue, description, organizationUnit, controllingArea]

  - entity: EmpJob_History
    mode: incremental
    watermark_field: lastModifiedDateTime
    date_field: startDate
    page_size: 200
    description: "Job history data"
    odata_entity: EmpJobRelationships
    select_fields: [userId, relType, relUserId, startDate, endDate, lastModifiedDateTime]

  - entity: JobRequisition
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Job requisition data"
    odata_entity: JobRequisition
    select_fields: [jobReqId, jobTitle, department, location, targetOpenings, status, createdDateTime, lastModifiedDateTime]

  - entity: Candidate
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Candidate data"
    odata_entity: Candidate
    select_fields: [candidateId, firstName, lastName, email, primaryEmail, cellPhone, lastModifiedDateTime]

  - entity: LearningItem
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Learning item data"
    odata_entity: UserLearningItems
    select_fields: [userId, learningItemId, title, status, completionDate, dueDate, lastModifiedDateTime]

  - entity: PerformanceReview
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Performance review data"
    odata_entity: PerformanceReview
    select_fields: [formDataId, userId, rating, overallRating, formStartDate, formDueDate, lastModifiedDateTime]

  - entity: GoalPlan
    mode: incremental
    watermark_field: lastModifiedDateTime
    page_size: 200
    description: "Goal plan data"
    odata_entity: GoalPlan
    select_fields: [planId, userId, planName, startDate, endDate, state, lastModifiedDateTime]
