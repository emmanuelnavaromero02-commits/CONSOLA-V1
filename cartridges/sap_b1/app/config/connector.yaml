connector:
  id: sap_b1
  name: SAP Business One
  version: "0.1"
  description: >
    Connector for SAP Business One 10 on SAP HANA. Reads the company
    databases directly over SQL (one schema per company): masters, sales
    and purchase documents with their lines, journal entries, inventory
    movements, batches and production orders. Multi-company by design:
    every row carries the company alias.
  auth:
    type: database
    env_var_user: SAP_B1_USER
    env_var_pass: SAP_B1_PASSWORD
  database:
    dialect_env: SAP_B1_DIALECT        # hana (production) | postgres (test bed)
    host_env: SAP_B1_HOST
    port_env: SAP_B1_PORT              # empty = 30015 (hana) / 5432 (postgres)
    database_env: SAP_B1_DATABASE      # HANA tenant via SYSTEMDB, or Postgres dbname
    companies_env: SAP_B1_COMPANIES    # "alias=SCHEMA,alias=SCHEMA"
    encrypt_env: SAP_B1_ENCRYPT
    connect_timeout_seconds: 15
    page_size_default: 2000
  storage:
    layer: bronze
    format: parquet
    compression: snappy
    path_template: "raw/sap_b1/{entity}/tenant_id={tenant_id}/workspace_id={workspace_id}/load_date={load_date}/batch_id={run_id}/"
    bucket_env: MINIO_BUCKET
  watermark:
    storage: postgres
    scope: entity_and_company          # entity_watermarks.entity_name = "OINV@alias"
    buffer_minutes: 5
    field_format: b1_update_ts
  mcp:
    mount_path: /mcp
    transport: streamable_http
