entities:
  - entity: series_observations
    mode: incremental
    primary_key: series_id,observation_date
    date_field: observation_date
    watermark_field: observation_date
    metadata_entity: series_metadata
    max_series_per_request: 20
    metadata_preflight_status: pending_live_inegi_token
    pending_official_validation:
      - expected_title
      - unit
      - frequency
      - expected_min
      - expected_max
    metadata_preflight_rule: "Do not treat this allowlist as frozen until INEGI_API_TOKEN live preflight passes."
    series:
      - series_id: "454168"
        metric_name: igae_index
        official_preflight_status: pending_live_inegi_token
        expected_title: "Indicador global de la actividad economica, base 2018"
        unit: index_2018_100
        frequency: monthly
        expected_unit_code: ""
        expected_frequency_code: ""
        overlap_days: 90
        expected_min: 50
        expected_max: 200
      - series_id: "736537"
        metric_name: unemployment_rate
        official_preflight_status: pending_live_inegi_token
        expected_title: "Tasa de desocupacion"
        unit: percent
        frequency: monthly
        expected_unit_code: ""
        expected_frequency_code: ""
        overlap_days: 90
        expected_min: 0
        expected_max: 30
      - series_id: "910414"
        metric_name: consumer_price_index
        official_preflight_status: pending_live_inegi_token
        expected_title: "Indice Nacional de Precios al Consumidor"
        unit: index
        frequency: monthly
        expected_unit_code: ""
        expected_frequency_code: ""
        overlap_days: 90
        expected_min: 50
        expected_max: 300
      - series_id: "910400"
        metric_name: cpi_headline_index
        official_preflight_status: pending_live_inegi_token
        expected_title: "Indice Nacional de Precios al Consumidor"
        unit: index
        frequency: monthly
        expected_unit_code: ""
        expected_frequency_code: ""
        overlap_days: 90
        expected_min: 50
        expected_max: 300

  - entity: series_metadata
    mode: full
    primary_key: series_id
