version: 1
cartridge: hubspot
domain: Ventas
external_sources:
  - id: commercial_calendar
    type: company_calendar
    ttl_seconds: 86400
    enabled: true
  - id: market_notes
    type: market_notes
    ttl_seconds: 86400
    enabled: true
metrics:
  - id: forecast_weighted
    name: Forecast ponderado mensual
    dataset: forecast_mensual
    entity:
      kind: seller
      id_field: owner_id
      label_field: vendedor
    time_field: mes
    value_field: forecast_ponderado_usd
    expected_behavior: higher_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 6
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 1
    hypotheses:
      - id: campaign_or_market_event
        title: Campana, evento o condicion comercial externa
        rationale: El forecast puede moverse por campanas, eventos del mercado o cambios en demanda.
    signal_rules:
      warning_pct: 0.20
      critical_pct: 0.45
    action_templates:
      - id: inspect_pipeline
        label: Revisar deals que explican el forecast
        action_kind: owner_review
        impact_multiplier: 0.20
        cost: 200
        risk: 120
        time_cost: 80
      - id: accelerate_campaign
        label: Activar campana comercial focalizada
        action_kind: growth_campaign
        impact_multiplier: 0.35
        cost: 900
        risk: 300
        time_cost: 180
      - id: do_nothing
        label: No intervenir y seguir midiendo
        action_kind: monitor
        impact_multiplier: 0.00
        cost: 0
        risk: 40
        time_cost: 0
  - id: stale_deal_value
    name: Monto estancado por deal
    dataset: deals_estancados
    entity:
      kind: deal
      id_field: deal_id
      label_field: dealname
    time_field: fecha_cierre_esperada
    value_field: monto_usd
    expected_behavior: lower_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 8
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 1
    hypotheses:
      - id: owner_execution_or_customer_delay
        title: Ejecucion del owner o atraso del cliente
        rationale: Deals estancados suelen explicarse por seguimiento interno, aprobaciones del cliente o timing comercial.
    signal_rules:
      warning_pct: 0.20
      critical_pct: 0.40
    action_templates:
      - id: owner_followup
        label: Pedir seguimiento al owner
        action_kind: owner_review
        impact_multiplier: 0.25
        cost: 100
        risk: 80
        time_cost: 60
      - id: rescue_plan
        label: Preparar plan de rescate comercial
        action_kind: remediation_plan
        impact_multiplier: 0.40
        cost: 600
        risk: 240
        time_cost: 160
