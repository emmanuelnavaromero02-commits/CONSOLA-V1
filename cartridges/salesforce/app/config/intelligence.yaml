version: 1
cartridge: salesforce
domain: Ventas
external_sources:
  - id: commercial_calendar
    type: company_calendar
    ttl_seconds: 86400
    enabled: true
  - id: market_notes
    type: market_notes
    ttl_seconds: 86400
    enabled: true
metrics:
  - id: pipeline_forecast
    name: Forecast ponderado Salesforce
    dataset: salesforce_pipeline_forecast
    entity:
      kind: seller
      id_field: owner_id
      label_field: vendedor
    time_field: mes
    value_field: forecast_ponderado_usd
    expected_behavior: higher_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 6
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 1
    hypotheses:
      - id: pipeline_mix_or_market_event
        title: Cambio de mix de pipeline o contexto comercial
        rationale: El forecast puede variar por mezcla de oportunidades, eventos comerciales o demanda externa.
    signal_rules:
      warning_pct: 0.20
      critical_pct: 0.45
    action_templates:
      - id: inspect_forecast
        label: Revisar oportunidades que explican el forecast
        action_kind: owner_review
        impact_multiplier: 0.20
        cost: 180
        risk: 100
        time_cost: 80
      - id: activate_pipeline_push
        label: Activar empuje comercial focalizado
        action_kind: growth_campaign
        impact_multiplier: 0.35
        cost: 850
        risk: 280
        time_cost: 180
  - id: capacity_gap
    name: Holgura forecast contra capacidad
    dataset: salesforce_forecast_vs_capacidad
    entity:
      kind: pipeline
      id_field: __all__
      label_field: Forecast vs capacidad
    time_field: mes
    value_field: holgura_horas
    expected_behavior: higher_is_good
    baseline:
      method: moving_average
      minimum_history: 2
      window: 6
    prediction:
      enabled: true
      method: trend_delta
      horizon_days: [7, 21]
      minimum_history: 2
    impact:
      currency: USD
      unit_value: 120
    hypotheses:
      - id: sales_delivery_capacity_gap
        title: Brecha entre venta futura y capacidad operativa
        rationale: La holgura puede caer si el forecast crece mas rapido que la capacidad disponible.
    signal_rules:
      warning_pct: 0.15
      critical_pct: 0.30
    action_templates:
      - id: capacity_preflight
        label: Validar capacidad operativa antes de vender mas
        action_kind: capacity_preflight
        impact_multiplier: 0.25
        cost: 300
        risk: 160
        time_cost: 140
      - id: hire_or_rebalance
        label: Preparar rebalanceo o refuerzo temporal
        action_kind: capacity_rebalance
        impact_multiplier: 0.40
        cost: 1200
        risk: 450
        time_cost: 260
