connector:
  id: banxico
  name: Banco de Mexico SIE
  version: 0.1.0
  description: Official Banxico SIE Bronze ingestion for allowlisted macro series.
  auth:
    type: bmx_token
    env_var: BANXICO_API_TOKEN
    header: Bmx-Token
  api:
    base_url: https://www.banxico.org.mx/SieAPIRest/service/v1
    host_allowlist:
      - www.banxico.org.mx
    locale: es
    timeout:
      connect_seconds: 5
      read_seconds: 30
    retry:
      attempts: 3
      backoff_seconds: [1, 2, 4]
    rate_limits:
      metadata_per_minute: 20
      historical_per_5_minutes: 30
  runtime:
    mode: bronze_only
    scope_source: internal_request
    required_args:
      - tenant_id
      - workspace_id
  storage:
    path_template: "raw/banxico/{entity}/tenant_id={tenant_id}/workspace_id={workspace_id}/load_date={load_date}/batch_id={run_id}/"
    manifest_required: true
    immutable_batches: true
