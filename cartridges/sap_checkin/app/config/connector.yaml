connector:
  id: sap_checkin
  name: SAP Check-In Empleados
  version: "1.0"
  description: Este cartucho combina datos de SAP Time con sistemas externos de control de acceso (tornos, lectores). Si el sistema de acceso tiene API propia, configurar CHECKIN_ACCESS_URL.
  auth:
    type: basic
    env_var_user: SAP_CHECKIN_USER
    env_var_pass: SAP_CHECKIN_PASS
  api:
    base_url_env: SAP_CHECKIN_BASE_URL
    timeout_seconds: 120
    retry_max: 3
    retry_backoff_factor: 2
    page_size_default: 2000
  storage:
    layer: bronze
    format: parquet
    compression: snappy
    path_template: "raw/sap_checkin/{entity}/load_date={load_date}/batch_id={run_id}/"
    bucket_env: MINIO_BUCKET
  watermark:
    storage: postgres
    buffer_minutes: 5
    field_format: iso8601
  mcp:
    mount_path: /mcp
    transport: streamable_http
  entities:
    count: 7
    watermark_field_default: lastModifiedDateTime
    page_size_default: 2000
