# Sprint v1.43.2 (Claude B8) — ruff lint + format check.
#
# Runs on every PR + push to main. Pinned ruff version so style drift
# in a future ruff release doesn't silently change what the CI accepts.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

# v1.43.2 (DevOps R1 hardening): least-privilege GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: ruff check (warnings + errors as GitHub annotations)
        run: |
          ruff check \
            --output-format=github \
            console workspace vault refinement mcp-infra cartridges

      - name: ruff format --check
        run: |
          # Format check only — we surface drift but don't fail the
          # build at first introduction. Flip ``|| true`` off once
          # the codebase is consistently auto-formatted.
          ruff format --check \
            console workspace vault refinement mcp-infra cartridges \
            || true

  console-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-next/package-lock.json

      - name: Install console-next dependencies
        run: npm --prefix console-next ci

      - name: ESLint
        run: npm --prefix console-next run lint

      - name: Vitest
        run: npm --prefix console-next run test

      - name: TypeScript
        run: npm --prefix console-next run typecheck

      - name: Production build
        run: npm --prefix console-next run build

  control-room-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/control-room-next/package-lock.json

      - name: Install control-room dependencies
        run: npm --prefix console/control-room-next ci

      - name: ESLint
        run: npm --prefix console/control-room-next run lint

      - name: TypeScript
        run: npm --prefix console/control-room-next run typecheck

      - name: Static export build
        run: npm --prefix console/control-room-next run build
