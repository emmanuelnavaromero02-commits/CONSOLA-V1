# Sprint v1.43.2 (Claude B8) — ruff lint + format check.
#
# Runs on every PR + push to main. Pinned ruff version so style drift
# in a future ruff release doesn't silently change what the CI accepts.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

# v1.43.2 (DevOps R1 hardening): least-privilege GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: detect
        run: python3 scripts/ci_changed_areas.py

  ruff:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: ruff check (warnings + errors as GitHub annotations)
        run: |
          ruff check \
            --output-format=github \
            console workspace vault refinement mcp-infra cartridges airflow \
            scripts/release_images.py \
            infra/terraform-gcp/release/install-ghcr-release-bundle.py \
            infra/terraform-gcp/release/publish-image-lock.py \
            infra/terraform-gcp/release/secure-ghcr-session.py \
            infra/terraform-gcp/release/validate-image-authority.py \
            infra/terraform-gcp/release/validate-lock-output.py

      - name: ruff format --check (advisory)
        continue-on-error: true
        run: |
          ruff format --check \
            console workspace vault refinement mcp-infra cartridges airflow \
            scripts/release_images.py \
            infra/terraform-gcp/release/install-ghcr-release-bundle.py \
            infra/terraform-gcp/release/publish-image-lock.py \
            infra/terraform-gcp/release/secure-ghcr-session.py \
            infra/terraform-gcp/release/validate-image-authority.py \
            infra/terraform-gcp/release/validate-lock-output.py

      - name: Validate private GHCR release shell syntax
        run: |
          bash -n \
            infra/terraform-gcp/release/ghcr-auth-run.sh \
            infra/terraform-gcp/release/preflight-release-images.sh

      - name: Verify sealed GHCR release bundle inventory
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("infra/terraform-gcp/release/ghcr-release-bundle.manifest.json")
          raw = manifest_path.read_bytes()
          manifest = json.loads(raw)
          canonical = (json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if raw != canonical or set(manifest) != {"files", "schema_version"}:
              raise SystemExit("GHCR release bundle manifest is not canonical")
          if manifest["schema_version"] != 1 or len(manifest["files"]) != 7:
              raise SystemExit("GHCR release bundle inventory differs")
          for name, item in manifest["files"].items():
              source = Path(item["source"])
              if hashlib.sha256(source.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"GHCR release bundle digest differs: {name}")
          PY

  console-next:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-next/package-lock.json

      - name: Install console-next dependencies
        run: npm --prefix console-next ci

      - name: ESLint
        run: npm --prefix console-next run lint

      - name: Vitest coverage
        run: npm --prefix console-next run test:coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-next-coverage
          path: console-next/coverage/
          if-no-files-found: error

      - name: TypeScript
        run: npm --prefix console-next run typecheck

      - name: Static export served by FastAPI
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          npm --prefix console-next run export:copy
          git diff --exit-code -- console/app/static/console-next

  no-lint-needed:
    needs: changes
    if: needs.changes.outputs.python == 'false' && needs.changes.outputs.frontend == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Python or console-next files changed; lint jobs skipped."

  lint-gate:
    name: lint-gate
    needs:
      - changes
      - ruff
      - console-next
      - no-lint-needed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce fail-closed lint results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON: ${{ needs.changes.outputs.python }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          CONSOLE_NEXT_RESULT: ${{ needs['console-next'].result }}
          NO_LINT_NEEDED_RESULT: ${{ needs['no-lint-needed'].result }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }
          expect_bool() {
            local name="$1"
            local value="$2"
            case "$value" in
              true|false) ;;
              *) fail "$name must be exactly true or false; got '${value:-<missing>}'" ;;
            esac
          }
          expect_result() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              fail "$name must be $expected; got '${actual:-<missing>}'"
            fi
          }

          changes_result="${CHANGES_RESULT-}"
          python="${PYTHON-}"
          frontend="${FRONTEND-}"
          if [[ "$changes_result" != "success" ]]; then
            fail "changes must be success; got '${changes_result:-<missing>}'"
          fi
          expect_bool "python" "$python"
          expect_bool "frontend" "$frontend"

          expected_ruff="skipped"
          expected_console_next="skipped"
          expected_no_lint="skipped"
          if [[ "$python" == "true" ]]; then
            expected_ruff="success"
          fi
          if [[ "$frontend" == "true" ]]; then
            expected_console_next="success"
          fi
          if [[ "$python" == "false" && "$frontend" == "false" ]]; then
            expected_no_lint="success"
          fi

          expect_result "ruff" "${RUFF_RESULT-}" "$expected_ruff"
          expect_result "console-next" "${CONSOLE_NEXT_RESULT-}" "$expected_console_next"
          expect_result "no-lint-needed" "${NO_LINT_NEEDED_RESULT-}" "$expected_no_lint"
