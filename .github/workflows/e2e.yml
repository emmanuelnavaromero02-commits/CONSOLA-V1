name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker environment
        run: |
          bash infra/bootstrap.sh
          bash infra/bootstrap-keys.sh infra/.env
          mkdir -p data/lakehouse

      - name: Configure E2E credentials
        run: |
          {
            echo "TEST_EMAIL=emmanuel@local.ai"
            echo "TEST_PASSWORD=Admin123!"
            echo "BASE_URL=http://127.0.0.1:3000"
            echo "LEGACY_URL=http://127.0.0.1:8000"
            echo "BACKEND_URL=http://127.0.0.1:8000"
            echo "OPEN_REPORT=0"
          } > tests-e2e/.env

      - name: Build and start stack
        run: |
          docker compose -f infra/docker-compose.yml --profile sap up -d --build

      - name: Wait for healthy stack
        run: bash scripts/wait_for_health.sh

      - name: Smoke 34/34
        run: make smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        env:
          OPEN_REPORT: "0"
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests-e2e/playwright-report
          if-no-files-found: ignore

      - name: Docker logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps
          docker logs mode_console --tail 120 2>&1 || true
          docker logs omega_console_next --tail 120 2>&1 || true
