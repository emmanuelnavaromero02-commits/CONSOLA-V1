name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker environment
        run: |
          bash infra/bootstrap.sh
          bash infra/bootstrap-keys.sh infra/.env
          # This job is an ephemeral dev stack. Enable the explicit
          # second RCE opt-in so Studio's "Deploy a Airflow" E2E can
          # exercise /api/studio/dag-deploy instead of the production
          # safety gate. AWS/prod compose remains default-off.
          sed -i 's/^APP_ENV=.*/APP_ENV=development/' infra/.env || true
          sed -i 's/^ALLOW_RCE_TOOLS=.*/ALLOW_RCE_TOOLS=true/' infra/.env || true
          grep -q '^APP_ENV=' infra/.env || echo 'APP_ENV=development' >> infra/.env
          grep -q '^ALLOW_RCE_TOOLS=' infra/.env || echo 'ALLOW_RCE_TOOLS=true' >> infra/.env
          mkdir -p data/lakehouse
          mkdir -p airflow/logs/scheduler airflow/logs/dag_processor airflow/logs/webserver
          chmod -R 777 airflow/logs

      - name: Configure E2E credentials
        run: |
          # Static export architecture: FastAPI on :8000 serves the console,
          # APIs, legacy pages, and the Control Room from the same origin.
          {
            echo "TEST_EMAIL=emmanuel@local.ai"
            echo "TEST_PASSWORD=Admin123!"
            echo "BASE_URL=http://127.0.0.1:8000"
            echo "LEGACY_URL=http://127.0.0.1:8000"
            echo "BACKEND_URL=http://127.0.0.1:8000"
            echo "CONTROL_ROOM_URL=http://127.0.0.1:8000/control-room"
            echo "OPEN_REPORT=0"
          } > tests-e2e/.env

      - name: Build and start stack
        run: |
          APP_ENV=development ALLOW_RCE_TOOLS=true \
            docker compose --env-file infra/.env \
              -f infra/docker-compose.yml -f infra/docker-compose.dev.yml \
              --profile sap up -d --build

      - name: Wait for healthy stack
        run: bash scripts/wait_for_health.sh

      - name: Smoke 34/34
        run: make smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        env:
          OPEN_REPORT: "0"
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests-e2e/playwright-report
          if-no-files-found: ignore

      - name: Docker logs on failure
        if: failure()
        run: |
          docker compose --env-file infra/.env \
            -f infra/docker-compose.yml -f infra/docker-compose.dev.yml \
            --profile sap ps
          docker logs mode_airflow_init --tail 220 2>&1 || true
          docker logs mode_superset_init --tail 180 2>&1 || true
          docker logs mode_console --tail 120 2>&1 || true
          docker logs mode_airflow --tail 160 2>&1 || true
          docker logs mode_airflow_scheduler --tail 160 2>&1 || true
