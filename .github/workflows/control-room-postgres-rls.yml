name: Control Room PostgreSQL RLS

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      control_room: ${{ steps.detect.outputs.control_room }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: python3 scripts/ci_changed_areas.py

  control-room-postgres-rls:
    needs: changes
    if: needs.changes.outputs.control_room == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      public-sql-postgres-oracle:
        image: postgres:15.18
        env:
          POSTGRES_DB: sql_oracle
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_oracle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r tests/requirements.txt \
            -r console/requirements.txt \
            -r mcp-infra/requirements.txt
          python -m pip check

      - name: Prepare hermetic Refinement DuckDB artifact
        shell: bash
        env:
          DUCKDB_TEST_HOME: /tmp/refinement-duckdb-home
          REFINEMENT_IMAGE: refinement:offline-smoke
        run: scripts/prepare_refinement_duckdb_ci.sh

      - name: Build and smoke Replicon DuckDB/httpfs image
        shell: bash
        run: |
          set -euo pipefail
          image="replicon:httpfs-ci-${GITHUB_SHA}"
          docker build cartridges/replicon \
            --file cartridges/replicon/Dockerfile \
            --tag "$image"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "appuser"
          scripts/ci_replicon_minio_smoke.sh "$image"

      - name: Run focal Control Room tests
        continue-on-error: true
        env:
          HOME: /tmp/refinement-duckdb-home
          DOCKER_HOST: unix:///var/run/docker.sock
          PYTHONPATH: .:console
          PUBLIC_SQL_POSTGRES_DB: sql_oracle
          PUBLIC_SQL_POSTGRES_HOST: 127.0.0.1
          PUBLIC_SQL_POSTGRES_PORT: "55432"
          PUBLIC_SQL_POSTGRES_USER: postgres
        run: |
          pytest -ra --junitxml=/tmp/control-room-focal.xml \
            console/tests/control_room_public_sql_parse_oracle_gate.py \
            console/tests/test_audit_service_transactional.py \
            console/tests/test_control_room*.py \
            console/tests/test_scoped_surface_hardening.py \
            console/tests/test_decision*.py \
            console/tests/test_gold_fetcher.py \
            console/tests/test_gold_refresh_intelligence.py \
            console/tests/test_intelligence_control_room_canonical_persistence.py \
            console/tests/test_intelligence_evidence_refs_attestation.py \
            console/tests/test_ops_summary_and_version.py \
            console/tests/test_pipeline_extract.py \
            tests/test_decision*.py \
            tests/test_pipeline_control_room_refresh.py \
            tests/test_scheduled_monitor_execution.py \
            tests/test_agentops_scheduled_monitor_contract.py \
            tests/test_agent_runner_http_outcome.py \
            tests/test_dataset_refresh_chain_fail_closed.py \
            tests/test_operational_truth_e2e_gate_contract.py \
            tests/test_operational_truth_runtime_final_red.py \
            tests/test_operational_truth_runtime_red.py \
            tests/test_runtime_security_context_red.py \
            tests/test_security_context_verifiers.py \
            tests/test_aws_beta_operations.py \
            tests/test_aws_bootstrap_shared_env_boundary.py \
            tests/test_aws_evidence_compose_isolation.py \
            tests/test_aws_env_pair_transaction.py \
            tests/test_aws_ghcr_private_auth.py \
            tests/test_gcp_ghcr_private_auth.py \
            tests/test_release_image_promotion.py \
            tests/test_aws_ssm_deploy_workflow.py \
            tests/test_aws_evidence_env_isolation.py \
            tests/test_aws_evidence_update_env.py \
            tests/test_aws_secrets_manager_config.py \
            tests/test_control_room_ci_contract.py \
            tests/test_control_room_gate_contract.py \
            tests/test_control_room_path_policy.py \
            tests/test_control_room_evidence_keyring_runtime.py \
            tests/test_control_room_evidence_signing_wiring.py \
            tests/test_intelligence_engine_contract.py \
            tests/test_market_decision_validation_e2e.py \
            tests/test_mcp_infra_pdf_ci_contract.py \
            tests/test_mcp_control_room_read_permissions.py \
            tests/test_pipeline_run_save_authority.py \
            tests/test_scheduled_effect_fencing.py \
            tests/test_staged_publication_compatibility_projection.py \
            console/tests/test_operational_truth_statistical_fallbacks.py \
            console/tests/test_operational_truth_public_projection.py \
            tests/test_operational_truth_data_integrity.py \
            tests/test_operational_truth_data_kb_config.py \
            tests/test_operational_truth_data_kb_runtime.py \
            tests/test_operational_truth_data_historical_repair.py \
            tests/test_replicon_wip_v3_currency.py \
            tests/test_sap_successfactors_talent_migration.py \
            tests/test_intelligence_provenance_resolver.py \
            tests/test_calibration_recompute_complete_batch.py \
            tests/test_calibration_authoritative_observation.py \
            tests/test_calibration_idempotency_schema.py \
            tests/test_calibration_observe_idempotency.py \
            tests/test_calibration_legacy_quarantine_migration.py \
            tests/test_calibration_reconstructible_authority.py \
            tests/test_bayesian_calibration_engine.py \
            tests/test_monte_carlo_engine.py \
            tests/test_monte_carlo_api_contract.py \
            tests/test_monte_carlo_finiteness.py \
            tests/test_monte_carlo_operational_truth.py \
            tests/test_monte_carlo_persistence_contract.py \
            tests/test_monte_carlo_discrete_weight_normalization.py \
            tests/test_bayesian_calibration_api_contract.py \
            tests/test_bayesian_calibration_recompute_policy.py \
            tests/test_decision_operational_truth_duckdb_httpfs.py \
            tests/test_replicon_minio_image_contract.py \
            tests/test_cartridge_query_kb_sql_guard.py \
            tests/test_cartridge_scope_propagation.py \
            tests/test_seed_packaged_datasets_logging.py \
            tests/test_successfactors_talent_fallbacks.py \
            tests/test_cartridge_query_kb_reader_sandbox.py \
            tests/test_talent_benchmark_approval_authority.py \
            tests/test_talent_nine_box_fail_closed.py \
            tests/test_talent_nine_box_downstream.py \
            tests/test_talent_nine_box_lateral_guards.py \
            tests/test_talent_nine_box_projection_guards.py \
            tests/test_talent_readiness_benchmark_guards.py \
            tests/test_talent_score_type_guards.py \
            tests/test_v1_router_mount.py

      - name: Provision the app-grant database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # The published-app grant ledger is authority for what an app may
          # read, so its guarantees — pg_temp shadowing, function ownership,
          # ACL, RLS, revocation — have to be exercised against a real server.
          # Applying the real migrations here is what keeps these tests from
          # skipping in CI, which is how they were passing without running.
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS app_grants" \
            -c "CREATE DATABASE app_grants"
          for f in tests/fixtures/app_grants_schema.sql \
                   infra/init/99zzt_analytic_app_dataset_grants.sql \
                   infra/init/99zzu_analytic_app_manifest_registry.sql \
                   tests/fixtures/app_grants_seed.sql; do
            echo "[app-grants] applying $f"
            psql -h 127.0.0.1 -p 55432 -U postgres -d app_grants \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # Applying twice proves the migration is idempotent on every run.
          psql -h 127.0.0.1 -p 55432 -U postgres -d app_grants -v ON_ERROR_STOP=1 -q \
            -f infra/init/99zzt_analytic_app_dataset_grants.sql
          psql -h 127.0.0.1 -p 55432 -U postgres -d app_grants -v ON_ERROR_STOP=1 -q \
            -f infra/init/99zzu_analytic_app_manifest_registry.sql

      - name: Manifest registry is regenerable and unchanged
        env:
          PYTHONPATH: .:console
        run: python3 scripts/generate_app_manifest_registry.py --check

      - name: Run live PostgreSQL/RLS tests
        if: always()
        continue-on-error: true
        env:
          OMEGA_TEST_GRANTS_DSN: postgresql://postgres:postgres@127.0.0.1:55432/app_grants
          HOME: /tmp/refinement-duckdb-home
          DOCKER_HOST: unix:///var/run/docker.sock
          PYTHONPATH: .:console
        run: |
          pytest -ra --junitxml=/tmp/control-room-postgres-rls.xml \
            tests/test_analytic_app_dataset_grants.py \
            tests/test_operational_rls_console_refinement.py \
            tests/test_operational_rls_policy_guard.py \
            tests/test_control_room_live_postgres*.py \
            tests/test_dataset_refresh_admission_live.py \
            tests/test_gold_refresh_binding_crash_matrix_live.py \
            tests/test_operational_truth_runtime_leases_live.py \
            tests/test_operational_truth_scope_authority_live.py \
            tests/test_operational_truth_scope_upgrade_live.py \
            tests/test_pipeline_run_save_authority_live.py \
            tests/test_scheduled_effect_authority_live.py \
            tests/test_staged_publication_acceptance.py \
            tests/test_staged_publication_authority_live.py \
            tests/test_staged_publication_reader_alignment_live.py \
            tests/test_staged_publication_semantics_live.py \
            tests/test_staged_publication_final_red.py \
            tests/test_staged_publication_integrity_live.py \
            tests/test_staged_publication_live.py \
            tests/test_staged_publication_public_projection.py \
            tests/test_staged_publication_reader_boundaries.py \
            tests/test_staged_publication_recovery_matrix_live.py \
            tests/test_staged_publication_red.py \
            tests/test_staged_publication_verifier_boundary_live.py \
            tests/test_talent_benchmark_publication_authority_live.py

      - name: Verify hermetic DuckDB extension cache
        if: always()
        shell: bash
        env:
          DUCKDB_TEST_HOME: /tmp/refinement-duckdb-home
        run: |
          set -euo pipefail
          test -s /tmp/refinement-duckdb-extensions.before
          find "$DUCKDB_TEST_HOME/.duckdb" -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum \
            > /tmp/refinement-duckdb-extensions.after
          cmp /tmp/refinement-duckdb-extensions.before \
            /tmp/refinement-duckdb-extensions.after

      - name: Verify focal and live PostgreSQL/RLS reports
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def verify_junit(path: str, *, minimum: int, label: str) -> None:
              if not Path(path).is_file():
                  raise SystemExit(f"{label} report missing; tests did not complete")
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              counts = {
                  name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
                  for name in ("tests", "skipped", "failures", "errors")
              }
              tests = counts["tests"]
              if tests < minimum:
                  raise SystemExit(
                      f"{label} collected only {tests} tests; expected >= {minimum}"
                  )
              bad = {
                  name: counts[name] for name in ("skipped", "failures", "errors")
              }
              if any(bad.values()):
                  raise SystemExit(f"{label} JUnit is not clean: {bad}")

          verify_junit("/tmp/control-room-focal.xml", minimum=9659, label="Focal Control Room")
          verify_junit("/tmp/control-room-postgres-rls.xml", minimum=296, label="Live PostgreSQL/RLS")
          PY

  operational-truth-e2e:
    needs: changes
    if: needs.changes.outputs.control_room == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run real operational truth E2E
        env:
          E2E_ARTIFACTS_DIR: /tmp/operational-truth-e2e
          E2E_WAIT_TIMEOUT_SECONDS: "600"
        run: scripts/run_operational_truth_e2e.sh

      - name: Package operational truth E2E evidence
        if: always()
        shell: bash
        run: >-
          scripts/package_operational_truth_evidence.sh
          /tmp/operational-truth-e2e
          /tmp/operational-truth-e2e-evidence.tar.gz

      - name: Upload operational truth E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-truth-e2e
          path: |
            /tmp/operational-truth-e2e-evidence.tar.gz
            /tmp/operational-truth-e2e-evidence.tar.gz.sha256
          if-no-files-found: error

  no-control-room-needed:
    needs: changes
    if: needs.changes.outputs.control_room == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "No Control Room changes detected"

  control-room-gate:
    name: control-room-gate
    needs:
      - changes
      - control-room-postgres-rls
      - operational-truth-e2e
      - no-control-room-needed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce fail-closed Control Room results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTROL_ROOM: ${{ needs.changes.outputs.control_room }}
          CONTROL_ROOM_TESTS_RESULT: ${{ needs['control-room-postgres-rls'].result }}
          OPERATIONAL_TRUTH_E2E_RESULT: ${{ needs['operational-truth-e2e'].result }}
          NO_CONTROL_ROOM_NEEDED_RESULT: ${{ needs['no-control-room-needed'].result }}
        run: |
          set -euo pipefail

          changes="${CHANGES_RESULT-}"
          control_room="${CONTROL_ROOM-}"
          tests="${CONTROL_ROOM_TESTS_RESULT-}"
          e2e="${OPERATIONAL_TRUTH_E2E_RESULT-}"
          noop="${NO_CONTROL_ROOM_NEEDED_RESULT-}"

          if [[ "$changes" != "success" ]]; then
            echo "::error::changes must be success; got '${changes:-<missing>}'"
            exit 1
          fi

          case "$control_room" in
            true)
              if [[ "$tests" != "success" || "$e2e" != "success" || "$noop" != "skipped" ]]; then
                echo "::error::relevant changes require tests/e2e=success and noop=skipped; got tests='${tests:-<missing>}' e2e='${e2e:-<missing>}' noop='${noop:-<missing>}'"
                exit 1
              fi
              ;;
            false)
              if [[ "$tests" != "skipped" || "$e2e" != "skipped" || "$noop" != "success" ]]; then
                echo "::error::irrelevant changes require tests/e2e=skipped and noop=success; got tests='${tests:-<missing>}' e2e='${e2e:-<missing>}' noop='${noop:-<missing>}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::control_room must be exactly true or false; got '${control_room:-<missing>}'"
              exit 1
              ;;
          esac
