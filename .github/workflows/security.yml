# Sprint v1.43.2 (Claude B8) — bandit + pip-audit security scans.
#
# bandit catches in-source security smells (hardcoded password literals,
# shell=True, weak random, etc.). pip-audit cross-references each
# requirements.txt against the OSV vulnerability database.
#
# Pinned tool versions so a new ruleset doesn't silently change what
# the CI accepts. Scheduled weekly run picks up new CVEs against the
# same code that passed PR time.

name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — once a week.

# v1.43.2 (DevOps R1 hardening): least-privilege GITHUB_TOKEN. We only
# need read access to the source + write to upload-artifact, which sits
# under ``actions:write`` (granted by default at the job level for
# ``upload-artifact`` regardless of top-level scope).
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_runtime: ${{ steps.detect.outputs.python_runtime }}
      python_deps: ${{ steps.detect.outputs.python_deps }}
      node_deps: ${{ steps.detect.outputs.node_deps }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: python3 scripts/ci_changed_areas.py

  bandit:
    needs: changes
    if: needs.changes.outputs.python_runtime == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit (JSON report + console output)
        run: |
          # First pass: dump the JSON report at MEDIUM+ severity so the
          # artifact is always rich, even when CI only fails on the
          # narrower threshold below.
          bandit -r \
            console workspace vault refinement mcp-infra cartridges \
            --severity-level medium \
            -f json -o bandit-report.json || true
          # v1.45.17 audit follow-up: fail the job on MEDIUM+
          # severity AT HIGH confidence. The current B608 baseline is
          # documented in docs/security/bandit-b608-triage.md: as of
          # 2026-06-05 there are 165 MEDIUM severity findings, all at
          # LOW/MEDIUM confidence. They require line-by-line adjudication
          # before v1.0, but HIGH-confidence regressions still fail CI now.
          bandit -r \
            console workspace vault refinement mcp-infra cartridges \
            --severity-level medium \
            --confidence-level high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    needs: changes
    if: needs.changes.outputs.python_deps == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit each service's requirements
        run: |
          set +e
          fail=0
          # v1.43.2 (DevOps R1 hardening): discover every requirements.txt
          # at runtime instead of hand-listing 5 services. The previous
          # hand-list missed cartridge requirements + tests
          # requirements — a CVE there would ship to prod undetected.
          # Excludes .git/ and any nested vendor/ trees.
          REQUIREMENTS=$(find . -name requirements.txt \
            -not -path './.git/*' \
            -not -path './*/vendor/*' \
            -not -path './*/node_modules/*' \
            | sort)
          if [ -z "$REQUIREMENTS" ]; then
            echo "::error::no requirements.txt files found"
            exit 1
          fi
          echo "Discovered requirements files:"
          echo "$REQUIREMENTS"
          echo "---"
          # v1.43.4: the "cartridge-deps sprint" that v1.43.2 deferred
          # shipped in this hotfix — fastmcp was bumped 2.5.0 → 3.x
          # across the cartridges (Codex C1 BLOCKER fix), which
          # transitively pulled mcp >= 1.23.0, requests >= 2.33.0,
          # and python-dotenv >= 1.2.2. All ten suppressions are
          # therefore retired and the audit runs fail-closed again.
          IGNORE_FLAGS=(
            # v1.43.5: both advisories currently have no fixed version in
            # PyPI's advisory feed. PYSEC-2025-183 is disputed upstream
            # because JWT key strength is application controlled; our
            # auth paths enforce server-owned keys and do not accept
            # user-supplied signing secrets. PYSEC-2025-185 affects
            # python-jose JWE decompression; console auth uses signed JWT
            # flows, not JWE decrypt. Keep these scoped by advisory id so
            # new fixable CVEs still fail the gate.
            --ignore-vuln PYSEC-2025-183
            --ignore-vuln PYSEC-2025-185
            # PYSEC-2026-1325 affects python-ecdsa ECDSA signing on P-256.
            # Upstream lists no fixed version/planned fix. Console JWT
            # uses HS256 symmetric signing by default; keep this scoped so
            # any unrelated/fixable advisory still fails closed.
            --ignore-vuln PYSEC-2026-1325
          )
          # v1.43.2 (DevOps R1 follow-up): use the PyPI / packaging.org
          # advisory database (pip-audit's default) instead of OSV.
          # Both feeds ultimately import GHSA advisories, but the PyPI
          # service was reachable from the v1.43.2 dev sandbox where
          # we verified the ignore-list completeness; OSV's API returned
          # 403 to that sandbox, so the ignore-list could not be
          # validated against it offline. Switching here keeps the gate
          # honest — we audit against the database we can reproduce —
          # without weakening the CVE check itself.
          while IFS= read -r req; do
            echo "=== Auditing $req ==="
            pip-audit -r "$req" --vulnerability-service=pypi "${IGNORE_FLAGS[@]}"
            rc=$?
            if [ $rc -ne 0 ]; then
              fail=1
              echo "::warning::pip-audit found issues in $req"
            fi
          done <<< "$REQUIREMENTS"
          # Exit non-zero only when at least one requirements file
          # surfaced a vulnerability. This keeps the signal loud
          # without breaking on every transient network error from
          # the OSV service.
          exit $fail

  npm-audit:
    needs: changes
    if: needs.changes.outputs.node_deps == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            console-next/package-lock.json
            tests-e2e/package-lock.json

      - name: Audit console-next dependencies
        working-directory: console-next
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit E2E dependencies
        working-directory: tests-e2e
        run: |
          npm ci
          npm audit --audit-level=high

  no-security-scan-needed:
    needs: changes
    if: |
      needs.changes.outputs.python_runtime != 'true' &&
      needs.changes.outputs.python_deps != 'true' &&
      needs.changes.outputs.node_deps != 'true' &&
      needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No runtime code, dependency, or workflow files changed; security scans skipped."
