name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (working tree, fail-closed)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --no-git --redact \
            --config /repo/.gitleaks.toml

  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history, fail-closed)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact \
            --config /repo/.gitleaks-history.toml

  gitleaks-pr-range:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (pull request commits, strict tree config)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact \
            --config /repo/.gitleaks.toml \
            --log-opts="origin/${BASE_REF}..HEAD"
