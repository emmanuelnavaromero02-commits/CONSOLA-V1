# F3-8: secret-scanning gate over the checked-out tree. Prevention only —
# history is not rescanned or rewritten here; the gate stops NEW secrets from
# landing in the tree. Version pinned like the other lint gates so a gitleaks
# release can't silently change what CI accepts.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (working tree, fail-closed)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --no-git --redact \
            --config /repo/.gitleaks.toml
