# F3-8: secret-scanning gates. Two jobs asking two different questions.
#
# `gitleaks` scans the checked-out tree: does this change add a secret?
#
# `gitleaks-history` scans every commit: can a reader recover a secret from
# the published history? Nothing asked that until 2026-09-20, and the answer
# was not empty — infra/.env.save had been readable since 2026-05-10, four
# months, in a public repository. Removing a file from the tree does not
# remove it from history, so a tree-only gate could never have seen it.
#
# Version pinned like the other lint gates so a gitleaks release can't
# silently change what CI accepts.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (working tree, fail-closed)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --no-git --redact \
            --config /repo/.gitleaks.toml

  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, not only the tip. With the default shallow clone
          # this job would pass by seeing almost nothing, which is worse than
          # not having it: a green gate that checks nothing.
          fetch-depth: 0

      - name: gitleaks (full history, fail-closed)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact \
            --config /repo/.gitleaks-history.toml
