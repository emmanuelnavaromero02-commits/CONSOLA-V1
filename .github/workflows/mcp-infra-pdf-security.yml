name: MCP Infra PDF Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  functional-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            mcp-infra/requirements.txt

      - name: Install functional test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -r mcp-infra/requirements.txt

      - name: Run protected PDF ingestion regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --junitxml=/tmp/functional-pdf.xml \
            tests/test_mcp_infra_pdf_ingest.py \
            tests/test_mcp_infra_pdf_capacity.py \
            tests/test_mcp_infra_pdf_compose_capacity.py \
            tests/test_pypdf_security.py \
            tests/test_mcp_infra_pdf_ci_contract.py \
            tests/test_lint_gate_contract.py \
            tests/test_security_gate_contract.py \
            tests/test_ci_detector_self_protection.py \
            tests/test_control_room_ci_contract.py \
            tests/test_control_room_gate_contract.py \
            tests/test_control_room_path_policy.py

      - name: Verify protected PDF report
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def verify_junit(path: str, *, minimum: int, label: str) -> None:
              report = Path(path)
              if not report.is_file():
                  raise SystemExit(f"{label} report missing; tests did not complete")
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              counts = {
                  name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
                  for name in ("tests", "skipped", "failures", "errors")
              }
              if counts["tests"] < minimum:
                  raise SystemExit(
                      f"{label} collected only {counts['tests']} tests; expected >= {minimum}"
                  )
              bad = {
                  name: counts[name]
                  for name in ("skipped", "failures", "errors")
              }
              if any(bad.values()):
                  raise SystemExit(f"{label} JUnit is not clean: {bad}")

          verify_junit(
              "/tmp/functional-pdf.xml", minimum=332, label="Functional PDF"
          )
          PY

  pdf-gate:
    name: pdf-gate
    needs:
      - functional-pdf
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce fail-closed PDF results
        shell: bash
        env:
          FUNCTIONAL_PDF_RESULT: ${{ needs['functional-pdf'].result }}
        run: |
          set -euo pipefail

          result="${FUNCTIONAL_PDF_RESULT-}"
          if [[ "$result" != "success" ]]; then
            echo "::error::functional-pdf must be success; got '${result:-<missing>}'"
            exit 1
          fi
