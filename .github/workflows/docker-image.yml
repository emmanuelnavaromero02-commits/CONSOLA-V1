name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      console_tests: ${{ steps.detect.outputs.console_tests }}
      refinement_tests: ${{ steps.detect.outputs.refinement_tests }}
      vault_tests: ${{ steps.detect.outputs.vault_tests }}
      workspace_tests: ${{ steps.detect.outputs.workspace_tests }}
      root_tests: ${{ steps.detect.outputs.root_tests }}
      cartridge_tests: ${{ steps.detect.outputs.cartridge_tests }}
      root_test_targets: ${{ steps.detect.outputs.root_test_targets }}
      cartridge_test_targets: ${{ steps.detect.outputs.cartridge_test_targets }}
      cartridge_requirement_paths: ${{ steps.detect.outputs.cartridge_requirement_paths }}
      compose: ${{ steps.detect.outputs.compose }}
      infra: ${{ steps.detect.outputs.infra }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
      has_build_matrix: ${{ steps.detect.outputs.has_build_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: python3 scripts/ci_changed_areas.py

  test:
    needs: changes
    if: |
      needs.changes.outputs.console_tests == 'true' ||
      needs.changes.outputs.refinement_tests == 'true' ||
      needs.changes.outputs.vault_tests == 'true' ||
      needs.changes.outputs.workspace_tests == 'true' ||
      needs.changes.outputs.root_tests == 'true' ||
      needs.changes.outputs.cartridge_tests == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and coverage tooling
        run: pip install pytest pytest-asyncio coverage==7.6.1 fakeredis==2.35.1

      - name: Install console requirements
        if: needs.changes.outputs.console_tests == 'true'
        run: pip install -r console/requirements.txt

      - name: Run console tests
        if: needs.changes.outputs.console_tests == 'true'
        run: coverage run --parallel-mode --source=console/app -m pytest console/tests/ -q

      - name: Install refinement requirements
        if: needs.changes.outputs.refinement_tests == 'true'
        run: pip install -r refinement/requirements.txt

      - name: Run refinement tests
        if: needs.changes.outputs.refinement_tests == 'true'
        run: PYTHONPATH=. coverage run --parallel-mode --source=refinement/app -m pytest refinement/tests/ -q

      - name: Install vault requirements
        if: needs.changes.outputs.vault_tests == 'true'
        run: pip install -r vault/requirements.txt

      - name: Run vault tests
        if: needs.changes.outputs.vault_tests == 'true'
        run: PYTHONPATH=vault coverage run --parallel-mode --source=vault/app -m pytest vault/tests/ -q

      - name: Check for workspace tests
        if: needs.changes.outputs.workspace_tests == 'true'
        run: |
          if [ -d workspace/tests ]; then
            pip install -r workspace/requirements.txt
            PYTHONPATH=workspace coverage run --parallel-mode --source=workspace/app -m pytest workspace/tests/ -q
          else
            echo "::warning::workspace/tests/ no existe — pendiente de crear suite"
          fi

      - name: Install cartridge requirements for root tests/
        if: needs.changes.outputs.root_tests == 'true' || needs.changes.outputs.cartridge_tests == 'true'
        run: |
          pip install -r tests/requirements.txt
          pip install -r mcp-infra/requirements.txt
          requirements="${{ needs.changes.outputs.cartridge_requirement_paths }}"
          for req in $requirements; do
            pip install -r "$req"
          done

      - name: Run root tests/ (cartridge contracts)
        if: needs.changes.outputs.root_tests == 'true'
        env:
          E2E_REQUIRE_STACK: ""
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          targets="${{ needs.changes.outputs.root_test_targets }}"
          if [ -z "$targets" ]; then
            echo "No root pytest targets resolved for this change."
            exit 0
          fi
          coverage run --parallel-mode \
            --source=console/app,refinement/app,vault/app,workspace/app,mcp-infra/app,cartridges \
            -m pytest $targets -q

      - name: Run cartridges/ suite
        if: needs.changes.outputs.cartridge_tests == 'true'
        run: |
          targets="${{ needs.changes.outputs.cartridge_test_targets }}"
          if [ -z "$targets" ]; then
            echo "No cartridge pytest targets resolved for this change."
            exit 0
          fi
          coverage run --parallel-mode --source=cartridges -m pytest --import-mode=importlib $targets -q

      - name: Publish Python coverage artifacts
        if: always()
        run: |
          mkdir -p coverage
          if compgen -G ".coverage*" > /dev/null; then
            coverage combine || true
            coverage xml -o coverage/python-coverage.xml
            coverage json -o coverage/python-coverage.json
            coverage report --skip-covered || true
          else
            echo "No coverage data was produced for this targeted run." > coverage/no-python-coverage.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage/
          if-no-files-found: error

  no-python-tests-needed:
    needs: changes
    if: |
      needs.changes.outputs.console_tests != 'true' &&
      needs.changes.outputs.refinement_tests != 'true' &&
      needs.changes.outputs.vault_tests != 'true' &&
      needs.changes.outputs.workspace_tests != 'true' &&
      needs.changes.outputs.root_tests != 'true' &&
      needs.changes.outputs.cartridge_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Python test area changed; test job skipped."

  compose-validate:
    needs: changes
    if: needs.changes.outputs.compose == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose configuration
        working-directory: infra
        env:
          POSTGRES_PASSWORD: dummy_postgres_password_for_ci_only
          MINIO_SECRET_KEY: dummy_minio_secret_key_for_ci_only
          INTERNAL_API_KEY: dummy_internal_api_key_for_ci_only_minimum_64_chars_xxxxxxxxxxxx
          SECURITY_CONTEXT_SIGNING_KEY: dummy_security_context_signing_key_for_ci_only_distinct_64_chars_xx
          JWT_SECRET_KEY: dummy_jwt_secret_key_for_ci_only_minimum_64_chars_xxxxxxxxxxxxxx
          SUPERSET_SECRET_KEY: dummy_superset_secret_key_for_ci_only
          SUPERSET_ADMIN_USER: ci_admin
          SUPERSET_ADMIN_PASSWORD: dummy_superset_admin_password_for_ci_only
          AIRFLOW_SECRET_KEY: dummy_airflow_secret_key_for_ci_only
          AIRFLOW_FERNET_KEY: dummy_airflow_fernet_key_for_ci_only
          AIRFLOW_ADMIN_USER: ci_admin
          AIRFLOW_ADMIN_PASSWORD: dummy_airflow_admin_password_for_ci_only
          FIELD_ENCRYPTION_KEY: d7to_DkrHVKV5_jOzwCNV-wOl4r6gGCY7Usccczm9dk=
          OMEGA_CARTRIDGE_SAP_HCM_PASSWORD: dummy_cartridge_sap_hcm_password_for_ci_only
          OMEGA_CARTRIDGE_SAP_S4_PASSWORD: dummy_cartridge_sap_s4_password_for_ci_only
          OMEGA_CARTRIDGE_SAP_SF_PASSWORD: dummy_cartridge_sap_sf_password_for_ci_only
          OMEGA_CARTRIDGE_SAP_B1_PASSWORD: dummy_cartridge_sap_b1_password_for_ci_only
          OMEGA_AIRFLOW_DAG_PASSWORD: dummy_airflow_dag_password_for_ci_only
          OMEGA_AIRFLOW_META_PASSWORD: dummy_airflow_meta_password_for_ci_only
          OMEGA_SUPERSET_META_PASSWORD: dummy_superset_meta_password_for_ci_only
          OMEGA_CARTRIDGE_REPLICON_PASSWORD: dummy_cartridge_replicon_password_for_ci_only
          OMEGA_CARTRIDGE_SALESFORCE_PASSWORD: dummy_cartridge_salesforce_password_for_ci_only
          INTERNAL_API_KEY_REPLICON_TO_CONSOLE: dummy_replicon_to_console_key_for_ci_only_32chars_xxxxxxx
          INTERNAL_API_KEY_REPLICON_TO_MCP_INFRA: dummy_replicon_to_mcp_key_for_ci_only_32chars_xxxxxxxxxx
          INTERNAL_API_KEY_REPLICON_TO_REFINEMENT: dummy_replicon_to_refinement_key_for_ci_only_32chars_xx
          OMEGA_CARTRIDGE_HUBSPOT_PASSWORD: dummy_cartridge_hubspot_password_for_ci_only
          INTERNAL_API_KEY_HUBSPOT_TO_CONSOLE: dummy_hubspot_to_console_key_for_ci_only_32chars_xxxxxxx
          INTERNAL_API_KEY_HUBSPOT_TO_MCP_INFRA: dummy_hubspot_to_mcp_key_for_ci_only_32chars_xxxxxxxxxx
          INTERNAL_API_KEY_HUBSPOT_TO_REFINEMENT: dummy_hubspot_to_refinement_key_for_ci_only_32chars_xx
          INTERNAL_API_KEY_MCP_INFRA_TO_REFINEMENT: dummy_mcp_to_refinement_key_for_ci_only_32chars_xxxxxx
          OMEGA_CARTRIDGE_BANXICO_PASSWORD: dummy_cartridge_banxico_password_for_ci_only
          INTERNAL_API_KEY_BANXICO_TO_CONSOLE: dummy_banxico_to_console_key_for_ci_only_32chars_xxxx
          OMEGA_CARTRIDGE_INEGI_PASSWORD: dummy_cartridge_inegi_password_for_ci_only
          INTERNAL_API_KEY_INEGI_TO_CONSOLE: dummy_inegi_to_console_key_for_ci_only_32chars_xxxxxx
          OMEGA_CARTRIDGE_SEC_EDGAR_PASSWORD: dummy_cartridge_sec_edgar_password_for_ci_only
          INTERNAL_API_KEY_SEC_EDGAR_TO_CONSOLE: dummy_sec_edgar_to_console_key_for_ci_only_32chars
          SEC_EDGAR_USER_AGENT: OMEGA CI ci@example.com
          INTERNAL_API_KEY_SALESFORCE_TO_CONSOLE: dummy_salesforce_to_console_key_for_ci_only_32chars_xxxx
          INTERNAL_API_KEY_SAP_HCM_TO_CONSOLE: dummy_sap_hcm_to_console_key_for_ci_only_32chars_xxxxxxxx
          INTERNAL_API_KEY_SAP_S4HANA_TO_CONSOLE: dummy_sap_s4hana_to_console_key_for_ci_only_32chars_xxxx
          INTERNAL_API_KEY_SAP_SUCCESSFACTORS_TO_CONSOLE: dummy_sap_sf_to_console_key_for_ci_only_32chars_xxxxx
          INTERNAL_API_KEY_SAP_B1_TO_CONSOLE: dummy_sap_b1_to_console_key_for_ci_only_32chars_xxxxxxxxx
        run: docker compose --env-file .env.example config --quiet

  no-compose-validation-needed:
    needs: changes
    if: needs.changes.outputs.compose != 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No compose/infra files changed; compose validation skipped."

  build:
    needs: [changes, test, compose-validate]
    if: |
      always() &&
      needs.changes.outputs.has_build_matrix == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.compose-validate.result == 'success' || needs.compose-validate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.service }} Docker image
        run: |
          context="${{ matrix.context }}"
          dockerfile="${{ matrix.context }}/Dockerfile"
          case "${{ matrix.service }}" in
            console|refinement|mcp-infra|banxico|inegi|sec_edgar)
              context="."
              dockerfile="${{ matrix.context }}/Dockerfile"
              ;;
          esac
          docker build "$context" --file "$dockerfile" --tag "${{ matrix.service }}:ci-${{ github.sha }}"

  no-build-needed:
    needs: changes
    if: needs.changes.outputs.has_build_matrix != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No service image inputs changed; Docker builds skipped."
