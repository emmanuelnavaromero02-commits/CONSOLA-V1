name: Release Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-release-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dataset: ${{ steps.detect.outputs.dataset }}
      root_tests: ${{ steps.detect.outputs.root_tests }}
      cartridge_tests: ${{ steps.detect.outputs.cartridge_tests }}
      release_full_stack: ${{ steps.detect.outputs.release_full_stack }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            previous="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "base=$previous" >> "$GITHUB_OUTPUT"

      - id: detect
        run: python3 scripts/ci_changed_areas.py --base "${{ steps.previous.outputs.base }}" --head "${{ github.sha }}"

  validate-release:
    needs: detect-release-changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: console-next/package-lock.json

      # hashicorp/setup-terraform@v3, pinned to v3.1.2.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.6.6"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r tests/requirements.txt \
            -r console/requirements.txt \
            -r vault/requirements.txt \
            -r mcp-infra/requirements.txt
          npm --prefix console-next ci

      - name: Static release tests
        run: |
          python -m pytest -q \
            tests/test_aws_compose_consistency.py \
            tests/test_aws_secrets_manager_config.py \
            tests/test_app_env_safe_default.py \
            tests/test_mcp_data_scope_source.py \
            tests/test_release_image_promotion.py \
            tests/test_v1_public_https_closure.py

      - name: Changed cartridge dataset contracts
        if: needs.detect-release-changes.outputs.dataset == 'true' || needs.detect-release-changes.outputs.root_tests == 'true'
        run: |
          python -m pytest -q \
            tests/test_sap_hcm_datasets.py \
            tests/test_sap_s4hana_datasets.py \
            tests/test_sap_successfactors_datasets.py \
            cartridges/sap_successfactors/tests/test_airflow_dag_contract.py

      - name: Terraform validation
        run: |
          terraform -chdir=infra/terraform/infra fmt -check
          terraform -chdir=infra/terraform/infra init -backend=false
          terraform -chdir=infra/terraform/infra validate

      - name: Compose config validation
        env:
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: dummy-lakehouse
          AWS_ENV_FILE: ${{ github.workspace }}/infra/terraform/deploy/.env.example
          MODECISSIONS_CONTROL_ROOM_EVIDENCE_ENV_FILE: /dev/null
          CONSOLE_URL: https://console.example.com
          WORKSPACE_PUBLIC_URL: https://workspace.example.com
          AIRFLOW_PUBLIC_URL: http://10.0.0.1:8082
          SUPERSET_PUBLIC_URL: http://10.0.0.1:8088
          APP_BASE_URL: https://console.example.com
        run: |
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml --profile sap config >/tmp/local-compose.yml
          APP_ENV=development ALLOW_RCE_TOOLS=true \
            docker compose --env-file infra/.env.example \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.dev.yml \
              --profile sap \
              config >/tmp/local-dev-compose.yml
          docker compose --env-file infra/terraform/deploy/.env.example \
            -f infra/terraform/deploy/docker-compose.aws.yml \
            -f infra/terraform/deploy/docker-compose.cartridges.yml \
            config >/tmp/aws-compose.yml

      - name: Console Next typecheck
        run: npm --prefix console-next run typecheck

      - name: Console Next lint, unit tests, and static export
        run: |
          npm --prefix console-next run lint
          npm --prefix console-next run test
          npm --prefix console-next run export:copy
          git diff --exit-code -- console/app/static/console-next

  full-stack-release-gate:
    needs: [detect-release-changes, validate-release]
    if: needs.detect-release-changes.outputs.release_full_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPEN_REPORT: "0"
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install full-stack gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r tests/requirements.txt \
            -r console/requirements.txt \
            -r refinement/requirements.txt \
            -r vault/requirements.txt \
            -r workspace/requirements.txt \
            -r mcp-infra/requirements.txt \
            -r tests/stress/requirements.txt
          for req in cartridges/*/requirements.txt; do
            python -m pip install -r "$req"
          done
          npm --prefix tests-e2e ci
          npx --prefix tests-e2e playwright install --with-deps chromium

      - name: Bootstrap local release stack
        run: |
          bash infra/bootstrap.sh
          bash infra/bootstrap-keys.sh infra/.env
          sed -i 's/^APP_ENV=.*/APP_ENV=development/' infra/.env || true
          sed -i 's/^ALLOW_RCE_TOOLS=.*/ALLOW_RCE_TOOLS=true/' infra/.env || true
          sed -i 's/^AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION=.*/AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION=true/' infra/.env || true
          grep -q '^APP_ENV=' infra/.env || echo 'APP_ENV=development' >> infra/.env
          grep -q '^ALLOW_RCE_TOOLS=' infra/.env || echo 'ALLOW_RCE_TOOLS=true' >> infra/.env
          grep -q '^AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION=' infra/.env || echo 'AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION=true' >> infra/.env
          mkdir -p data/lakehouse
          mkdir -p airflow/logs/scheduler airflow/logs/dag_processor airflow/logs/webserver
          chmod -R 777 airflow/logs
          {
            echo "TEST_EMAIL=emmanuel@local.ai"
            echo "TEST_PASSWORD=Admin123!"
            echo "BASE_URL=http://127.0.0.1:8000"
            echo "LEGACY_URL=http://127.0.0.1:8000"
            echo "BACKEND_URL=http://127.0.0.1:8000"
            echo "CONTROL_ROOM_URL=http://127.0.0.1:8000/control-room"
            echo "AIRFLOW_URL=http://127.0.0.1:8082"
            echo "SUPERSET_URL=http://127.0.0.1:8088"
            echo "MINIO_CONSOLE_URL=http://127.0.0.1:9001"
            echo "MAILHOG_URL=http://127.0.0.1:8025"
            echo "HUBSPOT_URL=http://127.0.0.1:8210"
            echo "REPLICON_URL=http://127.0.0.1:8201"
            echo "SAP_HCM_URL=http://127.0.0.1:8202"
            echo "SAP_SF_URL=http://127.0.0.1:8203"
            echo "SAP_S4_URL=http://127.0.0.1:8204"
            echo "OPEN_REPORT=0"
          } > tests-e2e/.env

      - name: Build and start full stack
        run: |
          APP_ENV=development ALLOW_RCE_TOOLS=true \
            docker compose --env-file infra/.env \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.dev.yml \
              --profile sap \
              up -d --build

      - name: Wait for healthy stack
        run: bash scripts/wait_for_health.sh

      - name: Full-stack smoke
        run: make smoke

      - name: Browser E2E
        run: make e2e

      - name: Full-stack acceptance
        run: make acceptance

      - name: Production-readiness gate
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
            echo "Beta tag detected; stress is skipped with explicit evidence."
            OMEGA_PRODUCTION_READINESS_SKIP_STRESS=1 make production-readiness
          else
            make production-readiness
          fi

      - name: Docker logs on failure
        if: failure()
        run: |
          docker compose --env-file infra/.env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml --profile sap ps || true
          docker logs mode_postgres --tail 220 2>&1 || true
          docker logs mode_postgres_gold --tail 220 2>&1 || true
          docker logs mode_minio --tail 160 2>&1 || true
          docker logs mode_refinement --tail 180 2>&1 || true
          docker logs mode_vault --tail 180 2>&1 || true
          docker logs mode_workspace --tail 180 2>&1 || true
          docker logs mode_mcp_infra --tail 180 2>&1 || true
          docker logs mode_airflow_init --tail 220 2>&1 || true
          docker logs mode_superset_init --tail 180 2>&1 || true
          docker logs mode_console --tail 160 2>&1 || true
          docker logs mode_airflow --tail 180 2>&1 || true
          docker logs mode_airflow_scheduler --tail 180 2>&1 || true

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-playwright-report-${{ github.run_attempt }}
          path: tests-e2e/playwright-report
          if-no-files-found: ignore

  verify-tag-and-candidate:
    needs: [detect-release-changes, validate-release, full-stack-release-gate]
    if: |
      always() &&
      needs.validate-release.result == 'success' &&
      needs.detect-release-changes.result == 'success' &&
      (
        needs.detect-release-changes.outputs.release_full_stack != 'true' ||
        needs.full-stack-release-gate.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      bound_manifest_digest: ${{ steps.tag.outputs.bound_manifest_digest }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Validate annotated tag, candidate authority, VERSION, and binding
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          SOURCE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          python3 scripts/release_images.py verify-release-tag \
            --source-sha "$SOURCE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --repository "$REPOSITORY" \
            --allow-main-moved \
            --portable-tag-output annotated-tag.object

      # Portable authority consumed by the repository-free canonical GCP host.
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tag-proof-${{ steps.tag.outputs.source_sha }}-${{ github.run_attempt }}
          path: annotated-tag.object
          if-no-files-found: error
          retention-days: 90

      - name: Recompute sealed 15-digest manifest before any release tag write
        id: preflight
        env:
          BOUND_MANIFEST_DIGEST: ${{ steps.tag.outputs.bound_manifest_digest }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ steps.tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_images.py promotion-preflight \
            --source-sha "$SOURCE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --bound-manifest-digest "$BOUND_MANIFEST_DIGEST" \
            --output release-promotion-preflight.json

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-promotion-preflight-${{ steps.tag.outputs.source_sha }}-${{ github.run_attempt }}
          path: release-promotion-preflight.json
          if-no-files-found: error
          retention-days: 30

  build-and-push:
    name: Promote exact candidate digest (${{ matrix.service }})
    needs: verify-tag-and-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - service: console
            context: .
            dockerfile: ./console/Dockerfile
          - service: workspace
            context: ./workspace
            dockerfile: ./workspace/Dockerfile
          - service: refinement
            context: .
            dockerfile: ./refinement/Dockerfile
          - service: vault
            context: ./vault
            dockerfile: ./vault/Dockerfile
          - service: mcp-infra
            context: .
            dockerfile: ./mcp-infra/Dockerfile
          - service: airflow
            context: ./infra/airflow
            dockerfile: ./infra/airflow/Dockerfile
          - service: replicon
            context: ./cartridges/replicon
            dockerfile: ./cartridges/replicon/Dockerfile
          - service: hubspot
            context: ./cartridges/hubspot
            dockerfile: ./cartridges/hubspot/Dockerfile
          - service: banxico
            context: .
            dockerfile: ./cartridges/banxico/Dockerfile
          - service: inegi
            context: .
            dockerfile: ./cartridges/inegi/Dockerfile
          - service: sec_edgar
            context: .
            dockerfile: ./cartridges/sec_edgar/Dockerfile
          - service: sap_hcm
            context: ./cartridges/sap_hcm
            dockerfile: ./cartridges/sap_hcm/Dockerfile
          - service: sap_s4hana
            context: ./cartridges/sap_s4hana
            dockerfile: ./cartridges/sap_s4hana/Dockerfile
          - service: sap_successfactors
            context: ./cartridges/sap_successfactors
            dockerfile: ./cartridges/sap_successfactors/Dockerfile
          - service: salesforce
            context: ./cartridges/salesforce
            dockerfile: ./cartridges/salesforce/Dockerfile

    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.verify-tag-and-candidate.outputs.source_sha }}

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Promote registry manifest without rebuilding
        env:
          BOUND_MANIFEST_DIGEST: ${{ needs.verify-tag-and-candidate.outputs.bound_manifest_digest }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-tag-and-candidate.outputs.tag_object_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.verify-tag-and-candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          revalidate_remote_tag() {
            python3 scripts/release_images.py verify-remote-tag-object \
              --repository "$REPOSITORY" \
              --release-tag "$RELEASE_TAG" \
              --expected-tag-object-sha "$EXPECTED_TAG_OBJECT_SHA"
          }
          revalidate_remote_tag
          python3 scripts/release_images.py promote-one \
            --service "${{ matrix.service }}" \
            --source-sha "$SOURCE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --bound-manifest-digest "$BOUND_MANIFEST_DIGEST"
          revalidate_remote_tag

  verify-release-images:
    needs: [verify-tag-and-candidate, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.verify-tag-and-candidate.outputs.source_sha }}

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.8"

      - name: Verify exact digest promotion 15/15
        env:
          BOUND_MANIFEST_DIGEST: ${{ needs.verify-tag-and-candidate.outputs.bound_manifest_digest }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-tag-and-candidate.outputs.tag_object_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.verify-tag-and-candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          revalidate_remote_tag() {
            python3 scripts/release_images.py verify-remote-tag-object \
              --repository "$REPOSITORY" \
              --release-tag "$RELEASE_TAG" \
              --expected-tag-object-sha "$EXPECTED_TAG_OBJECT_SHA"
          }
          revalidate_remote_tag
          python3 scripts/release_images.py verify-release \
            --source-sha "$SOURCE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --bound-manifest-digest "$BOUND_MANIFEST_DIGEST" \
            --output release-images.json
          revalidate_remote_tag

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-images-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-images.json
          if-no-files-found: error
          retention-days: 90
