name: Deploy AWS via SSM

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Immutable release tag to deploy, for example v1.45.5-beta."
        required: true
        type: string
      image_tag:
        description: "Immutable GHCR image tag. Defaults to deploy_ref and must be a v* release tag."
        required: false
        type: string
      service:
        description: "Optional single docker compose service to redeploy."
        required: false
        type: string
      require_data:
        description: "Fail deployment unless /readyz?require_data=1 is green."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production deploy through SSM
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_APP_INSTANCE_ID: ${{ vars.AWS_APP_INSTANCE_ID || secrets.AWS_APP_INSTANCE_ID }}
      PUBLIC_CONSOLE_URL: ${{ vars.PUBLIC_CONSOLE_URL || 'http://modecissions-public-255609366.us-east-1.elb.amazonaws.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment inputs
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_ref="${{ inputs.deploy_ref }}"
          image_tag="${{ inputs.image_tag }}"
          service="${{ inputs.service }}"
          if [[ -z "$image_tag" ]]; then
            image_tag="$deploy_ref"
          fi
          if [[ ! "$deploy_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::deploy_ref must be a published release tag such as v1.45.5-beta"
            exit 1
          fi
          if [[ ! "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::image_tag must be a published GHCR release tag such as v1.45.5-beta"
            exit 1
          fi
          if [[ "$deploy_ref" != "$image_tag" ]]; then
            echo "::error::deploy_ref and image_tag must match for production deploys"
            exit 1
          fi
          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve app EC2 instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          instance_id="${AWS_APP_INSTANCE_ID}"
          if [[ -z "$instance_id" ]]; then
            instance_id="$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=modecissions-app" "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text)"
          fi
          if [[ -z "$instance_id" || "$instance_id" == "None" ]]; then
            echo "::error::Could not resolve modecissions app instance id"
            exit 1
          fi
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Send deploy command over SSM
        id: ssm
        shell: bash
        env:
          DEPLOY_REF: ${{ steps.deploy.outputs.deploy_ref }}
          IMAGE_TAG: ${{ steps.deploy.outputs.image_tag }}
          SERVICE: ${{ steps.deploy.outputs.service }}
          REQUIRE_DATA: ${{ inputs.require_data }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > ssm-params.json
          import json
          import os
          import shlex

          deploy_ref = os.environ["DEPLOY_REF"]
          image_tag = os.environ["IMAGE_TAG"]
          service = os.environ.get("SERVICE", "").strip()
          require_data = os.environ.get("REQUIRE_DATA", "true").lower() == "true"
          ghcr_actor = os.environ["GHCR_ACTOR"]
          ghcr_token = os.environ["GHCR_TOKEN"]

          def set_env_line(key: str, value: str) -> str:
              quoted = shlex.quote(f"{key}={value}")
              return (
                  f"if sudo grep -q '^{key}=' infra/terraform/deploy/.env; then "
                  f"sudo sed -i -E 's|^{key}=.*|{key}={value}|' infra/terraform/deploy/.env; "
                  f"else echo {quoted} | sudo tee -a infra/terraform/deploy/.env >/dev/null; fi"
              )

          def retry_curl(url: str) -> str:
              quoted = shlex.quote(url)
              return (
                  "for i in $(seq 1 60); do "
                  f"curl -fsS {quoted} && break; "
                  "if [ \"$i\" -eq 60 ]; then exit 1; fi; "
                  "sleep 5; "
                  "done"
              )

          commands = [
              "set -eu",
              "cd /opt/modecissions",
              "test -f infra/terraform/deploy/.env",
              set_env_line("APP_ENV", "production"),
              set_env_line("DEPLOY_REF", deploy_ref),
              set_env_line("IMAGE_TAG", image_tag),
              "install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.ssh",
              "ssh-keyscan -H github.com >> /home/ubuntu/.ssh/known_hosts",
              "chown ubuntu:ubuntu /home/ubuntu/.ssh/known_hosts",
              "chmod 600 /home/ubuntu/.ssh/known_hosts",
              "sudo -u ubuntu git fetch --tags origin",
              f"sudo -u ubuntu git checkout --detach {shlex.quote(deploy_ref)}",
              "sudo bash infra/bootstrap-keys.sh infra/terraform/deploy/.env",
              "trap 'sudo docker logout ghcr.io >/dev/null 2>&1 || true' EXIT",
              (
                  f"printf %s {shlex.quote(ghcr_token)} | "
                  f"sudo docker login ghcr.io -u {shlex.quote(ghcr_actor)} "
                  "--password-stdin >/dev/null"
              ),
          ]
          if service:
              commands.append("export OMEGA_SKIP_WORKTREE_UPDATE=1")
          if service:
              update_cmd = "sudo OMEGA_SKIP_WORKTREE_UPDATE=1 bash infra/terraform/deploy/update.sh"
          else:
              update_cmd = "sudo bash infra/terraform/deploy/update.sh"
          if service:
              update_cmd += " " + shlex.quote(service)
          deploy_log = "/tmp/omega-deploy.log"
          heartbeat_update = (
              f"({update_cmd} > {deploy_log} 2>&1) & "
              "deploy_pid=$!; "
              "while kill -0 \"$deploy_pid\" 2>/dev/null; do "
              "echo \"deploy heartbeat $(date -u +%H:%M:%S)\"; "
              "sleep 20; "
              "done; "
              "wait \"$deploy_pid\" || "
              f"(status=$?; tail -n 200 {deploy_log}; exit \"$status\")"
          )
          commands.extend([
              f"rm -f {deploy_log}",
              heartbeat_update,
              f"tail -n 120 {deploy_log} || true",
              retry_curl("http://127.0.0.1:8000/healthz"),
              retry_curl("http://127.0.0.1:8000/readyz"),
          ])
          if require_data:
              commands.append(retry_curl("http://127.0.0.1:8000/readyz?require_data=1"))
          print(json.dumps({"commands": commands}))
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "OMEGA deploy ${DEPLOY_REF}" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deploy completion
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::SSM command did not finish before timeout"
          exit 1

      - name: Public readiness check
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            local url="$1"
            for _ in $(seq 1 60); do
              curl -fsS "$url" && return 0
              sleep 5
            done
            curl -fsS "$url"
          }
          retry_curl "${PUBLIC_CONSOLE_URL}/healthz"
          retry_curl "${PUBLIC_CONSOLE_URL}/readyz"
          if [[ "${{ inputs.require_data }}" == "true" ]]; then
            retry_curl "${PUBLIC_CONSOLE_URL}/readyz?require_data=1"
          fi
